notes = "Extracted from task-loop stores (contracts/stores.py JsonStore, stores/files.py FileDocSet). The msgspec and version-envelope coupling (wire.load/dump) is replaced by injected load/dump callables and ForeignVersionError. Builds on atomic-io (evolve, not duplicate: atomic-io is the write half only). FileTickets stays in the host (a hard-link lock protocol). Candidate contract: packages/any-json-doc/CONTRACT.md. Consumers adopt separately; no release tag created by this change."
