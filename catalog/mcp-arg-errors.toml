# One MicroSoftware INSTANCE (glossary spine; resolution 0003 — flat files).
name = "mcp-arg-errors"
kind = "any-*"
tier = "T2"
release = "mcp-arg-errors-v0.2.0"
capability = "Stop caring how a failed FastMCP tool call reaches an agent — whatever a tool body raised comes back as an is_error result carrying the typed error's envelope in structured content and text rendered from it (an untyped failure a defect with only a logged trace id); and a call with arguments that do not fit the schema — one middleware hands the consumer a typed ArgumentFault naming the argument, and an argument the tool does not have is reported as a stale client tool list with a hint to reconnect, never accepted."
implementation = "ours"
status = "candidate"
owner = "yoselabs"
notes = "Promoted from a2kay's ArgumentErrorMiddleware (mcp/server.py) when removing update.unset froze every running agent session: the client kept sending the removed argument from its cached schema and got pydantic's 'Unexpected keyword argument' with no next step (intro.max_entities_per_section did the same earlier). The owner ruled out accepting dead arguments, so the fix is the error, generic for any FastMCP server. Born candidate. v0.2.0 folds in the error wire (ErrorWire) from a2kay mcp/server.py instead of a new package: the same concern, every failed call; typed errors are structural (kind + to_envelope_dict), so the package does not depend on a2effect."
