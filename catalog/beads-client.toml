notes = "Extracted from task-loop's src/taskloop/adapters/bd.py (bd 1.3.1). Named for the one tool it wraps (precedent git-porcelain). Stdlib only. Candidate contract: packages/beads-client/CONTRACT.md. Task-loop's held_* marks, slot policy and filler wording stay in task-loop. Dolt lock-retry words come from strings in the bd 1.3.1 binary, not a live capture. Single-task reads expose TaskReadClient and an owning semantic fake/shared contract. Consumed requirements and dependencies are validated; only complete issue-absence diagnostics become missing tasks. Consumer adoption is separate."
