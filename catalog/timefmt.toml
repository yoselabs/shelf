# One MicroSoftware INSTANCE (glossary spine; ADR 0003 — flat files).
name = "timefmt"
kind = "primitive"
tier = "T0"
release = "timefmt-v0.2.0"
capability = "Stop caring how to render a duration, a wait or a count — adaptive formatters whose units match magnitude (fmt_dur: ms → 1-decimal s → integer s → m:ss; fmt_span and fmt_until: d/h/m reading now once a moment has passed; human_count: 950 → 12k → 1.5M), no wasted precision."
implementation = "ours"
status = "candidate"
owner = "yoselabs"
notes = "Promoted from a2web (its utils/time.fmt_dur — the single place durations were formatted). Zero-dependency pure function, four-tier rule. Born candidate. v0.2 (shelf-s1): fmt_span, fmt_until, human_count — merges delegate route.fmt_dur (secs), task-loop dash/signals.dur and .human; the d/h form of delegate wins over signals.dur's days-only."
