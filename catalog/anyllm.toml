# One MicroSoftware INSTANCE (glossary spine; resolution 0003 — flat files).
# The catalog holds instances; the glossary holds types. Files are truth
# (constitution I); catalog/README.md is DERIVED — run `make catalog`.
name = "anyllm"
kind = "any-lib"                 # primitive | any-lib | composite | cli | framework | config-preset
tier = "T1"                      # T0 primitive · T1 any-* · T2 composite
release = "anyllm-v0.6.0"        # current git tag (v0.1.0 stays tagged for un-upgraded consumers)
capability = "Stop caring which LLM provider is underneath — which backend serves (a single pin, or an ordered auto-select with runtime fallback) and whether a (provider, model) pair is affordable before you spend."
implementation = "hybrid-adapter"  # ours | third-party | hybrid-adapter
status = "active"                # candidate | active | deprecated | retired
owner = "Denis Tomilin"
notes = "One async, structured completion contract (LLMProvider) → a rich Completion (text + token/cost/latency); fail-loud AnyLLMError. Four backends behind one Capability: claude-code-cli (stdlib), claude-code-sdk, anthropic-api, openai-compatible (each SDK an opt-in extra). v0.2.0 evolved the v0.1 sync str contract to this superset per resolution 0007 (the monotonicity test) — the a2web Provider tier promoted in, not split off as a sibling. v0.3.0 added the ProviderName enum; v0.4.0 split available()/usable(); v0.5.0 added the anyllm.cost submodule (CostPolicy, assert_within_budget, with_cost_guard, CostViolation, DEFAULT_COST_POLICY) — a pre-spend guard keyed on ProviderName so a metered provider blocks an expensive model BEFORE the call, purely additive per resolution 0007. v0.6.0 added resolve_provider + DEFAULT_ORDER (anyllm.select) — ordered auto-selection: walk a priority order (the host's, or the shipped default), keep the buildable+available backends, fold them into one provider that falls back at RUNTIME on a retryable AnyLLMError. Spend-safety is structural: CostViolation is a RuntimeError, not an AnyLLMError, so a budget refusal propagates through the fallback instead of rolling onto a metered backend to 'recover'. The order (which/what priority) stays the host's policy, passed in; a per-candidate wrap hook attaches the cost guard so it keys on each real backend id. 'auto' is a selection outcome, never a ProviderName member. Purely additive per resolution 0007. Cache-tier token→cost accounting rides inside; extract as a shared T0 only if a non-LLM holder wants it (reconcile-later)."
