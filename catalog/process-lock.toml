# One MicroSoftware INSTANCE (glossary spine; ADR 0003 — flat files).
name = "process-lock"
kind = "primitive"
tier = "T0"
release = "process-lock-v0.2.0"
capability = "Stop caring how one process claims a path — an exclusive flock the kernel drops when its holder dies (kill -9 included): refuse at once or wait with a timeout and a waiting callback, a JSON holder record (pid, created, label, meta) readable without the lock, a held lock never broken (a dead recorded pid is reported, not acted on), re-entrant within a process or opt-in non-reentrant, non-inheritable so a child never keeps it."
implementation = "ours"
status = "candidate"
owner = "yoselabs"
notes = "Promoted from a2kay (core/owner_lock.py, the one-owner rule). a2kay keeps OwnerLock as the seam that turns LockHeldError into owner_conflict with its vault wording. held() replaces a2kay's test reading the private registry. v0.2.0 added timeout/on_wait/holder()/reentrant=False for task-loop (VEND2a). POSIX, stdlib only. Born candidate."
