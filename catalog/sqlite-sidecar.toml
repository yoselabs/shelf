# One MicroSoftware INSTANCE (glossary spine; resolution 0003 — flat files).
name = "sqlite-sidecar"
kind = "primitive"
tier = "T0"
release = "sqlite-sidecar-v0.2.0"
capability = "Stop caring how to open a SQLite sidecar file, and stop rediscovering what SQLite does not warn you about — the WAL/autocommit/extension open, an immediate transaction that nests as a savepoint, busy is not corruption, an integrity check needs a fresh connection, -wal/-shm travel with a file set aside, a time column that sorts as time, and a derived store marked while serving, set aside at the next start and emptied on a schema change."
implementation = "ours"
status = "candidate"
owner = "yoselabs"
notes = "Promoted from a2kay (services/sqlite_sidecar.py) when its last DuckDB stores moved to SQLite (a2kay sqlite-graph-and-logs): three consumers in one app — two derived indexes that set aside and rebuild (graph, search; search loads sqlite-vec and keeps a writer and a reader connection), one append-only log that never does (run history; the audit log became JSON lines in a2kay lean-logs). The sibling of duckdb-sidecar, same shape: functions over sqlite3.Connection, not a lifecycle base class. Stdlib only. v0.2.0 adds the derived-store policy from a2kay services/derived_store.py, app.py and graph_store_schema.py: mark_for_rebuild, needs_rebuild, prepare, ensure_schema; set_aside clears the mark. Born candidate."
