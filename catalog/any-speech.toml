# One MicroSoftware INSTANCE (glossary spine; ADR 0003 — flat files).
name = "any-speech"
kind = "composite"
tier = "T2"
release = "any-speech-v0.8.0"
capability = "Stop caring which engine turns speech into words, turns and voices — one versioned Transcript (word times, probabilities, speakers, provenance with the audio hash, settings, duration and peak memory) from engines behind Transcriber, Diarizer and Embedder ports; FluidAudio's CLI (Parakeet v3 or Ultra, Nemotron 3 diarisation) and parakeet-mlx as adapters; parallel by slots (an any-lease pool of N transcriptions and M diarisations machine-wide; Speech.transcribe(path) waits for a unit; a Drain runs a folder with N workers that claim one file each); a failure record keyed to the file that never stalls a batch; a peak-memory guard (4 GB default); a sherpa-onnx voice embedding to match a host across files; an any-speech CLI."
implementation = "ours"
status = "candidate"
owner = "yoselabs"
notes = "Promoted from channel-research scripts/transcribe.py (flock, drain, error file, MLX cache cap) and Reco 2's Transcribing/diarize-speakers decisions (Swift; read, not copied). Measured 2026-11-19 on an M3 Max (openspec/changes/any-speech/measurement.md): FluidAudio Parakeet v3 0.2-0.7 GB RSS, 57 min in 12 s; parakeet-mlx chunked 3.3-3.4 GB MLX peak (4.09 GB process footprint at 57 min), 14.5 GB unchunked; mlx-whisper 4.16 GB at 57 min, refused. Composes any-lease, process-lock, atomic-io, content-digest, app-dirs and verb-cli; engines are optional extras imported lazily, so the core needs none. No Reco-markdown reader. POSIX, Apple Silicon for the engines. Born candidate; 0.2.0 added the default path and the model cards; 0.3.0 makes it words-only, one stored file beside the audio, speakers opt-in, slots sized from the machine."
