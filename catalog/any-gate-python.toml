capability = "Which package suites a change reaches in a uv workspace, and the key each suite passed under — workspace(repo) builds the package graph from pyproject dependencies, optional dependencies and dependency groups; lock_touched reads uv.lock per package through `uv export` so a release does not rerun every suite; affected(repo, changed) names the pytest paths (the changed packages, their dependants, and the repo's own tests); plan(repo, paths) gives each suite its fingerprint for any-gate's receipts; `run` is the pytest runner any-gate calls: stages parallel (xdist, sized to the tests and the box), serial and quarantine (a failing quarantined test is reported and never blocks), chosen by a pytest plugin so the repo's own -m default holds. What counts as no-effect, and which repo tests are gated on which inputs, is read from [tool.any-gate.python] in the root pyproject."
implementation = "ours"
status = "candidate"
owner = "yoselabs"
notes = "Extracted from the shelf's tools/affected.py, per ADR 0021 and docs/missions/gate-kit-package (the Python adapter of the gate core). Stdlib only; shells out to uv and git. Born candidate."
