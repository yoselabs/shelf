notes = "Promoted from a2web (_plugin.py) during the remaining-substrate sweep. Zero deps, stdlib only. Dropped a2web's settings_prefix coupling; the logger is INJECTED (default getLogger('plugin_surface'), logger= override) rather than hardcoded to a consumer name. Surface: PluginManifest[T] + Unavailable + load_surface / load_surface_sorted; a plugin is a no-side-effects module declaring MANIFEST. a2web keeps its own _manifests/ surfaces (llm_providers, handlers, tiers, sinks, eval_systems) on top and injects get_logger() at 6 sites. Born candidate."
