notes = "Generalized from a2web's archived add-agent-invoked-feedback-tool change (a2web-only, url-scoped). The second FastMCP-coupled shelf package after mcp-result-wire. v0.1.0 attached ctx.session_id for correlation; reversed in v0.2.0 after a2web's own adoption found it made the tool's function require a live MCP session, breaking a2web's CLI (which calls tool functions directly). Reports are now self-contained by design — no correlation ID, the tool's own description asks the agent to include what context it needs. v0.3.0 added optional request/response fields — note/wanted alone left 'what did it actually return' with no first-class field. a2web's own adoption tracked separately (adopt-shelf-mcp-feedback). Born candidate."
