# One MicroSoftware INSTANCE (glossary spine; ADR 0003 — flat files).
name = "stream-proc"
kind = "primitive"
tier = "T0"
release = "stream-proc-v0.8.0"
capability = "Stop caring how a child is run, watched and killed — one call runs it in a session of its own, streams its stdout and stderr lines to callbacks (no deadlock on large output, torn last line flushed) under a wall timeout, an idle timeout and a stop flag, and stops its whole tree (SIGTERM, grace, SIGKILL, a sweep of descendants that left the group, a proof it is dead), with pid-reuse-safe liveness from /proc or libproc and a SIGTERM landing during the spawn still stopping the child; capture() runs to the end with text output (exit 124 on timeout, optional heartbeat), capture_bytes() the same with exact bytes, stdin input and inherited stdio, and stop_pid(pid, start) stops a process it did not spawn only while its start token matches."
implementation = "ours"
status = "candidate"
owner = "yoselabs"
notes = "Promoted from task-loop (core/procs.py: run_proc, kill_tree, TermHold, popen_held, prove_dead) and delegate (adapters/procs.py, app/watch.py Watchdog); neither consumer's worker line, lock, log or env policy is in here. A new package, not any-proc: any-proc.run is a one-shot JSON-marker call and any-proc.supervise keeps a daemon alive; this is the streamed, killable run. POSIX, stdlib only; Linux /proc and macOS libproc (ctypes) behind one process-table API from 0.2.0; group_alive(pgid) needs no table. Born candidate. Registered start gates target exec behind durable boot-aware identity registration; post-permit startup uncertainty retains identity. This does not establish full descendant stop or restart-safe execution. 0.6.0: run_registered is that gate plus run's supervision (stdin /dev/null, stderr merged, exec failure after registration as a Result)."
