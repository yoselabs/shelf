# One MicroSoftware INSTANCE (glossary spine; ADR 0003 — flat files).
name = "stream-proc"
kind = "primitive"
tier = "T0"
release = "stream-proc-v0.1.0"
capability = "Stop caring how a child is run, watched and killed — one call runs it in a session of its own, streams its stdout and stderr lines to callbacks (no deadlock on large output, torn last line flushed) under a wall timeout, an idle timeout and a stop flag, and stops its whole tree (SIGTERM, grace, SIGKILL, a sweep of descendants that left the group, a proof it is dead), with pid-reuse-safe liveness from /proc and a SIGTERM landing during the spawn still stopping the child."
implementation = "ours"
status = "candidate"
owner = "yoselabs"
notes = "Promoted from task-loop (core/procs.py: run_proc, kill_tree, TermHold, popen_held, prove_dead) and delegate (adapters/procs.py, app/watch.py Watchdog); neither consumer's worker line, lock, log or env policy is in here. A new package, not any-proc: any-proc.run is a one-shot JSON-marker call and any-proc.supervise keeps a daemon alive; this is the streamed, killable run. POSIX, stdlib only; no start token or descendant sweep without /proc. Born candidate."
