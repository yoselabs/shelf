capability = "Stop caring how to open a DuckDB sidecar connection, and stop rediscovering what DuckDB does not document — the connect dance, the lock-conflict signature, the index dance a column rename needs, and the two writer rules (content-hash write-skip, deferred FTS rebuild) that have no code shape."
