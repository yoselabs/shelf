owner = "Denis Tomilin"
notes = "Promoted from a2kay (its core/duckdb_sidecar.py, shared by graph/audit/search/job-history stores). v0.2.0 evolved it past connection acquisition with the two hazards that follow an open connection: is_lock_conflict (a second writer is an IOException identical in class to a missing file) and rename_column (a secondary index blocks ALTER TABLE RENAME COLUMN). Still not a lifecycle base class — schema, migrations and queries stay with each store. Born candidate."
