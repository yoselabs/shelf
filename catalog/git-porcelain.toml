# One MicroSoftware INSTANCE (glossary spine; ADR 0003 — flat files).
name = "git-porcelain"
kind = "any-lib"
tier = "T1"
release = "git-porcelain-v0.7.0"
capability = "Stop caring about git subprocess plumbing and credential fidelity."
implementation = "ours"          # pure surface over the git binary; no third-party lib to swap
status = "active"
owner = "yoselabs"
notes = "A pure, fail-loud surface over the git binary, preserving the user's credential/config fidelity. v0.7.0: a typed `Git` protocol (the ~40 git operations a driver such as task-loop makes on one checkout), `RealGit` over the binary with a memo for read-only answers (common_dir, toplevel, branch, config, remote URL) and an explicit invalidate, and `FakeGit`/`FakeRemote` in git_porcelain.testing (refs, trees, index, config, worktrees, remotes in memory, no subprocess); one @contract Gherkin suite runs the same scenarios against both so the fake cannot drift. v0.6.1: every git call drops a hook's GIT_DIR/GIT_WORK_TREE, so -C <vault> is always that repo. v0.6.0: push, fetch, lfs_push and lfs_fetch take config= (git -c overrides) like commit_paths. v0.5.0: git_porcelain.testing — hermetic_env/apply_hermetic_env (no host config, no leaked GIT_DIR, the quiet set opt-out, identity a parameter) and git(cwd, *args); no pytest import. Its own tests use these helpers."
