# One MicroSoftware INSTANCE (glossary spine; ADR 0003 — flat files).
name = "git-porcelain"
kind = "any-lib"
tier = "T1"
release = "git-porcelain-v0.20.0"
capability = "Stop caring about git subprocess plumbing and credential fidelity."
implementation = "ours"          # pure surface over the git binary; no third-party lib to swap
status = "active"
owner = "yoselabs"
notes = "A pure, fail-loud surface over the git binary, preserving the user's credential/config fidelity. v0.20.0: Worktree.exclude(patterns) adds ignore rules to one checkout alone (config.worktree core.excludesFile; capture, dirty, clean and plain git status honor them), park(base, keep_ignored=True) first pins the checkout's ignored files by exact path so they stay ignored and on disk at the base (IgnoredFilesWouldBeOverwritten when the base tracks one). v0.19.0: Worktree.capture() names the final working state as a tree through a private index copy (indexed paths stay, ignored untracked files stay out, unmerged and nested repositories refused), Repo.commit_tree(tree, parents, message, when=) makes a commit with exactly those parents (same inputs and when give the same commit), Repo.update_ref(ref, new, expected=) is a compare-and-swap returning RefUpdated or RefMoved. v0.18.1: a bounded read runs in its own process group and its timeout kills the group (a blocked Git child does not outlive it). v0.18.0: RealRepo(read_timeout=seconds) kills a read-only command after that long and raises GitTimeout, with GIT_OPTIONAL_LOCKS=0; writes are never bounded. v0.17.0: Repo.remote_urls(remote, push=False) lists every URL (remote get-url --all [--push]): a push goes to every pushurl, else every url; FakeRepo.add_config adds a second value. v0.16.0: Repo.squash(onto, head, message) makes one commit (parent onto, tree head merged onto onto) in Git objects only through merge-tree and commit-tree, returning Squashed(sha, tree) or Conflicted(paths); remote_url(remote, push=True) reads the push URL (pushurl, pushInsteadOf). v0.15.0: Worktree.clean(nested=True) also removes nested repositories (git clean -ff), and dirty(ignored_under=['.']) lists the ignored files of the whole checkout in the fake too. v0.14.0: RealRepo(pins={checkout: git_dir}) pins each checkout to the caller's verified git directory on every call, never re-reading <checkout>/.git (a swapped pointer is not followed), and a call with no pin is NotARepo before any git process. v0.13.0: canonical local identity preserves typed origin-read failures and filesystem-boundary absence, with explicit readonly result types. RealRepo(ambient=...) snapshots the ambient env and git path once per repo (no per-call os.environ scan or PATH search). v0.12.1: git 2.53 fetch losing a ref-create race (reference already exists) is a retryable RefRace. v0.9.1: RefRace is retryable only for real lock contention (File exists), WorktreeRemoveRefused keeps the exit-code prefix and git hint, worktree_state rename and unmerged scenarios, UP047 fixes. v0.9.0: worktree pool completeness (add_worktree force, prune_worktrees, drop_worktree missing_ok + WorktreeRemoveRefused reason, -z listing that rejects truncated records, worktree_state bytes); RefRace is retryable only for lock contention (a stale old-oid cannot succeed on retry). v0.8.0: plumbing a driver needs (ls_remote, branches, delete_ref_at, config_get/config_entries, symbolic_ref, merge_ff, pull_rebase, check_ignore, ls_files with scope, typed read failures MissingRevision/NotARepo/IndexLocked/RefRace/BranchPinned, snapshot with declared ignored inputs), each with a fake counterpart under the same contract. v0.7.0: typed `Repo` and `Worktree` protocols (23 intent operations a driver such as task-loop makes; frozen result unions, expected conditions as variants, `GitUnavailable` for infrastructure), `RealRepo` over the binary (env, hooks and identity owned inside, memo with file-signature validation, snapshot skip), and `FakeRepo`/`FakeWorktree`/`FakeRemote` in git_porcelain.testing (domain-state model with knobs and documented fidelity gaps); one @contract Gherkin suite of per-operation scenarios runs against both so the fake cannot drift. Push is `push(dst)` only; a repo needing more uses its pre-push hook. v0.6.1: every git call drops a hook's GIT_DIR/GIT_WORK_TREE, so -C <vault> is always that repo. v0.6.0: push, fetch, lfs_push and lfs_fetch take config= (git -c overrides) like commit_paths. v0.5.0: git_porcelain.testing — hermetic_env/apply_hermetic_env (no host config, no leaked GIT_DIR, the quiet set opt-out, identity a parameter) and git(cwd, *args); no pytest import. Its own tests use these helpers."
