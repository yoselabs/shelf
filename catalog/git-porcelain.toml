# One MicroSoftware INSTANCE (glossary spine; ADR 0003 — flat files).
name = "git-porcelain"
kind = "any-lib"
tier = "T1"
release = "git-porcelain-v0.7.0"
capability = "Stop caring about git subprocess plumbing and credential fidelity."
implementation = "ours"          # pure surface over the git binary; no third-party lib to swap
status = "active"
owner = "yoselabs"
notes = "A pure, fail-loud surface over the git binary, preserving the user's credential/config fidelity. v0.7.0: typed `Repo` and `Worktree` protocols (23 intent operations a driver such as task-loop makes; frozen result unions, expected conditions as variants, `GitUnavailable` for infrastructure), `RealRepo` over the binary (env, hooks and identity owned inside, memo with file-signature validation, snapshot skip), and `FakeRepo`/`FakeWorktree`/`FakeRemote` in git_porcelain.testing (domain-state model with knobs and documented fidelity gaps); one @contract Gherkin suite of per-operation scenarios runs against both so the fake cannot drift. Push is `push(dst)` only; a repo needing more uses its pre-push hook. v0.6.1: every git call drops a hook's GIT_DIR/GIT_WORK_TREE, so -C <vault> is always that repo. v0.6.0: push, fetch, lfs_push and lfs_fetch take config= (git -c overrides) like commit_paths. v0.5.0: git_porcelain.testing — hermetic_env/apply_hermetic_env (no host config, no leaked GIT_DIR, the quiet set opt-out, identity a parameter) and git(cwd, *args); no pytest import. Its own tests use these helpers."
