owner = "Denis Tomilin"
notes = "Promoted from a2web (packages/llm_extract/wobble/_internal.py). Logger INJECTED (default getLogger('llm_wobble'), logger= override) — the D2 note was stale (a2web emitted on getLogger('a2web'), not 'a2kit'); the real fix is injection, matching plugin-surface. Surface: parse_with_policy (object envelopes) + parse_list_with_policy (JSON-array envelopes); a STRICT miss raises ParseError, WobbleSkip propagates, recovered wobbles fire a structured log key. Dropped the apply_policy back-compat shim. a2web keeps its product WobblePolicy tables (_policies.py) importing WobblePolicy / WobbleTolerance from here. Born candidate. v0.2.0 added strip_fenced_blocks (the funnel's inverse: keep the prose, drop the JSON). v0.3.0 added WobbleTolerance.OPTIONAL — substitutes like DEFAULT but emits nothing, because an absent CONTRACT-optional field is not a wobble; only the caller's prompt knows which fields those are, so the vocabulary carries the distinction rather than the funnel inferring it. The `release` field was stale at v0.1.0 through the v0.2.0 delivery; corrected here."
