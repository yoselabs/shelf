capability = "Stop caring how to parse untrusted LLM JSON safely — the single funnel that owns json.loads, applies a per-field WobblePolicy (STRICT / DERIVE / DEFAULT / OPTIONAL / SKIP), and returns an opaque Wobbled type a payload fabricated outside the funnel cannot forge."
