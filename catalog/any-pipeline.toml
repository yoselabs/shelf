# One MicroSoftware instance; its executable contract lives with the package.
name = "any-pipeline"
kind = "any-lib"
tier = "T1"
release = "any-pipeline-v0.2.0"
capability = "Stop hand-writing pipelines: async stages as typed values composed with >> and gather, each bounded by a required Limit (calls, seconds, tries), failures recorded per item and never swallowed, a record per stage run, and a ruff preset that bans the raw threads, sleeps and orphan tasks it replaces. A wrong edge, a missing limit, a sync function or an unhandled failure case is a type error."
implementation = "ours"
status = "candidate"
owner = "yoselabs"
notes = "Extracted from any-speech's Pipeline (transcribe in parallel with diarize, then label) and Drain's per-item failure isolation. Stdlib plus atomic-io (FileStore only), asyncio-native; no second sync API (constitution III), a sync script runs asyncio.run(run(...)). Not here: the keyed-job queue (claim, cross-process slots, failure records), which stays in any-speech until a second consumer needs it (bead shelf-ni4w, any-drain). Timeouts are real for awaiting stages and child processes; a blocking() stage is abandoned, not stopped. Born candidate; any-speech 0.4.0 is its first consumer."
