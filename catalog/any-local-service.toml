name = "any-local-service"
kind = "any-lib"
tier = "T1"
release = "any-local-service-v0.1.0"
capability = "Hold one local ASGI service: loopback-only serving, browser cookie exchange over a header token gate, Host/Origin refusal, public readiness stages, bounded graceful shutdown, atomic endpoint discovery and build-skew refusal."
implementation = "hybrid-adapter"
status = "candidate"
owner = "yoselabs"
notes = "Extracted from ogy web/serve.py and web/token.py, plus a2kay transport healthz/readiness/response_once/version and serve-time endpoint/log handling. Composes asgi-token-gate, async-scope and atomic-io; never imports either donor. LocalService is the held domain value. Loop-lag diagnostics, donor APIs, token file locations, environment policy and MCP wiring stay local. No consumer has been repointed or release tag created; reconcile after adoption."
