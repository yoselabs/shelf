notes = "Promoted from a2web (`lazy.py` + `scope.py`, what survived a2kit's 599-line DI container). NOT a container: no registry, no resolution order, no graph — if it grows one, the wrong thing is being solved. Second consumer identified in a2kay `serve.py`, which hand-rolls the same lifecycle with AsyncExitStack + three bare `.close()` calls. v0.2.0 added the `async_scope.asgi` submodule (extra `asgi`, lazy uvicorn import, base stays dependency-free), retiring a2kay `net_transport.py`: three failures that are all a scope refusing to close cleanly, verified over a real loopback socket in the default gate under the `net` marker. Born candidate."
