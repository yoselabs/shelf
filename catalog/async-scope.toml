name = "async-scope"
kind = "primitive"
tier = "T1"
release = "async-scope-v0.3.0"
capability = "Stop hand-rolling async resource teardown — LIFO unwind that never strands what it holds, background tasks stopped and waited for in their place, lazy thunks that build at most once under concurrency, a thread whose cancel waits for it to finish, and (extra `asgi`) an ASGI app served on a loopback port past the three uvicorn traps that only show up on the way out."
implementation = "ours"          # stdlib AsyncExitStack is the alternative and is wrong for two named reasons
status = "candidate"
owner = "yoselabs"
notes = "Promoted from a2web (`lazy.py` + `scope.py`, what survived a2kit's 599-line DI container). NOT a container: no registry, no resolution order, no graph — if it grows one, the wrong thing is being solved. Second consumer identified in a2kay `serve.py`, which hand-rolls the same lifecycle with AsyncExitStack + three bare `.close()` calls. v0.2.0 added the `async_scope.asgi` submodule (extra `asgi`, lazy uvicorn import, base stays dependency-free), retiring a2kay `net_transport.py`: three failures that are all a scope refusing to close cleanly, verified over a real loopback socket in the default gate under the `net` marker.  v0.3.0 added to_thread_joined from a2kay core/off_loop.py: asyncio.to_thread raises CancelledError while its thread keeps running, so a scope could close a store under live work. Also v0.3.0 (same unreleased version): ResourceScope.spawn from a2kay serve.py, whose lifespan cancelled its services and gathered them by hand; a2web llm_eval/live_sink.py hand-rolls the same cancel-and-await. Born candidate."
