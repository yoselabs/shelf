# One MicroSoftware INSTANCE (glossary spine; ADR 0003 — flat files).
name = "yaml-merge"
kind = "primitive"
tier = "T1"
release = "yaml-merge-v0.2.0"
capability = "Stop caring that writing a config back destroys the file its author wrote — carry a payload's values into the existing YAML document, so comments, blank lines, key order and quoting survive a round trip through something that cannot carry them; and merge two edits of one document by structure (merge3), keeping ours' comments."
implementation = "ours"
status = "candidate"
owner = "yoselabs"
notes = "Promoted from a2kay (core/yaml_merge.py). The capability is the SPLIT, not the YAML: the payload is authoritative about values, the existing document about everything else. Applies to the shape where values round-trip through a pydantic model, a dataclass or a plain dict — NOT to a reader that stays in ruamel's CommentedMap end to end, where the comments never left and there is nothing to merge. Surface: merge_into(existing, payload) and merge3(base, ours, theirs). merge_into takes a mapping or (0.2.0) a list payload; an `existing` of another shape (file absent, empty, or holding something else) returns the payload untouched. List entries pair by identity (first of name/id/key present on EVERY entry of both lists) before position, because inserting an entry at the top of a list otherwise shifts every comment down one. Two ruamel behaviours a naive merge gets wrong are the reason this is a package and not four lines at a call site, and both are pinned by tests: a comment ABOVE a key is filed under the PREVIOUS key, so `del doc[key]` leaves the paragraph explaining it sitting above whatever comes next (and cutting it means splitting a token whose first line may be the neighbour's own end-of-line comment); and slice assignment on a CommentedSeq clears its comment map, which is keyed by INDEX, so a rebuilt list loses every entry comment or — restoring it naively — gives each entry the comment belonging to whatever now sits at its old position. a2kay paid for the comment loss twice before this existed: its frontmatter reader (81df908) and its ontology store. 0.2.0 (task-loop/ogy): a top-level sequence merges like a nested list, and merge3 merges two edits against their ancestor by structure (mappings by key, list entries by the same identity keys), raising MergeConflict with the path where both changed one value differently, then carries the result into ours with merge_into; it can back a Git merge driver. Born candidate."
