# One MicroSoftware INSTANCE (glossary spine; ADR 0003 — flat files).
name = "jsonl-log"
kind = "primitive"
tier = "T0"
release = "jsonl-log-v0.4.0"
capability = "Stop caring how an append-only JSON-lines log rotates, ages out and reads back — one line per write in a single O_APPEND write call (safe across processes), size rotation that never splits a line and keeps at most N files, age retention for rotated files, reads newest file first that skip a blank, torn or undecodable line, a read-only handle that never writes, an opt-in cross-process rotate lock (process-lock) so two rotators drop no file, an atomic rewrite(keep), held handles per process, and a byte-cursor reader and tail whose torn last line waits."
implementation = "ours"
status = "candidate"
owner = "yoselabs"
notes = "Promoted from a2kay (services/audit_store.py's file half). a2kay keeps the audit semantics: the entry model, the schema version, the query filters and the stop-at-the-first-older-file rule. Second sighting: a2kit's packages/log/call_log.py writes per-day .jsonl through a logging.Handler with body sidecars and no rotation — not adopted. Codec-agnostic, stdlib plus atomic-io (rewrite) and process-lock (lazily, only for the opt-in rotate_lock). Born candidate. v0.2 (shelf-s1): O_APPEND single-write append, max_age retention and expire(), append_at offsets, and jsonl_log.cursor (Entry, Jsonl, read_from, tail) written to the shape of task-loop contracts/jsonl.py (branch release/C1) so that copy can be replaced by this one; the engine log, history_add and live.read_new sites follow. v0.3 (tl-w7lt.24): rotate_lock, rewrite(keep) to replace task-loop prune_events and UsageHistory.prune, held() cache to replace taskloop/adapters/applog.py; README no longer claims atomicity past PIPE_BUF on NFS."
