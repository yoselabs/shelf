# One MicroSoftware INSTANCE (glossary spine; resolution 0003 — flat files).
name = "llm-cache"
kind = "primitive"
tier = "T1"
release = "llm-cache-v0.1.1"
capability = "Stop caring how to cache LLM completions — a sqlite-backed TTL store whose get/put speak anyllm.Completion (a hit is a drop-in for a call: the original cost/tokens/latency ride along), keyed by an opaque (key, model) the caller computes via make_key."
implementation = "ours"          # cache policy over sqlite-resource + anyllm; the schema + Completion contract is ours
status = "candidate"
owner = "Denis Tomilin"
notes = "Promoted from a2web (packages/llm_extract/cache.py). D3: get/put speak anyllm.Completion so a cache hit is a drop-in for a real call. Connection-injected (aiosqlite.Connection from sqlite-resource's .conn); owns only its own table. Policy-free — a2web's 4-part composite key (content_hash, ask_hash, model_id, template_name) collapses to an opaque make_key(*parts). v0.1.1 hotfix dropped a dev-only [tool.uv.sources] that leaks into a git consumer's resolution. Born candidate."
