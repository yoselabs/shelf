# The Definition of Done (AGENTS.md §1: `just check` green, whole repo, no carve-outs)
# enforced from outside any one contributor's memory — see shelf-2xb. Deliberately minimal:
# one job, one command, no browser engines (just test-browser is a separate, opt-in target).
#
# HYPOTHESIS_PROFILE=ci: conftest.py's seeding policy. A fixed seed means a property-test
# failure is reproducible and would have failed on the previous commit too -- it can never
# spring newly on an unrelated PR. See conftest.py for the full reasoning.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The pinned tools, uv included (mise.toml, mise.lock; ADR 0024): no setup-uv, which would install the newest uv.
      # Then the beads database from refs/dolt/data, so `beads-lint` judges the beads as pushed. The repo is public:
      # read the Dolt data over HTTPS, no SSH key.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: --locked

      - run: uv sync --locked
      - run: bd bootstrap
        env:
          BD_DISABLE_METRICS: "1"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/

      - run: uv run just check-all
