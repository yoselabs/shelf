# The Definition of Done (AGENTS.md §1: `just check` green, whole repo, no carve-outs)
# enforced from outside any one contributor's memory — see shelf-2xb. Deliberately minimal:
# one job, one command, no browser engines (just test-browser is a separate, opt-in target).
#
# HYPOTHESIS_PROFILE=ci: conftest.py's seeding policy. A fixed seed means a property-test
# failure is reproducible and would have failed on the previous commit too -- it can never
# spring newly on an unrelated PR. See conftest.py for the full reasoning.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci
      # uv's own Python, as on every dev machine: the runner's /usr/bin/python3.12 (3.12.3) differs in stdlib behaviour
      # (argparse exit_on_error), and that kept this job red from 0f21079 to the fix.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The pinned tools, uv included (mise.toml, mise.lock; ADR 0024): no setup-uv, which would install the newest uv.
      # Then the beads database from refs/dolt/data, so `beads-lint` judges the beads as pushed. The repo is public:
      # read the Dolt data over HTTPS, no SSH key.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: --locked

      - run: uv sync --locked
      - run: bd bootstrap
        env:
          BD_DISABLE_METRICS: "1"
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/

      - run: uv run just check-all

  # The gate image `just check` runs in on a Mac (tools/gate/gate.Dockerfile), built and smoke-run on every change, beside
  # `check` (blueprint stack.dockerfile.tests): a broken image otherwise surfaces only on the next Mac run.
  gate-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: tools/gate/gate.Dockerfile
          load: true
          push: false
          tags: shelf-gate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the gate resolves inside the image
        run: docker run --rm shelf-gate:ci just --dry-run check-host
