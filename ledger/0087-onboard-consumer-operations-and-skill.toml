note = "EVOLVE: closed bead shelf-n63 (onboard-consumer-skill). Onboarding a new project as a shelf consumer + beads meant reading three documents that never referenced each other, and getting an ordering right none of them stated: the commit guard must precede `bd init`, or bd seizes core.hooksPath and installs the guard dead. The governing decision (D1): the skill decides WHICH operations a repo needs (judgment — greenfield vs established, hook manager already present, beads wanted, python+uv or not); the operations enforce ORDER and EFFECT (mechanism — prose cannot carry this, per fix-guard-hookspath-resolution's whole lesson). Five operations landed in tools/onboard/, each satisfying D3's five guarantees (idempotent, precondition-checked against a dependency's VERIFIED flag not its mere presence, effect-asserting, three-outcome, non-destructive): `guard` wraps shelf-efh's installer without reimplementing it. `resolver-block` turns the shelf directive from a manual paste into a marker-delimited projection (BLOCK_TEXT is the one source), written in place (never temp-file-plus-rename, which would unlink a symlinked CLAUDE.md -> AGENTS.md). `beads` runs `bd init` + config-set-with-readback (never trust the success message — .beads/config.yaml is a tracked file an ordinary git checkout can silently revert) + chains `bd dolt push` onto pre-push strictly outside bd's own markers; requires=(\"guard\",) so it cannot seize core.hooksPath before the guard is verified. `verify` is deliberately thin — re-running an operation IS re-verifying it, exploiting the idempotence/effect-assertion guarantees rather than a separate check path that could drift from apply; concretely self-heals AND truthfully reports the config-revert trap. `linter-preset` (python+uv only) copies the ruff/codespell/coverage/Makefile/dev-group reference per-family, never per-line — a consumer owning [tool.ruff] keeps it exactly as written. The onboard-consumer skill (.agents/skills/onboard-consumer/, same cross-tool location bd already uses in this repo) carries only the judgment half; scripts/onboard.py is pure mechanism, zero decisions of its own, ordering enforced by run_all() regardless of call order. Authored via the skill-creator pipeline — proposal/design/spec were already complete so the interview stage was skipped in favor of reading them directly; the full eval/benchmark loop was judged disproportionate for a single-repo internal orchestration skill with a deterministic script and no trigger-phrasing space to optimize, substituted with real end-to-end runs. VERIFIED FOR REAL, not simulated: a scratch greenfield repo went from nothing to guard+resolver-block+beads+linter-preset all applied/verified in one pass; a second run was a clean idempotent no-op; a seeded local path= shelf source was refused on commit — the acceptance test. Also exercised: a non-python repo (linter-preset skips and says so plainly, nothing else blocked) and a repo where husky already owns the hook slot (guard refuses and names husky's own extension point; beads correctly refuses too since its precondition on guard is unmet; resolver-block still applies independently — exit 1 correctly signals partial onboarding, not a false pass). Documentation collapsed onto the skill: consuming-the-shelf.md kept as the WHAT/WHY, each mechanical section now points its HOW at the corresponding operation; onboard-a-consumer.md's Phase A is one skill invocation; adopt-beads.md gained an intro stating beads now runs automatically via the skill, kept as the justification record beneath it; onboarding-new-micro-software.md's 'consumer half: DONE' claim corrected in place — the heading's DONE stays (it genuinely is done now) but the body names what the original claim actually missed. bootstrap-target-contract (shelf-abf) re-scoped: dependency direction flipped to depend on this change, and its proposal.md gained a pointer note that make bootstrap's remaining job is to become one caller of tools/onboard/ rather than a competing implementation. Filed shelf-brb: re-onboard a2kay and a2web against the real operations — both predate this change and may carry any of the landmines this session found; deliberately out of scope here. make check green throughout: 806 tests (29 new across this change), 86.13% coverage, no carve-outs."
