note = "EVOLVE: closed bead shelf-gag by moving guard ENFORCEMENT from a per-clone git hook into `make check`, and gave the guard its first automated tests. Root finding: `tools/hooks/forbid-local-shelf-source.py` was invoked by nothing except the pre-commit hook -- not `make check`, not the test suite -- so a per-clone, silently-disableable artifact was the sole enforcement path for the one rule the shelf calls structurally impossible to break. It had in fact been dead in this repo (see shelf-efh: `bd init` set core.hooksPath=.beads/hooks, after which a probe hook at .git/hooks/pre-commit containing `exit 1` did not block a commit). Design correction made during implementation: the gate must read HEAD, NOT the working tree -- an *uncommitted* local override is the co-development workflow docs/consuming-the-shelf.md §1 explicitly prescribes, so a working-tree check would have broken the supported path. The script gained a `--committed` mode (HEAD) alongside the existing default `--staged` mode (index); the two deliberately disagree, because staging is the moment an override becomes an offense. Also added exit code 2 for could-not-check (outside a git repo), never reported as a pass -- a guard exiting 0 when it could not run is precisely how a dead guard reported green. New `guard` target runs first in `check` and is written to be copied verbatim by consumers: it resolves the guard in-repo (shelf) or via $SHELF_HOME -> ../shelf -> ~/Workspaces/shelf (a consumer). Verified for real in both directions -- clean on this repo, and a scratch consumer repo with the copied Makefile plus a committed path/editable override was rejected with the correct message via SHELF_HOME resolution. tests/test_guard.py: 10 tests against REAL git repositories rather than mocks (every guard bug found this session was a wrong belief about git's behavior -- core.hooksPath resolution, index vs HEAD vs working tree -- and a mock would have confirmed the wrong belief). The pinning test is that an uncommitted override passes the gate while the same content staged is blocked. Prior coverage was one manual verification against scratch repos deleted afterwards (ledger 0038). docs/linting.md copy list and docs/consuming-the-shelf.md §2 rewritten: the hook is now documented as fast feedback, the gate as enforcement, with the beads ordering constraint (install the hook BEFORE `bd init`) stated where an onboarding reader meets it. make check green, 761 passed, 86.13% cov."
