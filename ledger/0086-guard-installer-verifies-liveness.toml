note = "EVOLVE: closed bead shelf-efh — the commit guard installer wrote to `<git-dir>/hooks`, hardcoded, and never consulted `core.hooksPath`, so wherever that is set (beads, husky, lefthook) the installer printed a checkmark, the file existed, and git never ran it. Re-witnessed before changing anything (proposal task 0.2): guard installed, core.hooksPath set, offending commit landed clean. THREE changes. (1) The hook directory now comes from `git rev-parse --git-path hooks` — git's own resolution, asked rather than re-implemented; a manual core.hooksPath read with a fallback would drift from git's relative-path/worktree handling. `_git_dir()` deleted as unused. (2) Success now means the hook was OBSERVED to block: verification stages an offending pyproject into a throwaway index and runs the hook, requiring a refusal. Read-only by construction — GIT_INDEX_FILE plus GIT_OBJECT_DIRECTORY point at temp locations, so the repo's index, working tree, history AND object database are byte-identical afterwards (asserted by test, object count included). The hook is executed directly rather than via `git hook run`, which fires every other tool's pre-commit hook too — confirmed the hard way when a probing `git hook run pre-commit` triggered a beads re-export. Exit codes are three, not two: 0 verified live, 1 refused-or-not-live, 2 could-not-verify (no shelf clone found, so the hook's deliberate fail-open branch is active). Collapsing the third into a pass is precisely how a dead guard reported green. (3) A foreign hook is now refused BY NAME with that tool's own extension point (beads -> append after the END marker; pre-commit framework -> already shipped, no chaining needed; husky/lefthook -> their own config), because hand-editing a generated hook is advice that breaks on the owner's next regeneration. Auto-chaining was rejected: a silent append that the owner later regenerates away is the same silent-failure class being fixed. tests/test_hook_installer.py — 16 tests against REAL git repositories; mocking git would have encoded the very belief that was wrong. The sharpest one points SHELF_HOME at a fake shelf whose guard exits 0: present, findable, executable, useless — every artifact check passes and only running it reveals the truth. Verified end to end: the exact reproduction now blocks the offending commit, HEAD unchanged. SIDE FINDING, recorded in the runbook: bd's hook install mode is NOT stable over a repo's life. shelf was verifiably in hooksPath mode early in the session (probe hook did not fire) and hours later had core.hooksPath unset with .git/hooks/ holding verbatim copies of .beads/hooks/*, including a non-beads addition chained outside the managed markers, which survived byte-identical. Trigger not pinned down. Consequence: never assume either mode — ask git. shelf's own clone is guarded via that chained block (outside beads' markers) and was confirmed to refuse an offender behaviorally. make check green, 777 passed, 86.13% cov."
