note = "EVOLVE: closed bead shelf-2xb. This repo had no CI of any kind, despite AGENTS.md stating the Definition of Done in the strongest terms available (make check green, whole repo, no carve-outs) -- a violation looked exactly like compliance, and this session alone found the commit guard silently dead for an unknown period, caught only because an unrelated beads adoption happened to probe it. Fix is deliberately minimal: one GitHub Actions workflow (.github/workflows/check.yml) running `make check` on push to main and on every pull request -- no browser engines needed (make test-browser is a separate, opt-in target already outside `check`), just actions/setup-python + astral-sh/setup-uv + `uv sync` + `make check`. Decided the seeding-policy question the bead explicitly deferred rather than punting again: a root conftest.py registers a Hypothesis 'ci' profile (derandomize=True) selected via HYPOTHESIS_PROFILE=ci, set only in the workflow's env. Reasoning: .hypothesis/'s example database is self-gitignored, so nothing carries a discovered failure between CI runs -- left randomized, CI could surface a genuinely new boundary on any commit, including one that never touched the package in question, indistinguishable from that PR having broken something. A fixed seed makes a CI failure reproducible and means it would have failed on the previous commit too -- it can never spring newly on an unrelated PR. Local runs stay randomized on purpose (the default profile, unchanged): the existing runbook's rerun-5-8-times-during-authoring workflow depends on that exploration to find new boundaries at all; a found boundary gets pinned as an explicit @example() (timefmt's ms=1450 is the documented worked case) before it ever needs to matter to CI. Documented in docs/runbooks/property-based-testing.md's new 'CI seeding policy' section. conftest.py had to be added to make lint/format/spell's file lists (it lives at repo root, outside packages/tests/tools, so it would otherwise silently escape the very gate it helps run) -- a small but real instance of the same lesson this whole session kept re-learning: a thing that exists but isn't exercised by anything is not the same as a thing that works. YAML validated with actionlint (clean) before pushing. make check green locally under BOTH the default and ci Hypothesis profiles."
