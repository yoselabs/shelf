note = "EVOLVE: closed bead shelf-abf (bootstrap-target-contract). Design predated tools/onboard/ (shelf-n63) by a full session; re-read D1-D6 against what actually landed rather than building the originally-sketched hand-rolled `deps hooks beads-init beads-config` Make prerequisite graph, which would have duplicated ordering/verification that run_all() already enforces more strongly (it checks a prior operation's Result.satisfied -- outcome AND verified -- not just whether a prerequisite target exited 0). Net new work: two Makefile targets. `bootstrap` delegates to `.agents/skills/onboard-consumer/scripts/onboard.py --repo .`; `bootstrap-verify: bootstrap` is the mechanically-identical call under a name that signals intent (checking vs setting up) -- deliberately NOT read-only, since tools/onboard/verify.py's whole design is that re-running an operation converges drift back to correct state rather than merely reporting it. Neither is a `make check` prerequisite (D4: environment assertions, not content ones; content assertions were already wired via shelf-gag, closed independently as D4 predicted). Found and fixed a real bug while wiring this: onboard.py resolved shelf_home for its OWN imports but never propagated it as $SHELF_HOME to GuardOperation's internal subprocess call to tools/hooks/install.py -- which could silently resolve a DIFFERENT shelf clone than the one the script was actually running operations from, undetected until the guard's liveness check failed for an unrelated-looking reason. Also added a self-onboarding guard: `make bootstrap` run inside the shelf's own repo now refuses rather than projecting the consumer resolver block into shelf's own AGENTS.md -- verified live (make bootstrap in this repo prints the refusal, exit 2) and via test. bootstrap/bootstrap-verify added to linter_preset.py's _MAKE_TARGETS and docs/linting.md's copy list, so a consumer running onboarding actually receives them, not just documentation describing them. Both design.md and tasks.md were rewritten in place against reality (an addendum section rather than silently discarding the original reasoning) -- D1/D3 held as originally reasoned, D2 was superseded (Make prerequisite graph -> operation-level precondition harness), D4 was the one section still genuinely open and is now closed, D5/D6 already happened via shelf-n63. 14 new tests: 3 for the script itself (self-onboarding refusal, shelf-clone-not-found handling, a real end-to-end onboarding run), 5 for the Makefile targets against a real `make -C <scratch-repo> bootstrap` (idempotent at the target level, does not clobber a foreign hook manager, bootstrap-verify is the same call, check does not depend on bootstrap), plus linter-preset's Makefile-copy test extended to assert bootstrap/bootstrap-verify are actually copied. make check green, whole repo: 814 tests, 86.13% coverage, no carve-outs."
