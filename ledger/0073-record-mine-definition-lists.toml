note = """EVOLVE, additive. A `<dl>` of `<dt>`/`<dd>` pairs is N records, and it was the one shape the tree-aware signature detector was STRUCTURALLY unable to see: both of its element-level guards reject it, and for the same underlying reason. Real definition listings are classless, so guard (a) rejects `("dd", "")`; they carry no `h1`-`h6`, so guard (c) rejects them on heading presence. Those guards are PROXIES for "this element is a record" — necessarily inferred, because in `<div>`/`<li>` soup nothing states it. A `<dl>` states it outright: the HTML spec defines it as an association list, `<dt>` the term and `<dd>` its description. So on this shape the proxies are not merely unnecessary, they are actively wrong, and `<dt>` supplies a BETTER heading than the guard was hunting for.

MONOTONICITY (resolution 0007): exposes more, removes nothing. Ordered as a fallback AFTER `_select` returns None, so no page that already yields a region can change what it yields — a class-based listing on a page that also carries a `<dl>` glossary still wins, which is correct. The content floors are unchanged and are what prevent a two-item glossary beside an article from hijacking the page (`_MIN_RECORDS` pairs, each over `_MIN_RECORD_TEXT` chars of own-scope description, and a link somewhere in the PAIR — the term commonly carries it, so requiring one in the description alone would reject the shape this exists for).

READ LEDGER 0071 BEFORE CONCLUDING THIS CONTRADICTS IT. That row records an EVOLVE of record-mine being tested and REJECTED, with the evidence that "handed arXiv's `<dl>` fragment ALONE, record-mine still returns None". Both statements are true and they are not in tension: 0071 tested an **optional container hint** — telling the detector WHERE to look — and correctly found it useless, because location was never the problem; the guards rejected the elements wherever they were. This change is a different axis, **`<dl>` semantics**, and the guards are exactly what it addresses. 0071's conclusion that dom-schema and record-mine are two capabilities still stands untouched: dom-schema NAMES fields on a KNOWN page, record-mine INFERS records on an UNKNOWN one. This makes the inference cover one more shape; it does not make it a declared-schema parser.

WHY IT WAS WORTH DOING, measured in the consumer. a2web's arXiv listing reported a 50-of-445 page as COMPLETE: `extract_records` returned None, so a2web's `record_count` stayed None, so its partial-listing detection returned at its first line and no `listing_partial` signal was ever emitted. On the 2026-07-28 full-corpus bench that cell scored quality 1 and 2 against a WebFetch baseline's 5 — a2web losing to the thing it replaces, on a completeness question. Note the blast radius is wider than arXiv: `record_count is None` disables the sufficiency axis for ANY listing shape the detector misses, so each shape recovered switches the capability back on for a population, not one page.

VERIFICATION LANE: the captured page ships with the change — `tests/fixtures/arxiv_list_cs_CL_recent.html`, a real arXiv listing with 50 `dt`/`dd` pairs counted by inspection, and it is a genuine witness: `extract_records` returns None on those exact bytes before this change and a full record set after. Per the package's own captured-not-hand-written rule, a synthetic fixture could not have witnessed this — it would have been authored from the same assumption as the detector. The synthetic listing kept alongside it controls a different variable (the record COUNT, for the `_MIN_RECORDS` floor), which a one-day snapshot cannot."""
