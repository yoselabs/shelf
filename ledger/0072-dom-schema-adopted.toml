note = """Adopted the same session it was promoted, which is the point of the origin-consumer repoint: the shape was verified against real use before the tag left the worktree. Both dead parsers are live -- arXiv listing 40 chars/0 links -> 4971 chars/10 links, wikipedia 0 -> 10 wikilinks -- and the corpus case that had defeated three consecutive changes moved unscored -> scored (4 and 5).

CONFIRMS THE SHAPE ON ITS SECOND AND THIRD USE, and one asymmetry is worth recording because it bounds the capability rather than the implementation. arXiv's listing is verdict-guarded: ROT returns a non-ok verdict and the tier cascade continues. Wikipedia's wikilinks CANNOT be, and no change to dom-schema would fix it -- wikilinks are scattered through prose, so the only honest container is <body>, which always matches, so a rotted row selector necessarily reads as EMPTY rather than ROT. The container/row split separates rot from emptiness ONLY when the page has a real region to name. That is a property of the page shape, not a gap in the package, and consumers with prose-scattered targets need a declared-expectation probe instead. Stated in a2web's code at the call site so the next reader does not mistake it for an oversight.

DELIBERATELY NOT PROMOTED: a2web's Schema instances themselves (_LISTING_SCHEMA, _WIKILINK_SCHEMA). The selectors are product knowledge about specific sites -- moving them to the shelf would dress a2web's site coverage as substrate, the over-promotion RECONCILE exists to undo. The mechanism is generic; the selectors are not."""
