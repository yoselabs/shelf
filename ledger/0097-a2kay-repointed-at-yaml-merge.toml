note = """a2kay repointed at the git tag; the local `core/yaml_merge.py` and its tests are deleted. `make check` green: 1245 passed, 93% coverage, pyrefly 0 errors, no local shelf source committed.

What the round trip proved, which is the point of recording it separately: nothing had to change in the package to make a2kay's real call site work. The tests moved across unedited apart from the import line, and the store-level tests — write a type whose `.yml` carries comments, `upsert` it, read the comments back — pass against the packaged version exactly as they did against the local one. A promotion where the consumer needs a patch to adopt is a promotion of a guess.

One thing the extraction did NOT prove and should be said plainly: there is still only one consumer. The interface is shape-proven (Article VII's guard) because every branch was written against real commented YAML, not because two apps have agreed on it. The list-identity keys (`name`/`id`/`key`) are the part most likely to want a second opinion — a2kay's ontology `fields` are keyed by `name`, and a consumer whose lists key on something else will find out by their comments landing on the wrong entry. It is answerable at reconciliation."""
