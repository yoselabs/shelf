note = "Closed skill-as-shelf-kind (openspec/changes/skill-as-shelf-kind/). `Kind: skill` joins the catalog's Kind enum (docs/glossary.md), governed by resolution 0014: unit dir skills/<name>/, contract-verify via `claude plugin eval`, release via `claude plugin tag` (validated against plugin.json/marketplace.json agreement), breaking-change via the existing CHANGELOG.md convention, gate-membership via a new tests/test_gate_covers_every_skill.py. The shelf repo is now its own claude-plugin marketplace and plugin source in one repo (.claude-plugin/marketplace.json + plugin.json + skills/), confirmed end-to-end: validated, added as a marketplace, installed, then un-registered and uninstalled again so the smoke test left no trace in the user's global config. Token-budget requirement wired as a PROMOTE step 4 addition (run `claude plugin details <name>`, record the always-on figure in the catalog entry) rather than a hand-rolled character-count proxy that an earlier draft considered. Mid-implementation discovery reshaped the design: shelf-n63 (merged before this change was applied) had already shipped .agents/skills/onboard-consumer/, invoked by path from $SHELF_HOME, not through any plugin mechanism. Verified directly in-session that .agents/skills/ content does not appear in a session's auto-scanned skill listing even inside the shelf repo itself — it is pull-based (zero standing cost, found only if an agent is already told where to look), where a catalog-registered skill is push-based (auto-triggered, a real measured cost). Rather than force one mechanism onto both, resolution 0014 draws the line explicitly: `Kind: skill` governs only the push-based tier; .agents/skills/ stays outside the catalog, ungoverned, exactly as shelf-n63 already built it — a cross-reference note was added to consuming-the-shelf.md so a future agent doesn't try to fold onboard-consumer into the catalog. Also fixed a latent gap this surfaced: test_catalog_release_is_current.py assumed every catalog entry maps to packages/<name>/, which would have broken on the first real kind=skill entry; made its two assertions Kind-aware, confirmed via a throwaway smoke-test catalog entry (including one deliberate name/dir mismatch, correctly caught before cleanup). No skill content authored by this change — a downstream follow-up (shelf-c2s or otherwise) is the contract's first real exercise. make check green throughout: 836 tests, 86.30% coverage, no carve-outs."
