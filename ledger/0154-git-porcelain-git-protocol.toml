note = """FEATURE. Typed `Repo` and `Worktree` protocols (23 intent operations, down from ~40 thin ones; the rest are private to `RealRepo`) for what task-loop's engine, tl and loop do on a checkout, with frozen result unions and `GitUnavailable` for infrastructure failures. `RealRepo` owns env, hooks and identity and memoizes inside (immutable answers forever, ref answers validated by file signatures, a same-size same-tick edit still seen by `snapshot`). `FakeRepo`/`FakeWorktree`/`FakeRemote` in git_porcelain.testing model the domain state. One @contract Gherkin suite, one scenario per behaviour, runs against RealRepo on temp repos and FakeRepo, so the fake cannot drift. `push(dst)` only: the `cfg['land']` knob is dropped, a repo needing more uses its pre-push hook. Not adopted by task-loop yet: the verdict is the delivery's own gate."""
