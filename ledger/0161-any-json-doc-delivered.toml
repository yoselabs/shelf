note = """Promoted from task-loop's `contracts/stores.py` JsonStore and `stores/files.py` FileDocSet (bead tl-w7lt.17): one JSON document per file, replaced atomically, read as Present, Absent, Torn or ForeignVersion. The msgspec and version-envelope coupling is removed: the host injects load/dump and raises ForeignVersionError. Builds on atomic-io for the write, so it is stdlib plus atomic-io (a repo vendoring shelf packages byte-for-byte vendors atomic-io with it). FileTickets stays in task-loop. Acceptance: real-file tests including a leftover temp from a killed writer and a concurrent reader that never sees a torn document. Candidate contract; the task-loop repoint is not done yet, so no adoption verdict."""
