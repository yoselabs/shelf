note = """EVOLVE, not a sibling (resolution 0007). v0.1.0 stopped at connection acquisition. a2kay's 2026-09-13 substrate audit found four DuckDB findings from three dated debugging sessions sitting in a2kay comments, one of them a data-corruption mode, and every one of them learned from a failure rather than from the documentation — which is resolution 0012's definition of a sharp edge and its promotion trigger.

Two had a code shape and are now the package's surface.

`is_lock_conflict(exc)`. DuckDB reports a second process holding the write lock as a plain IOException, the same class it uses for a missing file, an unreadable directory and a corrupt header. The only thing separating it is the substring "Conflicting lock is held". a2kay was matching that string privately, in core/owner_lock.py, which meant the day a DuckDB upgrade rewords it a2kay breaks in silence and so does every other consumer matching it privately. The test spawns a second interpreter, lets it take the lock, and reads the real failure; an exception built by hand would prove only that the substring matches itself. That test is the verification lane travelling with the promotion, and it needs no opt-out marker — a subprocess is cheap and hermetic.

`rename_column(conn, table=, old=, new=)`. DuckDB refuses ALTER TABLE RENAME COLUMN while any secondary index exists on the table, reporting `DependencyException: Cannot alter entry "node" because there are entries that depend on it` — a message naming neither the index nor the column, met for the first time on a user's existing database, which is the one place iteration is not available. Every index on the table is dropped, the column renamed, each index rebuilt from the definition duckdb_indexes() itself reports. Returns False when there is nothing to rename, and the shape of "nothing" was settled by the consumer rather than by the design: a2kay's node classifier has had three spellings converging on `type`, so a ladder runs kind->type and entity_type->type in sequence and one of them must pass over a database it does not fit. The first cut raised on a table holding neither column, which broke exactly that. Only a table holding BOTH columns raises now — there the migration's own history is ambiguous and dropping one is not this function's call.

Two design points that came out of writing the tests rather than out of the plan. An index OVER the renamed column cannot be replayed verbatim, so the renamed identifier is rewritten inside the index's own column list and nowhere else, and not inside a single-quoted string there — a rename moves identifiers, and a literal that happens to spell the old name is data. The test for that was first written against a partial index; DuckDB has none (`CREATE INDEX ... WHERE` raises NotImplementedException as of 1.5), so it is an expression index instead, which is where a literal and an identifier do sit in the same statement.

Two findings have NO code shape here and are refused as code deliberately, recorded in the README's "What this package knows" instead. (3) Upsert churn: an owner-level upsert doing DELETE+INSERT against a property table for every field on every write trips "Failed to delete all rows from index" on a large corpus — a fatal, and corruption rather than a slow query. The mitigation is a content-hash write-skip (compare the path too: a rename leaves content untouched and still has to move the row) and the counterintuitive negative twin, that adding a secondary index to speed up a few-thousand-row table buys nothing AND makes it corruptible under that churn. (4) DuckDB FTS is static: reflecting one changed row costs a full rebuild, O(corpus) not O(change), measured at 3.2s over ~6k documents and rising linearly, so it must not run on the write path — and the stale flag must be a row in the same DuckDB file, never instance state, or a crash between write and read leaves a stale index looking fresh forever.

Both belong to a writer this package does not have. Building one to carry them would be a lifecycle base class promoted from a single consumer's guess, which the v0.1.0 note already declined; what generalizes is the knowledge, and the knowledge is what shipped. Article VII's shape-proven guard is met for the two functions and explicitly not claimed for the two rules.

make check green in the worktree. 16 package tests (13 behaviour + the boundary + the two-process lock lane)."""
