note = """`microdata_to_ld` + `ld_entries` — the two format normalizers, out of four candidates a2web offered.

**The siting argument is the strongest one available, and it is not "a2web has this code".** The package emits `source="microdata"` in the extractor's raw `{"type": ["https://schema.org/Product"], "properties": {...}}` shape, which nothing else in the schema.org world speaks. It already DECODES that shape internally — `rank_payloads` reaches into `{"type", "properties"}` to score a microdata payload — so it was shipping a source no consumer could use without first writing the adapter the package had already written privately. A detector that emits a shape only it can read is emitting half a capability.

`ld_entries` is smaller and the reason is subtler. LD-JSON arrives as a bare entity, a list, or an object whose real content is under `@graph` — and `@graph` is what the RICHEST pages emit, being how you express several linked entities. The failure is quiet in the worst way: the outer object looks like a valid entity (it is a dict, it has keys), so a consumer that does not descend finds ONE contentless entry rather than zero. Zero is a bug you notice. One-empty reads as "this page has little structured data".

**Two of the four candidates were DECLINED, and the split is the assessment.** `_find_product_or_item_list` walks framework state for keys named `products`/`items`/`results`/`entities`/`list` under a depth cap — a heuristic guess about app-state shape, plus a cap that is the consumer's budget, not a fact about any format. `_normalize_commerce_row` looked generic (schema.org `offers.price` → `price`) but is contaminated with presentation: it renders `f"{price} {currency}"` into one token, which is a2web's markdown-table decision, not a normalization. A generic version would return the two fields separately, and writing that would be designing a new function rather than promoting an existing one. Both stay in a2web.

So §5.1's own framing — "~270 lines of LD/microdata/OG → uniform rows" — overcounted, and for a traceable reason: it was written before `lift-the-item-set-and-renderer` moved the renderer out of `domain.py`, and most of those 270 lines were the renderer. Post-lift the genuinely generic residue is about 40. The task's line citations (`domain.py:262-292, 383-416, 501-545`) point at a file that no longer holds any of it.

One behaviour question settled during the port rather than after: `@type` preserves list-ness. extruct always emits `type` as a list, so collapsing a one-element list to a scalar would invent a distinction the source does not make — and a consumer branching on `isinstance(t, str)` would then behave differently for a one-type page than a two-type one. The first test written here asserted the collapsed shape and FAILED; the test was wrong, not the code. Changing behaviour is not what a promotion is for.

Both additive. No existing consumer sees a byte change."""
