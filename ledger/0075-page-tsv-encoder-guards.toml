note = """Repaid debt, not new capability. a2web hit four defects in this encoder while it was still a2kit's `packages/formatter`, filed two of them upstream as *"no a2web workaround exists — this must be fixed upstream"*, and when the fix did not come, owned a local copy (`a2web/src/a2web/wire.py`). page-tsv was promoted out of the same origin code and inherited all four. They are fixed here now, so the next consumer does not pay again.

  1. presence   — a field the model PRUNED was resurrected as the bare "\\n" empty marker plus a dead `_x_format` sidecar. Two keys of noise per pruned field, on every healthy response; a2web measured its minimal success payload going from 11 keys to 2 on this fix alone.
  2. already-a-string — a field arriving as finished TSV (a producer whose own serializer encodes it) hit `isinstance(raw, (list, tuple)) else []` and was OVERWRITTEN with the empty marker. In a2web that field was the off-page index, so the defect read to the caller as an honest "we looked and found no onward links" on responses that had them.
  3. shape      — `encode_tsv` correctly raises on a row that is neither model nor dict. Called unguarded, ONE such field aborted the encode for the whole envelope; wrapped in a bare `except` (which a2web inherited), that was invisible and far from harmless — a2web's `fetch_raw` had never shipped a `_<field>_format` discriminator at all.
  4. union columns — the header came from `rows[0]`. Rows are heterogeneous BY CONSTRUCTION (`PruneEmpty`, any field elided at its default), so this silently DELETED every key the first row happened to lack: no error, no short row, nothing about the output looked wrong. a2web's live case was an `info` hint eliding `severity` and a `critical` one not — an info hint sorted first produced a table with no severity column, so the loudest signal in the system reached the agent unmarked. Found 2026-07-31, and it is the one defect NOT in the original a2kit filing.

Fixed on both row-derived paths: `render._derive_columns` (which `encode_page_tsv_dict` also uses) and `page._item_columns`'s fallback. `Page[T]`'s primary path resolves columns from the declared item type, which was already a superset and is unchanged.

Each is pinned by a test named for the HARM in `tests/test_envelope_guards.py`, and each was reproduced by execution against the shipped v0.1.0 code before being fixed (5 red, then green; the `page._item_columns` fix re-verified separately by stashing it, since `_derive_columns` alone already covered the dict entrypoint and would have made that test read as coverage while providing none).

**Correcting the record on the consumer claim.** a2web's own backlog said this debt "affects a2kay today". Verified false: a2kay imports `page_tsv.Page` as a TYPE in three routers and nothing else — its CLI renders compact JSON explicitly, and its docstring says "Token-lean `page-tsv`/TSV type-routing is a later enhancement". No a2kay code path reaches the defective encoder, so nothing shipped wrong. What was true is that a2kay is PRIMED to turn it on, and these four are exactly what would have bitten at that moment.

Bytes change, so a consumer with golden wire fixtures must re-capture — see `packages/page-tsv/CHANGELOG.md` for the per-change migration. Every change removes output that was wrong; nothing previously correct is dropped."""
