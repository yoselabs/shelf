cost = "worktree ../shelf-a2web; packages/llm-wobble/src/llm_wobble/__init__.py (`BoundFunnel` frozen dataclass + `bind()`, ~15 lines of functools.partial) + 3 tests + README. Consumer side: a2web's wobble binding drops from 112 lines to ~35 — three hand-written wrapper functions become three assignments."
note = "EVOLVE of llm-wobble, purely additive per resolution 0007 — exposes more, removes nothing; per-call `logger=` is untouched, so no CHANGELOG contract-shape line and old tags stay valid. `bind(logger) -> BoundFunnel` pre-binds the three logging entry points (parse_with_policy / parse_list_with_policy / emit_wobble) via functools.partial; an explicit `logger=` at the call site still wins, because partial keywords are overridable. ARRIVED VIA THE BUGFIX TRIGGER (resolution 0012 — a sharp edge, not a feature request): a2web keeps ONE process logger because its transport is MCP stdio, where a stray record on stdout corrupts the JSON-RPC stream. To default `logger=` it had written three wrapper functions, and a hand-written wrapper RESTATES the signature it wraps — so a parameter added upstream silently stops reaching the consumer's call sites while the call still reads as if it works. That is not a hypothetical: the same drift shape had just cost a2web its eval replay harness, which stopped passing `routing=` and quietly routed every replayed case down a degraded branch while reporting success. The one-question test says this promotes: we learned it from a bug, not from the docs — the per-call `logger=` kwarg is correct and documented, and a competent consumer still built a drift hazard on top of it, so reading harder would not have saved the next one either. The load-bearing test asserts a parameter `bind` NEVER NAMES (`strip_fences`) still arrives, which is precisely the class that goes missing in a hand-rolled wrapper. NOT moved and deliberately so: the consumer's POLICY TABLES. a2web's `_policies.py` says `obstacle` is OPTIONAL because a2web's own prompt says '(optional) ... OMIT' — a claim about that app's prompt, checkable only next to `prompts.py`. That is product knowledge wearing a substrate-looking shape, and promoting it would separate every entry from its justification."
