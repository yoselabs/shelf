note = "EVOLVE of llm-wobble, purely additive per resolution 0007 — exposes more, removes nothing; existing tolerances keep their exact behaviour, so no CHANGELOG contract-shape line and old tags stay valid. `WobbleTolerance.OPTIONAL` substitutes `policy.default` like DEFAULT does, but emits NO `llm_wobble` event and is NOT listed in `recovered_fields` — because nothing was repaired. The vocabulary previously conflated two unlike facts: 'the field was absent, which the contract permits' and 'the field was absent, which is a wobble I recovered from'. Only the second is a wobble. The funnel CANNOT infer which applies — whether a field is optional is a fact about the caller's PROMPT, not about the payload — so the distinction has to live in the vocabulary rather than being derived. Origin (a2web `fix-extraction-signal-fidelity`): a2web's router envelope declares five contract-optional fields (`obstacle`, `also_here`, `other_pages`, `refinement_axes`, `item_total_seen`) whose prompt literally says '(optional) ... OMIT'. Declared DEFAULT, they fired FIVE `llm_wobble` warnings on every completely healthy extraction — measured, not inferred. A log key that fires on 100% of healthy calls cannot detect anything, and it was about to be adopted as the measurement channel for a production rollout: the saturated signal was found only because something tried to USE it. The alternative — filtering the event downstream in the consumer — was rejected: it leaves the funnel emitting a wrong event and adds a second mechanism to suppress it. Verification lane is pure-string (no live LLM): the load-bearing test drives OPTIONAL and DEFAULT against the SAME absent field and asserts they agree on the value and differ ONLY on the event, so the two cannot silently converge. a2web repoint + its own policy-table triage is the pending verdict row."
