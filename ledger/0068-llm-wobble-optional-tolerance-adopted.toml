note = "Adopted in a2web `fix-extraction-signal-fidelity`. The five contract-optional router fields (obstacle, also_here, other_pages, refinement_axes, item_total_seen) moved DEFAULT -> OPTIONAL, taking a healthy extraction from five `llm_wobble` warnings per call to zero. Triage rule that made the reclassification checkable rather than a judgement call: classify against what the PROMPT literally says — `(required)` stays DEFAULT, `(optional) ... OMIT` becomes OPTIONAL — never against how often a field happens to be present. On that rule `structural_form`/`shape` stayed DEFAULT (their absence IS the failure arm worth reporting) and all three `reasoning` fields stayed DEFAULT (decorative is not optional; the prompt asks for them unconditionally). ONE GAP FOUND ON ADOPTION, worth carrying back: the funnel's tolerances resolve ABSENCE only — `_apply_field` returns early when a field is present, so a field present with the WRONG TYPE never reaches a policy and is coerced by the consumer's own builder. That was survivable while every absence was reported; the moment optional fields went silent it became the last remaining way for real content to vanish without a record, i.e. trading one blind signal for another. a2web fixed it consumer-side (`_note_malformed` at the boundary builder) because the shape check belongs to the consumer's typed target, not to the funnel — but a future consumer WILL hit the same edge, so the OPTIONAL docstring should keep saying that absent-vs-corrupt is the distinction being drawn. Follow-up EVOLVE recorded in a2web's BACKLOG, not built here: `llm_wobble.bind(logger=...)` returning a bound facade, so consumers with a managed logger stop hand-duplicating three full signatures to default one kwarg (a2web's binding has that drift hazard today)."
