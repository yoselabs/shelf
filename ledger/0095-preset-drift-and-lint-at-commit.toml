note = """Made the linter preset's own divergence visible, and moved the fast half of the gate to commit time.

Resolution 0004 decided the preset is copied, not depended on, and said drift is "acceptable AND visible". Only the first half was ever built. `tools/onboard/linter_preset.py` is append-only by design — per-family ownership, never opening a table the consumer already has — so it answers "already current" for a repo missing two whole rule families. That is exactly what happened: eleven python repos here, ruff `select` counts of 46, 46, 35, 34, 34, 27, 26, 12, 12, 7, and nobody decided any of it.

New `tools/preset_drift.py`, wired as `make preset` (copied verbatim like `guard`) and published as a pre-commit hook. It compares three axes — ruff select/ignore, pyrefly error kinds, Makefile target set — and fails on any difference the consumer has not declared in its own `[tool.shelf-preset]`, where every entry sits next to its reason. It never edits, never proposes a value, and a declared difference passes: 0004's ownership model is intact, an accident is the only thing it stops. Deliberately not compared: per-file-ignores keys and sub-config matches, which are paths — a check that fails on every consumer forever teaches everyone to ignore it. Two bugs of its own were found and fixed while building it: an explicit `--shelf-home` that did not resolve fell through to the ambient shelf (so it would grade against a shelf the caller never named and report a pass), and a shelf WORKTREE identified as a consumer and graded its own branch against `main`.

`tools/hooks/install.py` gains a second marker span, `shelf-lint`: ruff check + ruff format --check over the staged Python, and preset-drift when `pyproject.toml` is staged. Not pyrefly, not pytest — a hook that takes a minute gets `--no-verify`'d and then protects nothing. It fails OPEN when ruff cannot be found, loudly, and reads the working tree for the staged paths, so a partially staged file is linted whole; both are the same trade the guard already makes, and both are now written down rather than discovered. The spans are independent, so a hook written before this one gains it on re-run with anything another tool chained on preserved. Splicing is now byte-identical to a fresh write — a reinstall was previously off by one blank line each time, which the idempotence test caught.

Preset changes, converging with a2kay so the two are identical: `D` (pydocstyle) DROPPED here — docstrings are written where they carry a decision, and a2kay measured 379 findings, 110 of them on methods whose signature already said it (Denis's call, 2026-09-12); the docstrings already written stay, they are just no longer mandatory. `S607` moved from per-file to the global ignore, beside `S603`: git-porcelain shells out to `git` by name on purpose and hardcoding `/usr/bin/git` is wrong on any other machine. `flake8-type-checking runtime-evaluated-base-classes = ["pydantic.BaseModel"]` adopted from a2kay, which hit it for real — five packages here declare pydantic, so this repo was one annotation away from `TC --fix` moving a model's imports behind TYPE_CHECKING. One test relaxation list now shared verbatim with every consumer, since a test's relaxations are not repo-shaped. And the pyrefly kinds a2kay enables and this repo does not (`unknown-argument-type`, `unknown-variable-type`) are recorded as probed — 41 findings here, all in tests, none a defect — rather than left as an unexplained absence.

make check green in the worktree: 861 passed, 86.32% coverage, pyrefly 0 errors with no warning tail. 11 new tests for the drift check, 5 for the lint span (including a live one: commit a file with an F401 and the hook refuses it)."""
