# This repo's exceptions to the blueprint's default step inputs (.blueprint/step-inputs.toml, rendered; any-gate, ADR 0031).
# A list here WIDENS a step's default, or declares a step of the repo's own (no default: it runs on any change until it declares).
# fnmatch on the whole path, `*` crosses `/`. `[narrow] step = "why"` would replace a default with the list; this repo narrows nothing.
# Change to this file, the justfile or .blueprint/ runs everything; so does `just check-all`.
stdlib-shadow = ["*.py", "*.config/stdlib-shadow/*"]
tag-check = ["*"]
dep-audit = ["uv.lock", "*pyproject.toml", "*dep_audit/*", "*.config/dep-audit/*"]

# Why a step of the repo's own runs on any change (blueprint's gate.wide-inputs-have-a-reason): `<kind>: <why>`.
[wide]
tag-check = "outside-files: compares versions with the tags on origin"
