# ── ty — type checking ─────────────────────────────────────────────────────
# ── pyrefly — type checking ───────────────────────────────────────────────────
# `preset = "strict"` is the annotation-completeness level: no bare `dict`/`tuple`,
# no unannotated parameter, no untyped empty container, `@override` required. The
# six opt-ins below sit above it and are each about correctness rather than style.
#
# Severity is spelled out rather than `= true`: `true` means "this kind's DEFAULT
# severity", and for `deprecated` and `unnecessary-type-conversion` that default is
# `warn` — set that way they are found, reported as "N warnings not shown", and never
# counted. A run must end at `0 errors` with no warning tail.
[tool.pyrefly]
# Editable workspace sources appear on the interpreter search path; they are still project code.
# Keep the declared exclusions below without implicitly excluding every installed src directory.
disable-project-excludes-heuristics = true
project-includes = ["packages", "tools"]
# Off: pyrefly matches .gitignore and .git/info/exclude against absolute paths, so in a worktree under .claude/worktrees/
# (an excluded path Claude Code adds) it matched no file and passed (homelab, 2026-10-11).
use-ignore-files = false
# tools/ scripts import their siblings by path (onboard.*).
search-path = ["tools"]
preset = "strict"

# convert-md's bench probe runners for marker/unstructured/docling/pandoc (D4):
# these packages are deliberately NEVER installed in the shared venv — each runs
# isolated via `uv run --with <pkg>` at bench time — so their imports are
# structurally unresolvable here, not a type error. The docx fixture generator does
# low-level oxml surgery and runs isolated the same way.
project-excludes = [
    "packages/convert-md/bench/engines/run_docling.py",
    "packages/convert-md/bench/engines/run_marker.py",
    "packages/convert-md/bench/engines/run_unstructured.py",
    "packages/convert-md/bench/engines/run_pandoc.py",
    "packages/convert-md/bench/corpus/docx/_generate.py",
    "**/__pycache__",
    "**/.[!/.]*",
]

[tool.pyrefly.errors]
deprecated = "error"
untyped-import = "error"
unnecessary-type-conversion = "error"
unannotated-return = "error"
no-any-return-explicit = "error"
no-any-return-implicit = "error"
unused-ignore = "error"
unused-type-ignore = "error"
unnecessary-comparison = "error"
missing-super-call = "error"

# Considered and rejected — spelled out rather than left to the preset's default, so
# the next reader sees a decision instead of an omission.
#
# `implicit-bool` and `unused-call-result` were SCANNED rather than enforced: a rule
# earns a gate when a violation is a defect, and for these two it usually is not.
# `if items:` is how Python is written, and discarding the result of `list.append` or
# `cursor.execute` is their normal use. a2kay ran the scan over 232 sites and found
# three real defects; the rest were correct as written. Re-run with
# `uv run pyrefly check --error implicit-bool` if the code moves enough to warrant it.
implicit-bool = false
unused-call-result = false
#
# `unknown-argument-type` / `unknown-variable-type` are enabled in a2kay, which has a
# reflective verb-dispatch surface they catch. Probed here: 41 findings, all in tests,
# none of them a defect. Declared as a consumer delta rather than adopted.

# `any-browser` degrades when an engine extra is absent rather than import-crashing,
# which is the whole contract — so the backends' imports are unresolvable on a venv
# without `[patchright]` and resolvable with it. Silencing the check is the only
# spelling that is correct in both states; an inline suppression reads as unused in
# one of them.
# any-speech's adapters import their engines (mlx, parakeet-mlx, sherpa-onnx) lazily; the engines are
# optional extras, not installed in the shared venv, so their imports cannot resolve here.
[[tool.pyrefly.sub-config]]
matches = "packages/any-speech/src/any_speech/adapters/*.py"

[tool.pyrefly.sub-config.errors]
missing-import = false

[[tool.pyrefly.sub-config]]
matches = "packages/any-browser/src/any_browser/patchright.py"

[tool.pyrefly.sub-config.errors]
missing-import = false

[[tool.pyrefly.sub-config]]
matches = "packages/any-browser/src/any_browser/playwright.py"

[tool.pyrefly.sub-config.errors]
missing-import = false

[[tool.pyrefly.sub-config]]
matches = "packages/any-browser/tests/*.py"

# Only the FIRST matching sub-config applies, so a narrower block must repeat the
# lighter test bar below rather than inherit it.
[tool.pyrefly.sub-config.errors]
missing-import = false
implicit-any-parameter = false
implicit-any-type-argument = false
implicit-any-lambda = false
implicit-any-attribute = false
implicit-any-empty-container = false
unannotated-return = false

# `plugin-surface`'s fixture surface is loaded BY the loader under test, from a
# directory pytest puts on `sys.path` and a static checker has no reason to.
[[tool.pyrefly.sub-config]]
matches = "packages/plugin-surface/tests/**/*.py"

[tool.pyrefly.sub-config.errors]
missing-import = false
implicit-any-parameter = false
implicit-any-type-argument = false
implicit-any-lambda = false
implicit-any-attribute = false
implicit-any-empty-container = false
unannotated-return = false

# Tests get the lighter bar, exactly as they do in ruff's per-file-ignores: a fixture
# `lambda` and a throwaway helper carry their meaning in the assertion around them, and
# annotating them buys nothing. What tests KEEP is every check about whether the code
# under test is being called correctly — bad-argument-type, missing-attribute,
# not-iterable, bad-return — which is most of what a type checker is for here.
[[tool.pyrefly.sub-config]]
matches = "packages/*/tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-parameter = false
implicit-any-type-argument = false
implicit-any-lambda = false
implicit-any-attribute = false
implicit-any-empty-container = false
unannotated-return = false

# ── codespell — typos across code, docstrings, and docs ───────────────────────
[tool.codespell]
# bench/corpus (source PDFs, binary) + bench/outputs (raw engine output, incl.
# scanned-page OCR text) are generated/fixture data, not authored content —
# real typos there are the engines' problem, not this repo's.
#
# tests/fixtures/*.html likewise: those are pages CAPTURED VERBATIM from live
# sites. Editing one to satisfy a spellchecker would make it a hand-written
# approximation — the precise defect dom-schema exists to prevent — so the
# fixture is authoritative and the linter yields to it, never the reverse.
#
# docs/thoughts and docs/research are raw evidence (quoted owner words, tool output, notes written in passing), kept as written.
skip = "uv.lock,.venv,.git,*.pyc,.ruff_cache,.pytest_cache,docs/thoughts/*,docs/research/*,packages/*/bench/corpus/*,packages/*/bench/outputs/*,packages/*/tests/fixtures/*.html"
# doctrine/glossary coinages the dictionary flags but we mean on purpose.
ignore-words-list = "wins,ontology,noqa,crate,ba,te,alls,errorprone,haa,statics,uptodate"
# A glob's case class (`[Ll]ibrary/` in a .gitignore) is not a word.
ignore-regex = "\\[[A-Za-z]{2}\\][a-z]+"
check-filenames = ""

# deptry is configured PER PACKAGE (it reads each package's own pyproject when run
# from that dir) and invoked via `just deps` with `--known-first-party`. No root
# [tool.deptry] block: it would never be read from the package working directory.

# ── coverage — measured on every `just test`; floor enforced (no silent rot) ───
[tool.coverage.run]
branch = true
source = ["packages", "tools"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",  # protocol/abstract stubs
]

# Shared SLOC caps, copied to consumers with the linter preset.
[tool.shelf-size]
code-file = 400
function = 80
test-file = 800


