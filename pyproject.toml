# `-m "not browser"` deselects the real-launch smoke by default: nothing in the
# ordinary gate launches a real engine (that needs a Chromium binary). The
# `just test-browser` lane re-includes it via `-m browser`, and CI runs that
# lane with SHELF_REQUIRE_BROWSER=1 where a non-launching engine is a hard fail.
addopts = '-ra --strict-markers -m "not browser and not engines"'
markers = [
    "engines: runs a real speech engine (any-speech: FluidAudio, parakeet-mlx) on a real clip named by ANY_SPEECH_CLIP; needs GB of model weights, so it is opt-in and excluded from the default run; `-m engines` runs it and each test skips when its engine or input is missing.",
    "contract: a scenario of a package's contract suite that runs the same steps against the real implementation and its in-memory fake (git-porcelain's RealRepo and FakeRepo), so the fake cannot drift. Runs in the default gate and in `just check`; `-m contract` runs just this lane.",
    "real_only: a contract scenario that only the real implementation can run: it names a fidelity gap of the in-memory fake (git-porcelain's FakeRepo), which the suite leaves out of the fake run.",
    "browser: real-browser test that launches a headless engine (any-browser); opt-in, excluded from the default run and `just check`; `just test-browser` runs it, and CI runs it with SHELF_REQUIRE_BROWSER=1 where a missing engine FAILS instead of skipping",
    "serial: must not share the box with other tests (it takes a whole core, a global lock or a fixed port). `any_gate_python run` runs these after the parallel stage, one process, no workers.",
    "quarantine: a test known to fail sometimes (name the bead in its reason). It runs apart, is reported when it fails, and never blocks the gate; fix it or delete it.",
    "net: binds a real loopback TCP port and serves HTTP over it (async-scope's asgi lane). Names the slice, does NOT carve one out: it runs in the default gate and in `just check`, because the behaviours it covers are invisible without a real socket and a promotion that ships them unverified ships a blind spot to every consumer. `-m net` runs just this lane.",
]
asyncio_mode = "auto"

