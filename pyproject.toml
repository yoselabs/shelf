# shelf — the shared home of small, ownable, contract-guaranteed software pieces.
#
# Virtual uv workspace root: there is NO root package. The members ARE the
# software (packages/*). Consumers (a2kay, a2web, …) live in their OWN repos and
# pin each package by git tag; they are never workspace members here.
#
# Working name only — branding is deliberately deferred.

# uv's floor: a different uv rewrites uv.lock's revision (blueprint stack.python-uv.uv-version).
[tool.uv]
required-version = ">=0.10.12"

[tool.uv.workspace]
members = ["packages/*"]

# The dev group references convert-md's [documents] and anyllm's SDK extras (so
# their engine/provider tests resolve); resolve both from the workspace, not PyPI.
[tool.uv.sources]
convert-md = { workspace = true }
# Named here only because the dev group installs `async-scope[asgi]` to exercise
# the real-socket lane; the package itself depends on no sibling.
async-scope = { workspace = true }
anyllm = { workspace = true }
# page-tsv composes lean-wire; mcp-result-wire composes page-tsv. Resolve the
# siblings from the workspace, not PyPI.
lean-wire = { workspace = true }
# any-frontmatter's `merge` extra is yaml-merge; the dev group installs it.
yaml-merge = { workspace = true }
any-frontmatter = { workspace = true }
page-tsv = { workspace = true }
# any-lease composes process-lock and child-env.
process-lock = { workspace = true }
child-env = { workspace = true }
# any-frontmatter, dir-trust and any-net compose atomic-io.
# any-yaml composes yaml-merge and atomic-io.
any-yaml = { workspace = true }
# any-speech composes any-clock, any-pipeline, any-versioned, any-lease, process-lock, atomic-io, content-digest, app-dirs and verb-cli.
# any-net composes any-versioned too.
any-speech = { workspace = true }
any-clock = { workspace = true }
any-pipeline = { workspace = true }
any-versioned = { workspace = true }
any-lease = { workspace = true }
content-digest = { workspace = true }
app-dirs = { workspace = true }
verb-cli = { workspace = true }
atomic-io = { workspace = true }
# sqlite-store composes sqlite-sidecar.
sqlite-sidecar = { workspace = true }
# any-agent composes stream-proc, child-env and app-dirs.
stream-proc = { workspace = true }
any-agent = { workspace = true }
any-mailbox = { workspace = true }
any-recorded-fixture = { workspace = true }
task-spec = { workspace = true }
# test-reach composes py-symbols.
py-symbols = { workspace = true }
shelf-vendor = { workspace = true }
any-contract = { workspace = true }
# The dev group installs `anyembed[llamacpp,transformers]` so both backends' imports resolve.
anyembed = { workspace = true }

# Dev tooling as a PEP 735 dependency-group (NOT an optional-extra): `uv sync`
# always installs it, so the venv carries the linters and `uv run` can never fall
# back to a global tool. The repo stays hermetic. (Inherited from a2kay.)
[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-bdd>=8,<9",  # Gherkin: how every shelf package states its tests (scenarios + outlines); property tests stay plain pytest
    "pytest-cov>=6,<8",       # coverage measurement + floor
    "ruff>=0.7,<1",           # lint + format
    "pyrefly>=1.3,<2",        # type checking
    "codespell>=2.3,<3",      # typos in code, docstrings, and docs
    "deptry>=0.20,<1",        # dependency hygiene: unused / missing / transitive
    "pytest-asyncio>=0.24,<1",  # async test support (the first async packages: sqlite-resource, http-*)
    "hypothesis>=6.100,<7",   # property-based testing — invariant-rich packages get a property suite alongside their example tests, never instead of. See docs/runbooks/property-based-testing.md.
    "browser-cookie3>=0.20,<1",  # browser-cookies' optional [read] engine — installed here so its tests exercise the real reader path (the package itself keeps it optional/lazy)
    "python-docx>=1.1,<2",       # docx WRITER for convert-md's dispatch tests (build a .docx fixture in-test); convert-md itself only READS docx, never writes — so this is test-only, not a package dep
    "convert-md[documents]",     # convert-md's heavy document engines (mammoth/office; docling dropped v0.5.0, pandoc dropped v0.7.0) — moved to the [documents] extra in v0.3.0; installed here so convert-md's dispatch tests still exercise the real engines (base stays HTML-only)
    "anyllm[agent,anthropic,openai,claude-code-sdk]",  # anyllm's SDK-backed provider extras — installed here so the anthropic/openai/claude-code-sdk backends' imports resolve for tests + deptry (base anyllm stays SDK-free; each backend is opt-in)
    "zendriver>=0.15,<1",  # any-browser's CDP engine — installed here (NOT patchright, whose vendored Chromium is heavy) so its fake-fidelity contract (`test_fake_config_matches_real_add_argument`) checks the fake against the REAL Config every commit instead of importorskip-ing away. patchright + the browser binaries are installed only in the `just test-browser` lane.
    "pyrefly>=1.3,<2",
    "types-openpyxl>=3.1.5.20260827",
    "types-croniter>=6.2.4.20260711",  # due-schedule imports croniter, which ships no types; pyrefly's untyped-import is an error
    "async-scope[asgi]",  # async-scope's uvicorn extra — installed here so the asgi lane serves a REAL server; base async-scope stays dependency-free and imports uvicorn lazily
    "httpx>=0.27,<1",     # the client half of that lane: a real request over the real socket
    "anyembed[llamacpp,transformers]",  # anyembed's two backend extras — installed here so `llama_cpp`, `torch` and `transformers` resolve for its tests + deptry (base anyembed carries neither backend; each is opt-in)
    "any-frontmatter[merge]",  # with_frontmatter's comment-keeping merge (yaml-merge) — an extra so a consumer that pins yaml-merge itself is not handed a second source for it
    "sse-starlette>=2,<4",  # NOT an async-scope dependency — the library whose unreset module-global the asgi lane exists to defend against, installed so that defence is actually exercised rather than suppressed away
    "pytest-xdist>=3.6,<4",
    "prek>=0.5,<1",
    "import-linter>=2.15,<3",
    "rust-just>=1.58,<2",  # the gate runner (ADR 0023): `uv run just check`
]

# ── The reference linter preset ───────────────────────────────────────────────
# This is the canonical "how things are done" for every consumer of the shelf: a
# new project inherits THIS setup (ADR 0004 — a config-preset, not a CLI).
# Curated-broad on purpose: an explicit, grouped select reads as a reference far
# better than `ALL` minus a wall of ignores, and it does not silently break on a
# ruff upgrade that adds a rule. Every family below earns its place; every ignore
# below states why. Keep it legible — this file teaches the convention.
[tool.ruff]
target-version = "py311"
line-length = 140
output-format = "concise"

[tool.ruff.format]
# ruff 0.17 formats the python fenced in markdown. The READMEs' snippets are hand-aligned prose
# illustrations, not code under test, and the catalog projects some of them: keep them as written.
exclude = ["*.md"]

[tool.ruff.lint]
# PLW1514 (unspecified-encoding) is a preview rule: `explicit-preview-rules` turns on only the preview
# rules named in `select`, never the whole preview set.
preview = true
explicit-preview-rules = true
select = [
    # correctness & the core
    "F",    # pyflakes — real bugs (undefined names, unused imports)
    "E", "W",  # pycodestyle
    "PLC", "PLE", "PLR", "PLW",  # pylint — the useful quarter of it
    "B",    # bugbear — likely-wrong constructs
    "BLE",  # no blind `except:` / `except Exception` swallowing
    "TRY",  # tryceratops — exception antipatterns
    "RSE",  # raise — no needless parens on re-raise
    "EM",   # exception messages assigned to a var (clean tracebacks)
    "RET",  # return-branch hygiene
    "SIM",  # simplifiable constructs
    "C4",   # comprehension quality
    "C90",  # mccabe — cyclomatic complexity ceiling
    "PIE",  # misc lints
    "FURB", # refurb — modernizations
    "FLY",  # f-string over str.join
    # typing & annotations
    "ANN",  # full annotation enforcement — everything typed
    "UP",   # pyupgrade — modern syntax for the target version
    "FA",   # future annotations where needed
    "TC",   # type-checking-only imports go under TYPE_CHECKING
    "PYI",  # stub/typing hygiene
    # imports & structure
    "I",    # isort
    "TID",  # tidy-imports (no relative parent imports)
    "ICN",  # import-convention (np, pd, …)
    "INP",  # no implicit-namespace packages (missing __init__)
    "A",    # flake8-builtins — the builtin-named-concept convention
    "N",    # pep8-naming
    "SLF",  # no private-member access across boundaries
    # safety & correctness of effects
    "S",    # bandit — security (subprocess, eval, tmp, etc.)
    "DTZ",  # timezone-aware datetimes only
    "LOG", "G",  # logging done right (no f-strings in log calls)
    "T10",  # no leftover breakpoint()/pdb
    "T20",  # no stray print() in library code
    "ASYNC",# async pitfalls
    "PTH",  # pathlib over os.path
    "FBT",  # no boolean-trap positional args
    "ISC",  # implicit string concat (ISC001 off — formatter owns it)
    # docs & rot
    # `D` (pydocstyle) is deliberately absent. Docstrings are written where they carry
    # a decision — why this exists, what breaks without it — not on every public name.
    # The full google convention would have a2kay writing 379 of them, 110 of those on
    # methods whose signature already says everything. The owner's call, 2026-09-12. The
    # docstrings already written here stay; they just stop being mandatory.
    "ERA",  # no commented-out code (leave it smaller, constitution III/VIII)
    "ARG",  # no unused arguments
    "PERF", # obvious performance footguns
    "PLW1514", # text IO names its encoding: the platform default is not a contract
    "RUF",  # ruff's own rules (RUF100 catches stale noqa)
]
ignore = [
    "ANN401",  # allow `Any` in genuinely-variadic *args/**kwargs
    "PLR0913", # arg count — deep functions legitimately take many args
    "PLR2004", # magic values — too noisy at this scale; revisit if it bites
    "ISC001",  # single-line implicit concat — the formatter owns this; would conflict
    "TRY003",  # long messages in raise — EM handles the real concern; TRY003 over-fires
    "S603",    # subprocess call w/ shell=False — the whole point of git-porcelain; audited by design
    # S607 partial path: `git-porcelain` shells out to `git` BY NAME on purpose, and
    # hardcoding `/usr/bin/git` is wrong on any machine that is not this one. Global
    # rather than per-file so a consumer that shells out from `src/` inherits the same
    # answer instead of rediscovering it.
    "S607",
]

# The shelf sits below its consumers: a package (its tests included) never imports an app.
# import-linter's `forbidden` contract covers src; this covers packages/*/tests, which the
# import graph does not see. A submodule import (`import a2kay.x`) is matched by the same entry.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"a2kay".msg = "A shelf package must not import a consumer app (the arrow points up into the apps); see AGENTS.md, The one invariant."
"a2web".msg = "A shelf package must not import a consumer app (the arrow points up into the apps); see AGENTS.md, The one invariant."
"a2kit".msg = "A shelf package must not import a consumer app (the arrow points up into the apps); see AGENTS.md, The one invariant."
"a2db".msg = "A shelf package must not import a consumer app (the arrow points up into the apps); see AGENTS.md, The one invariant."
"a2atlassian".msg = "A shelf package must not import a consumer app (the arrow points up into the apps); see AGENTS.md, The one invariant."

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-builtins]
# our modules are named for the concept they own; that is the convention, not a clash.
builtins-allowed-modules = ["types"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic resolves field annotations at runtime, so a model's imports must NOT move
# behind `TYPE_CHECKING`. Found in a2kay: `TC --fix` moved them and every model failed
# to build. Five packages here declare pydantic, so this repo is exposed the same way.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
# The isolated gate must exec-replace itself to retain the durably registered PID.
# Its validated private payload is explicit caller argv, never shell text (shelf-4426).
# S606 flags the required exec primitive itself; keep it enabled everywhere else.
"packages/stream-proc/src/stream_proc/_exec_gate.py" = ["S606"]
# The bead names the type `NotFound` (a lookup miss, the stdlib's own LookupError family); an Error suffix would only rename it.
"packages/child-env/src/child_env/exe.py" = ["N818"]
# One relaxation list, shared with every consumer (a2kay carries the same one under its
# own `tests/**`). A test asserts, uses magic numbers and fake tokens, binds a boolean
# positionally, reaches into the private of the thing it tests, and prints its report —
# all of that is what a test is for.
"tests/**" = ["ANN", "ARG", "S101", "S104", "S105", "S106", "PLR2004", "PLR0915", "PYI034", "TRY300", "TRY301", "FBT001", "SLF", "INP", "T201"]
"packages/*/tests/**" = ["ANN", "ARG", "S101", "S104", "S105", "S106", "PLR2004", "PLR0915", "PYI034", "TRY300", "TRY301", "FBT001", "SLF", "INP", "T201", "FBT"]
# tools are CLI scripts: printing is their job, `git`/`opa` on PATH is deliberate,
# and a module docstring is enough (no per-function D).
"tools/**" = ["T201"]
# the pytest plugin the root conftest loads as `tools.blueprint_fitness` (implicit namespace package, like the tests).
"tools/blueprint_fitness.py" = ["INP001"]
# package benches (convert-md's engine-comparison harnesses, D4): throwaway CLI
# probe scripts + fixture generators, not shipped library code — same shape as
# tools/**, plus INP001 (deliberately not a package), PLC0415 (isolated engines
# import lazily by design), full D (docstrings not policed in throwaway code, as
# in tests), and SLF (the docx fixture generator does low-level oxml surgery).
"packages/*/bench/**" = ["T201", "INP001", "PLC0415", "SLF"]
# any-speech: verb-cli reads the verbs' and Settings' annotations at runtime (typing.get_type_hints), so Path stays a
# real import in the CLI module; the engine lane imports each optional engine inside its test, skipping when it is not installed.
"packages/any-speech/src/any_speech/cli.py" = ["TC003"]
"packages/any-speech/tests/engines/**" = ["PLC0415"]
# any-speech tests are async and touch their own tmp files; a blocking Path call there stalls nothing but the test.
"packages/any-speech/tests/**" = ["ASYNC240"]
# any-browser's two engine adapters are DEFINED by "render never raises for a
# routine failure" (the base.py BrowserBackend contract): every driver / CDP /
# telemetry quirk is caught and turned into a RenderOutcome or a best-effort
# no-op, so a broad `except Exception` is the design, not a swallowed bug. Scoped
# to exactly the two driver modules — the seam (base.py) and launchers raise no
# such thing.
"packages/any-browser/src/any_browser/playwright.py" = ["BLE001"]
"packages/any-browser/src/any_browser/zendriver.py" = ["BLE001"]
# CAS interpolates only quoted identifiers; all data values remain bound parameters.
"packages/sqlite-store/src/sqlite_store/cas.py" = ["S608"]
# TtlTable splices only identifiers it validated against a plain-identifier pattern; every value is a bound parameter.
"packages/any-ttl-cache/src/any_ttl_cache/__init__.py" = ["S608"]

[tool.pytest.ini_options]
# testpaths lists the shelf's own fitness tests + every package's tests.
# HAND-MAINTAINED, and therefore guarded: `tests/test_gate_covers_every_package.py`
# asserts this list is exactly the set of `packages/*/tests` on disk. It went
# stale silently once — 8 of 26 suites (174 tests, a2effect's 12 files among
# them) ran in NO gate, so a package could ship a green `just check` while its
# own tests were never executed. A missing entry now fails the gate itself.
testpaths = [
    "tests",
    "packages/a2effect/tests",
    "packages/blueprint/tests",
