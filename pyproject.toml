# The shelf's own paths for the Python adapter of the gate (`python -m any_gate_python`, packages/any-gate-python).
# `no-effect`: paths no package test can observe (docs, the ontology, agent files); the repo tests in `tests/` cover what of these is checked.
# The onboarding tests build real consumer repos (8-14 s each, 2026-10-11) and read only the onboarding machinery, so they run when an input of
