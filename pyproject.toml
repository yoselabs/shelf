    "packages/any-path-glob/tests",
    "packages/any-failure-fp/tests",
    "packages/any-shell-policy/tests",
    "packages/any-net/tests",
    "packages/any-clock/tests",
    "packages/any-plugin-cache/tests",
    "packages/plugin-surface/tests",
    "packages/process-lock/tests",
    "packages/any-lease/tests",
    "packages/any-yaml/tests",
    "packages/any-speech/tests",
