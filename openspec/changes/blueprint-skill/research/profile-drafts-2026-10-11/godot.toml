# Framework profile (see ../python-uv.toml for the format). Layers on dotnet.toml for a Godot 4.x C# game: every
# dotnet.toml rule applies to the Godot csproj too (verified: strict props build it clean), the rows here add what is Godot's.
# `{root}` is the folder holding project.godot (lifesim: src/Game.Godot); repo-level files (.gitignore,
# .gitattributes, justfile, .github/workflows) stay at the repo root. Paths may be globs (`*.csproj`, no `**`).
# Research: openspec/changes/blueprint-skill/research/dotnet-godot-layering.md
stack = "godot"
status = "provisional"
source = "dotnet-godot-layering.md (2026-10-10, one web pass + Godot 4.7.2 run headless on a scratch copy of lifesim; architecture re-checked 2026-10-11 with the extra-strict analyzer set built clean on a Godot.NET.Sdk 4.7.2 csproj); lifesim is the only consumer"

[[role]]
role = "framework-version"
tool = "Godot.NET.Sdk/<x.y.z> exact in the Godot csproj (single source); config/features in project.godot says the same major.minor; CI reads the csproj"
install = """csproj `<Project Sdk="Godot.NET.Sdk/4.7.2">` plus an explicit <TargetFramework> (the editor rewrites a csproj missing either); \
project.godot config/features=PackedStringArray("4.7", "C#", ...). CI derives the version: \
`grep -o 'Godot.NET.Sdk/[0-9.]*' {root}/*.csproj | cut -d/ -f2` into setup-godot's `version`"""
config = [
    { path = "{root}/*.csproj", contains = "Godot.NET.Sdk/" },
    { path = "{root}/project.godot", contains = 'config/features=PackedStringArray("4.' },
]

[[role]]
role = "project-hygiene"
tool = ".godot/ ignored, *.uid and *.import committed (never ignored), .gitattributes with LF, .csharpierignore for .godot/"
install = """Godot editor: Project > Version Control > Generate Version Control Metadata (writes .gitignore + .gitattributes with `* text=auto eol=lf`); \
add `.godot/`, `bin/`, `obj/` to .gitignore and `.godot/` to .csharpierignore; never ignore *.uid or *.import; \
after a headless import `git status --porcelain` must be empty (a new .uid or import file means something was not committed)"""
config = [
    { path = ".gitignore", contains = ".godot/" },
    { path = ".gitattributes", contains = "text=auto eol=lf" },
]

[[role]]
role = "binary-assets"
tool = """Git LFS for every binary blob, proven by a deterministic check, not by a pattern list: `git ls-files --eol` marks a blob git sees as binary `i/-text`, and each such path must carry `filter: lfs` (`git check-attr filter`). \
.gitattributes patterns (png, jpg, webp, wav, ogg, mp3, glb, ttf, otf, exr, hdr, blend, fbx, bin, ...) are the setup; the check is what catches an extension nobody listed. export_presets.cfg committed, credentials only in .godot/export_credentials.cfg. \
Upload under prek is proven: a local pre-push hook `git lfs push --all "$PRE_COMMIT_REMOTE_NAME"` sent all 19 LFS objects to a bare file:// remote and a fresh clone checked out real content (git-lfs 3.7.1, prek, macOS; bead shelf-d89 comment, 2026-10-11)"""
install = """.gitattributes: `*.png filter=lfs diff=lfs merge=lfs -text` for each binary extension in the repo; `git lfs install --skip-repo` (prek owns the hooks); .pre-commit-config.yaml local hook id git-lfs-push (entry sh -c 'git lfs push --all "$PRE_COMMIT_REMOTE_NAME"', always_run, pass_filenames false, stages [pre-push]); CI checkout with `lfs: true`. \
justfile recipe `lfs-check` (shebang recipe, no backticks in the file): `bad=$(git ls-files --eol | grep '^i/-text' | cut -f2 | git check-attr --stdin filter | grep -v 'filter: lfs'); test -z "$bad" || { echo "binary outside LFS:" >&2; echo "$bad" >&2; exit 1; }` (the pipe filters on git's own text/binary verdict; LFS pointer files are text in the index, so a correctly tracked asset never appears). \
Seen red on lifesim (read-only git): design/research/character-pipeline-spike/sliders-live.mp4 is a binary blob with `filter: unspecified` (mp4 was in no pattern); every other binary there is LFS"""
config = [
    { path = ".gitattributes", contains = "filter=lfs" },
    { path = ".pre-commit-config.yaml", contains = "git lfs push" },
]
gate = "check-attr"

[[role]]
role = "embedded-script-lint"
na = "C#-only project (no .gd files): the C# analyzers are the lint. The moment a .gd file exists this becomes mandatory: gdtoolkit 4.5.0 (gdlint plus `gdformat --check`, install `uvx --from gdtoolkit gdlint <root>`; maintainer quiet since 2025-10 but not archived, no linter successor, works on 4.5 syntax; check only, never auto-format in a hook; 4.6/4.7 syntax untested). GDQuest GDScript-formatter 0.27.0 is an untested formatter-only alternative"

[[role]]
role = "build"
tool = "godot --headless --path <root> --import, then --build-solutions --quit, both inside make check; the SECOND import log is scanned for ERROR lines (the first pass of a fresh clone prints about 190 false ERROR lines) and the tree must stay clean"
install = """Godot binary on the agent's machine, the .NET build of the version the csproj pins (macOS: `brew install --cask godot-mono`, or the official .NET zip from godotengine.org into ~/Applications; set GODOT to its binary). justfile: `godot := env('GODOT', 'godot')`; `godot-build` is a shebang recipe (bash) that runs `"{{godot}}" --headless --path {root} --import >/dev/null 2>&1` once to warm .godot/ (a cold first import prints about 190 ERROR lines on a clean repo: `Unable to open file: res://.godot/imported/*.ctex`, and theme font references parsed before the font is imported; seen on a fresh copy of lifesim, Godot 4.7.2, 2026-10-11; the second pass is clean), then AGAIN as `"{{godot}}" --headless --path {root} --import 2>&1 | tee import.log`, then \
`! grep -q 'ERROR:' import.log` (import exits 0 even on broken scene references), then `"{{godot}}" --headless --path {root} --build-solutions --quit` \
(exit 1 on a C# compile error), then `git diff --exit-code && test -z "$(git status --porcelain)"`; no backticks in the justfile (`just --dry-run` runs them); add godot-build to the `check` dependencies"""
config = [
    { any = [{ path = "justfile", contains = "--build-solutions" }, { path = "Makefile", contains = "--build-solutions" }] },
    { any = [{ path = "justfile", contains = "ERROR:" }, { path = "Makefile", contains = "ERROR:" }] },
]
gate = "--build-solutions"

[[role]]
role = "tests"
tool = """Chickensoft GoDotTest 2.0.47 (MIT; releases 2026-08-15, 2026-08-18, 2026-09-09) runs C# tests inside the engine headless: `godot --headless --path <root> res://viewtests/TestEntry.tscn --run-tests --quit-on-finish`. \
Seen green (exit 0, 1.2 s) and red (planted failing assertion: exit 1) on a scratch copy of lifesim with the strict analyzer set and warnings as errors, Godot 4.7.2 .NET, net10.0, MTP-only global.json (it is not a VSTest or MTP project, so there is no clash). \
The gate must also read the log: a broken ext_resource in the scene under test leaves the exit code at 0 (only ERROR: lines show it), and a missing --run-tests, a renamed entry scene or a scene that fails to load runs zero tests and exits 0, so the recipe fails on any ERROR: line and when `Test results: Passed: N` has N < 1 (all seen red). \
Engine-free logic stays in the xunit.v3 projects; in-engine tests only for thin views. Refused: GdUnit4Net 5.0.0 (godot-gdunit-labs/gdUnit4Net) as the default, see the install note"""
install = """Directory.Packages.props <PackageVersion Include="Chickensoft.GoDotTest" Version="2.0.47" />; Game.Godot.csproj <PackageReference Include="Chickensoft.GoDotTest" />. In {root}/viewtests/: TestEntry.cs (a Node whose _Ready calls `GoTest.RunTests(Assembly.GetExecutingAssembly(), this, env)` when `TestEnvironment.From(OS.GetCmdlineArgs()).ShouldRunTests`), TestEntry.tscn, and `public class XTest(Node testScene) : TestClass(testScene)` with `[Test]` methods that `GD.Load<PackedScene>(...)`, instantiate, assert on the tree. \
The strict stack needs three adjustments (all hit): config.nsdepcop gets `<Allowed From="Game.ViewTests.*" To="..." />` lines for Game.ViewTests, System, Godot and Chickensoft.GoDotTest (default-deny whitelist); a `res://` literal in a method trips S1075, so scene paths are `const string` fields; the tests compile into the game assembly, so export_presets.cfg excludes `viewtests/*` from the exported pack. justfile recipe `godot-test` (drafts/godot-test.just, tested with just 1.58): runs the command, strips ANSI, fails on ERROR:, fails when no `Passed: [1-9]`, else returns the engine's exit code; add it to `check`. \
GdUnit4Net, tested: its VSTest adapter makes `dotnet test --solution` refuse the solution under global.json's Microsoft.Testing.Platform runner (message: All projects must use that test runner. The following test projects are using VSTest); non-engine logic tests do run through `dotnet vstest <dll>` (1 passed), an engine-runtime test was not run. README targets Godot 4.4; last stable v5.0.0 2025-06-21, 5.1.0 has been a release candidate since 2025-09 (rc5 2026-06-21). It becomes an option only if MTP support lands"""
config = [
    { path = "Directory.Packages.props", contains = "Chickensoft.GoDotTest" },
    { path = "{root}/viewtests/TestEntry.cs", contains = "ShouldRunTests" },
    { any = [{ path = "justfile", contains = "--run-tests" }, { path = "Makefile", contains = "--run-tests" }] },
]
gate = "--run-tests"

[[role]]
role = "surface-integrity"
tool = """tools/check_godot.py (stdlib python, no editor): every .tscn/.tres has a valid header and no garbage line, every ext_resource path exists and its uid equals the target's .uid/.import/header uid, every ExtResource/SubResource id is declared, no ext_resource is unused; every .cs/.gd/.gdshader has its .uid; Godot.NET.Sdk major.minor equals project.godot config/features. \
Why not the import log alone: `godot --headless --import` only loads what the editor loads (run/main_scene and gui/theme/custom). Tested on 4.7.2 against a scratch copy of lifesim: a broken script ext_resource, a garbage line or an undeclared ExtResource in NeedPanel.tscn (not the main scene) printed NO error; the same broken ext_resource in the main scene or theme.tres did, but a garbage line in the main scene did not. The script was seen red on all of these plus a missing .uid, a bad uid and a version skew, green on lifesim's 6 scenes/resources (theme.tres is 900+ lines). \
Known gap: the script cannot see a wrong resource type or an unknown node class; only the engine can, so the ERROR: scan of the import (build row) and of the test run (tests row) stay"""
install = """copy drafts/check_godot.py to tools/check_godot.py; justfile: `godot-surface:` `python3 -I tools/check_godot.py {root} {root}/Game.Godot.csproj`, in `check` (needs no Godot binary, so it also runs where the editor is absent). Run with `python3 -I` so a stray module in the folder cannot shadow the stdlib"""
config = [
    { path = "tools/check_godot.py" },
    { any = [{ path = "justfile", contains = "check_godot" }, { path = "Makefile", contains = "check_godot" }] },
]
gate = "check_godot"

[[role]]
role = "architecture"
tool = "the engine-free core cannot resolve GodotSharp (MSBuild error target keyed on a project property); the Godot csproj references the composition project only (the dotnet.toml AllowedRefs guard, NsDepCop and BannedApiAnalyzers apply); ArchUnitNET for the rest; the analyzer misfires that only exist in the Godot folder are switched off by path in .editorconfig"
install = """Directory.Build.props: Target ForbidEngineInCore AfterTargets=ResolveAssemblyReferences, Condition on the core marker property (lifesim: IsSimProject), \
Error when @(ReferencePath) holds GodotSharp or GodotSharpEditor; Godot csproj has one ProjectReference (the composition root) and <AllowedRefs>Sim.Composition</AllowedRefs>. \
Godot csproj also gets `<Using Remove="System.Threading" />` (ImplicitUsings makes `Timer` ambiguous with Godot.Timer, CS0104); never name a namespace `Game.Godot` (it shadows `Godot`). \
.editorconfig section for the Godot folder (each line `dotnet_diagnostic.<ID>.severity = none`, each seen red without it on Godot.NET.Sdk 4.7.2): \
CA1822 and S2325 (scene-wired callbacks stay instance methods), CA2213 (scene tree owns node lifetime), CA2227 ([Export] collections need a setter), \
IDISP004 and SS066 (every GodotObject is IDisposable), NX0002 (`= null!` on [Export] properties), VSTHRD100 and EPC27 (`override async void _Input`); \
beside lifesim's CA1707, IDE1006, CA1812, CA1515. IDISP001/002/003/006 sit in the same family as IDISP004 and are muted the same way when `new Node()` trips them"""
config = [
    { path = "Directory.Build.props", contains = "GodotSharp" },
    { path = ".editorconfig", contains = "CA1822" },
    { path = ".editorconfig", contains = "CA2213" },
    { path = ".editorconfig", contains = "CA2227" },
    { path = ".editorconfig", contains = "IDISP004" },
    { path = ".editorconfig", contains = "VSTHRD100" },
]
gate = "dotnet build"

[[role]]
role = "ci"
# Owner, 2026-10-10: no CI pipelines for Godot projects for now; agents run `just check` locally,
# where the Godot binary is installed (see the build role). The tool below is the answer once CI comes.
tool = "TBD; when CI comes: actions/setup-dotnet (global.json) + chickensoft-games/setup-godot@v2, then `just check`"
untested = "TBD by the owner: Godot projects run their gate on the agent's machine, not in CI"

[[role]]
role = "hooks"
tool = "prek local hook godot-uid: every staged .cs/.gd in the Godot folder has a sibling .uid"
install = """.pre-commit-config.yaml local hook: id: godot-uid / entry: sh -c 'rc=0; for f in "$@"; do [ -f "$f.uid" ] || { echo "missing $f.uid: open the project in the Godot editor and commit it" >&2; rc=1; }; done; exit $rc' -- \
/ language: system / files: ^{root}/.*\\.(cs|gd)$ (escape the dots; {root} as the folder path)"""
config = [{ path = ".pre-commit-config.yaml", contains = "godot-uid" }]

[[role]]
role = "agent-guidance"
tool = "docs/agents/godot.md (engine pin, headless commands, partial/GlobalClass/Signal rules, scene conventions, what never to edit), linked from AGENTS.md"
install = """create docs/agents/godot.md (<= 120 lines): the just recipes; never hand-edit .godot/ or *.uid; scripts must be `partial` (GD0001 is an error), signals are `[Signal] delegate void NameEventHandler`; \
scene-wired callbacks stay instance methods (analyzer exemption lives in .editorconfig); views read snapshots and send commands, no game rules in nodes; \
after editing a .tscn run `just godot-build`; new script means commit its .uid. Link from AGENTS.md: `Godot conventions: docs/agents/godot.md`"""
config = [
    { path = "docs/agents/godot.md" },
    { path = "AGENTS.md", contains = "docs/agents/godot.md" },
]
