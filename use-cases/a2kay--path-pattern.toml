# A UseCase — one consumer PUBLISHES its dependency (glossary: satisfies -> UseCase).
# One file per (consumer x software); the consumer owns it. This is the retention
# claim: the software cannot be retired while an active UseCase points at it (Article VIII;
# the Requester controls retirement, the Owner controls shape -- the two hats).
consumer = "a2kay"
software = "path-pattern"
why = "Every a2kay kind declares where its entities live as one file_pattern; writes resolve it forward, and the index walk, reconcile and watcher read a found path back into id, slug, parent and position."
needs = "resolve(pattern, args) raising PatternError (a2kay turns it into invalid_argument in services/files/placement.py), reverse_match(pattern, path), placeholders, parse (widths), pattern_specificity; {n:N} as a minimum width and {parent_path} spanning folders."
sponsor = "Denis Tomilin"
requester = "a2kay"
status = "active"          # active | retired
