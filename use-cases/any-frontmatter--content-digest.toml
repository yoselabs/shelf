software = "content-digest"
why = "any-frontmatter hand-rolled hashlib.sha256 for a content-hash version of a document: sha256 of its canonical text, stored as the version a checked write compares. The hash is stored or pinned, so the bytes must stay identical to plain sha256 hex."
