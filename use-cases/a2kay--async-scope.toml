# A UseCase — one consumer PUBLISHES its dependency (glossary: satisfies -> UseCase).
# One file per (consumer x software); the consumer owns it. This is the retention
# claim: the software cannot be retired while an active UseCase points at it (Article VIII;
# the Requester controls retirement, the Owner controls shape -- the two hats).
consumer = "a2kay"
software = "async-scope"
why = "a2kay serves MCP over a loopback TCP port and does it repeatedly in one process -- a test suite serving in a loop, a daemon restarting its server, a job dispatching to a spoke. Every one of the three ways that goes wrong is invisible until it is expensive: the previous server poisons the next one, the shutdown never returns, or a failed startup takes the event loop down instead of raising. a2kay learned all three the hard way and kept them in comments in net_transport.py, where the next project would have had to learn them again."
needs = "async_scope.asgi.serve_asgi -- serve an ASGI app on an ephemeral loopback port for the body of an async with, yielding the base URL, with the sse-starlette global cleared before the serve, a bounded grace then an outright cancel on the way out, and a failed startup converted to ServeError before asyncio can re-raise its SystemExit into the loop. Plus bind_loopback for the ephemeral-port idiom. a2kay keeps only the MCP endpoint path and its FastMCP client."
sponsor = "Denis Tomilin"
requester = "a2kay"
status = "active"          # active | retired
