needs = "client_statuses(server, home, which=, applications=) -> tuple[ClientStatus, ...] in menu order over KNOWN_CLIENTS; ClientState (a2kay maps it to its display text in owner/clients.py)."
sponsor = "yoselabs"
requester = "a2kay"
status = "active"          # active | retired
