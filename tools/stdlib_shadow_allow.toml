[allow]
"packages/blueprint/src/blueprint/profile.py" = "imported by ~10 modules and pinned consumers (public module); its sibling secret_scan.py is only run as python -m blueprint.secret_scan (.blueprint/base.just, pre-commit hook), never by path"
