[project]
name = "any-contract"
version = "0.1.0"
description = "The neutral half of a wire contract between two programs: the contract-number handshake, a violation text for a remote that breaks it, and a schema-keys diff that proves a local mirror against the remote's published JSON schema. Standard library only; the codec stays yours."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_contract"]

[tool.ruff]
extend = "../../pyproject.toml"
