[project]
name = "async-scope"
version = "0.4.1"
description = "Async resource lifecycle: LIFO teardown that never strands what it holds, background tasks stopped and waited for in their place, memoized lazy thunks, a thread whose cancel waits for it, and an ASGI app served on a loopback port without the two uvicorn teardown traps."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[project.optional-dependencies]
# `async_scope.asgi` serves a real ASGI app, so it needs a server — base
# async-scope stays dependency-free and the submodule imports uvicorn lazily.
asgi = ["uvicorn>=0.30,<1"]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7", "httpx>=0.28,<1", "sse-starlette>=3.4,<4", "async-scope[asgi]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/async_scope"]
