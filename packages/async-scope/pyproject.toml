[project]
name = "async-scope"
version = "0.1.0"
description = "Async resource lifecycle: LIFO teardown that never strands what it holds, plus memoized lazy thunks."
readme = "README.md"
authors = [{ name = "Denis Tomilin" }]
requires-python = ">=3.11"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/async_scope"]
