[project]
name = "async-scope"
version = "0.3.0"
description = "Async resource lifecycle: LIFO teardown that never strands what it holds, background tasks stopped and waited for in their place, memoized lazy thunks, a thread whose cancel waits for it, and an ASGI app served on a loopback port without the two uvicorn teardown traps."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.11"
license = "Apache-2.0"

[project.optional-dependencies]
# `async_scope.asgi` serves a real ASGI app, so it needs a server — base
# async-scope stays dependency-free and the submodule imports uvicorn lazily.
asgi = ["uvicorn>=0.30,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/async_scope"]
