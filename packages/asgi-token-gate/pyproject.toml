[project]
name = "asgi-token-gate"
version = "0.1.0"
description = "One ASGI middleware that gates every HTTP request on a header token: a static secret compared in constant time, or a live set of minted leases revoked instantly; non-HTTP scopes pass through."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asgi_token_gate"]
