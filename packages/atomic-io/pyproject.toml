[project]
name = "atomic-io"
version = "0.2.0"
description = "Atomic file write (bytes, text, JSON) — tempfile + optional fsync + os.replace, so a crash or a concurrent reader never sees a partial file; keep_mode preserves permissions."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atomic_io"]
