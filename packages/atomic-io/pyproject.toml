[project]
name = "atomic-io"
version = "0.3.0"
description = "Atomic file write (bytes, text, JSON) — tempfile + optional fsync + os.replace, so a crash or a concurrent reader never sees a partial file; atomic_replace_* preserves permissions."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7", "pytest-bdd>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atomic_io"]
