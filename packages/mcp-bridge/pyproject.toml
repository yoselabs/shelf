[project]
name = "mcp-bridge"
version = "0.1.0"
description = "A stdio MCP server that relays every request to a Streamable HTTP MCP server: headers per request, a fresh server session per call, and a call made while the server restarts waits for it."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # >=3.4: the proxy provider and ProxyClient this package wraps.
    "fastmcp>=3.4,<4",
    # The refused connection a waiting call retries is httpx's ConnectError.
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bridge"]
