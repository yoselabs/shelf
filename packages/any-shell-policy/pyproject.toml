[project]
name = "any-shell-policy"
version = "0.1.0"
description = "Quote-aware shell command parsing and a first-block-wins rule runner for tool-call guards."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_shell_policy"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.extend-per-file-ignores]
# One scanner over a shared cursor: splitting it only moves the cursor into every helper.
"src/any_shell_policy/lex.py" = ["C901", "PLR0912", "PLR0915"]
