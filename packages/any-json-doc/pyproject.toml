[project]
name = "any-json-doc"
version = "0.1.0"
description = "One JSON document per file, replaced atomically, read as one of four states: Present, Absent, Torn (half-written or unreadable) or ForeignVersion (another install's schema)."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "atomic-io>=0.2,<1",
]

[tool.uv.sources]
atomic-io = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_json_doc"]

[tool.ruff]
extend = "../../pyproject.toml"
