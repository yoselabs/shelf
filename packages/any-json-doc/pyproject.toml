[project]
name = "any-json-doc"
version = "0.3.0"
description = "One JSON document per file, replaced atomically, read as one of four states: Present, Absent, Torn (half-written or unreadable) or ForeignVersion (another install's schema)."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "atomic-io>=0.2,<1",
    "content-digest>=0.2,<1",
    "process-lock>=0.2,<1",
]

[tool.uv.sources]
atomic-io = { workspace = true }
process-lock = { workspace = true }

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_json_doc"]

[tool.ruff]
extend = "../../pyproject.toml"
