[project]
name = "llm-wobble"
version = "0.6.0"
description = "Stop caring that an LLM's JSON envelope arrives fenced, prose-wrapped, or missing fields — one funnel decodes it, applies a per-field recovery policy, logs every recovery, and returns a token no hand-rolled parse can forge."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_wobble"]
