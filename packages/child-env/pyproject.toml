[project]
name = "child-env"
version = "0.1.0"
description = "The environment a child agent process should get: the caller's own minus what an agent session exports (CLAUDE_*, ANTHROPIC_*, DELEGATE_*, MCP_*, OTEL_*) and credential-looking variables, with keep and drop overrides."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/child_env"]
