[project]
name = "any-pipeline"
version = "0.1.0"
description = "A pipeline as a typed value: async stages composed with >> and gather, every stage bounded by a required Limit, failures recorded per item, never swallowed. Stdlib only."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_pipeline"]

[tool.ruff]
extend = "../../pyproject.toml"
