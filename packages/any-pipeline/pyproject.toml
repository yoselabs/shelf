[project]
name = "any-pipeline"
version = "0.1.0"
description = "A pipeline as a typed value: async stages composed with >> and gather, every stage bounded by a required Limit, failures recorded per item, never swallowed. Stdlib only."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7", "ruff>=0.7,<1", "pyrefly>=1.3,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_pipeline"]

[tool.ruff]
extend = "../../pyproject.toml"
