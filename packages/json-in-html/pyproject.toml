[project]
name = "json-in-html"
version = "0.2.0"
description = "Extract structured JSON embedded in HTML — LD-JSON, microdata, OpenGraph, framework app-state (__NEXT_DATA__/__NUXT_DATA__), window.<var> assignments, and raw JSON response bodies."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "selectolax>=0.3,<1",
]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/json_in_html"]
