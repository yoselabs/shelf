[project]
name = "any-clock"
version = "0.3.0"
description = "A nested phase stopwatch: exactly one phase owns every instant, so per-phase totals always add up to wall time; limits and exempt phases turn that into a budget."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_clock"]

[tool.ruff]
extend = "../../pyproject.toml"
