[project]
name = "any-ttl-cache"
version = "0.1.0"
description = "One owner of the sqlite TTL table: expiry, lazy eviction on read and an injected clock. Callers keep their keying and policy."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["aiosqlite>=0.20,<1"]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_ttl_cache"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.deptry.per_rule_ignores]
# aiosqlite is the connection type in TtlTable's public signature, used only in
# type-checking context (the caller injects an open connection); deptry's runtime scan misses that.
DEP002 = ["aiosqlite"]
