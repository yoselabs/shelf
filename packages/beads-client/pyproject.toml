[project]
name = "beads-client"
version = "0.1.0"
description = "A lean, typed, fail-loud client over the bd (beads) CLI."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beads_client"]

[tool.ruff]
extend = "../../pyproject.toml"
