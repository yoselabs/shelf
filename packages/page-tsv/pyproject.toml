[project]
name = "page-tsv"
version = "0.3.0"
description = "Type-driven, consumer-aware rendering of tool results — Page[T] + a render(value, *, consumer) seam that compresses scalar tables to lean-wire TSV for an LLM and stays plain JSON for code/machine callers."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2,<3",
    "lean-wire>=0.2",
]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/page_tsv"]
