[project]
name = "any-browser"
version = "0.1.0"
description = "Stop caring which headless browser renders a JS page — one BrowserBackend seam over Playwright-API and raw-CDP engines."
readme = "README.md"
authors = [{ name = "Denis Tomilin" }]
requires-python = ">=3.11"
license = "Apache-2.0"
# The seam itself is stdlib-only. The rendering engines are optional: a consumer
# installs whichever it wants and a missing one degrades to RenderOutcome.unavailable.
dependencies = []

[project.optional-dependencies]
# The fast Playwright-API Chromium rung (undetected Playwright fork, vendors its
# own Chromium — install `patchright install chromium` to fetch the binary).
patchright = ["patchright>=1.60,<2"]
# The robust CDP rung.
zendriver = ["zendriver>=0.15,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_browser"]

[tool.deptry.per_rule_ignores]
# patchright / zendriver / camoufox are OPTIONAL engine backends, imported lazily
# inside a try/except ImportError so a missing engine surfaces as
# RenderOutcome.unavailable rather than an import crash. deptry's static scan
# sees the (lazy) imports but they are declared as optional extras, not base
# deps — DEP001 (missing) is wrong (they are intentionally not required) and
# camoufox has no extra at all (fully dormant launcher, one-line re-enable).
DEP001 = ["patchright", "zendriver", "camoufox"]
