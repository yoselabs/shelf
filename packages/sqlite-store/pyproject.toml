[project]
name = "sqlite-store"
version = "0.1.0"
description = "Conservative SQLite-on-disk opens, shared writers, atomic upgrades and revision-guarded updates."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_store"]
