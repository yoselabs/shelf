[project]
name = "stream-proc"
version = "0.15.0"
description = "Run a child in its own session and stream its stdout and stderr lines to callbacks, under a wall timeout, an idle timeout and a stop flag; stop its whole tree (SIGTERM, grace, SIGKILL, sweep of descendants that left the group) and prove it dead; pid-reuse-safe liveness and a process table (pid, ppid, pgid, uid, resident bytes, start token; group_rss(pgid)) on Linux (/proc) and macOS (libproc via ctypes); group_alive(pgid); capture() to the end as one Captured value (exact bytes with a text view), a required timeout, exit 124 on timeout, stdin input, and run_inherited() for inherited stdio; stop_pid(pid, start) stops a process we did not spawn only while its start token matches; popen_registered/run_registered execute a command only after a callback durably registered its identity (run_registered: stdin /dev/null, stderr merged into one log, exec failure after registration as a Result); a SIGTERM or SIGINT (Ctrl-C) that lands during the spawn still stops the child."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_proc"]
