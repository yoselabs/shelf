[project]
name = "stream-proc"
version = "0.2.1"
description = "Run a child in its own session and stream its stdout and stderr lines to callbacks, under a wall timeout, an idle timeout and a stop flag; stop its whole tree (SIGTERM, grace, SIGKILL, sweep of descendants that left the group) and prove it dead; pid-reuse-safe liveness and a process table on Linux (/proc) and macOS (libproc via ctypes); group_alive(pgid); a SIGTERM that lands during the spawn still stops the child."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_proc"]
