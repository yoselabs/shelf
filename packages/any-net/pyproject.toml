[project]
name = "any-net"
version = "0.1.0"
description = "Is the machine online, and does this text say a connection dropped: a DNS/TCP-split probe bounded by a join deadline, an IP-literal fallback, a drop-error matcher and a small on-disk probe cache."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_net"]

[tool.ruff]
extend = "../../pyproject.toml"
