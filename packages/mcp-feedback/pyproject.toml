[project]
name = "mcp-feedback"
version = "0.3.0"
description = "A fixed-schema, agent-invoked feedback tool for any FastMCP server — report_feedback(subject, note, request, response, wanted), OTLP/HTTP-logs transport, two consumer knobs only."
readme = "README.md"
authors = [{ name = "Denis Tomilin" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastmcp>=3,<4",
    "mcp>=1.28,<2",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_feedback"]

[tool.deptry.per_rule_ignores]
# `mcp: FastMCP` is the only use of `fastmcp` in this package (v0.2.0 dropped
# `Context` entirely — design D5 addendum), and it's type-only: the package
# calls `.tool(...)` on whatever object the consumer passes in, duck-typed at
# runtime, never constructing or importing FastMCP itself. Still a real,
# intentional dependency — the type contract IS the API, and it pins a
# compatible version range for consumers — deptry's static scan just can't
# see a TYPE_CHECKING-only import as "used."
DEP002 = ["fastmcp"]
