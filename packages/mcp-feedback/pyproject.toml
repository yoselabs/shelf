[project]
name = "mcp-feedback"
version = "0.1.0"
description = "A fixed-schema, agent-invoked feedback tool for any FastMCP server — report_feedback(subject, note, wanted), OTLP/HTTP-logs transport, two consumer knobs only."
readme = "README.md"
authors = [{ name = "Denis Tomilin" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastmcp>=3,<4",
    "mcp>=1.28,<2",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_feedback"]
