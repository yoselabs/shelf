[project]
name = "timefmt"
version = "0.2.0"
description = "Human strings for durations, spans and counts — fmt_dur (ms / s / m·s), fmt_span and fmt_until (d / h / m), human_count (k / M)."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timefmt"]
