[project]
name = "timefmt"
version = "0.3.0"
description = "Human strings for durations, spans and counts — fmt_dur (ms / s / m·s), fmt_span and fmt_until (d / h / m), human_count (k / M); parse_until and to_epoch read deadlines back to epoch seconds."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7", "pytest-bdd>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timefmt"]
