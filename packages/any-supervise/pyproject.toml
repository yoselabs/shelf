[project]
name = "any-supervise"
version = "0.1.0"
description = "Keep a fleet of detached worker processes honest: a TOML spec, one state file per replica (pid + process start time, so a recycled pid is never signalled), up / status / roll / down / logs, and stale-code detection that needs no cooperation from the worker (a version command's output against the one recorded at start). Rolling restarts keep a lane alive."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "atomic-io>=0.3,<1",
    "child-env>=0.4,<1",
    "process-lock>=0.4,<1",
    "stream-proc>=0.17,<1",
]

[project.scripts]
any-supervise = "any_supervise.__main__:main"

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_supervise"]

[tool.ruff]
extend = "../../pyproject.toml"
