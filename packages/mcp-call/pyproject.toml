[project]
name = "mcp-call"
version = "0.1.0"
description = "Call a tool on a Streamable HTTP MCP server with httpx alone: no MCP SDK and no fastmcp to import, for a short-lived process that makes one call and exits."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    # The only dependency, and the point of the package: ~130 ms to import against ~1 s for the MCP SDK.
    "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_call"]
