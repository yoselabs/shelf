[project]
name = "http-cache"
version = "0.2.0"
description = "A conditional-GET HTTP response cache on sqlite: ETag / Last-Modified / TTL / gzip body, keyed by (url, variant)."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "sqlite-resource",
    "any-ttl-cache",
    "content-digest>=0.2,<1",
]

[tool.uv.sources]
sqlite-resource = { workspace = true }
any-ttl-cache = { workspace = true }
content-digest = { workspace = true }

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/http_cache"]
