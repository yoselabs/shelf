[project]
name = "http-cache"
version = "0.2.0"
description = "A conditional-GET HTTP response cache on sqlite: ETag / Last-Modified / TTL / gzip body, keyed by (url, variant)."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "sqlite-resource",
    "any-ttl-cache",
]

[tool.uv.sources]
sqlite-resource = { workspace = true }
any-ttl-cache = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/http_cache"]
