[project]
name = "plugin-surface"
version = "0.1.0"
description = "Stop caring how an app discovers and wires its plugins — a declarative PluginManifest + directory-walking loader with silent graceful-absence."
readme = "README.md"
authors = [{ name = "Denis Tomilin" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin_surface"]
