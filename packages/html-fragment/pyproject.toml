[project]
name = "html-fragment"
version = "0.1.0"
description = "Convert a server-supplied HTML fragment (a comment body, a Discourse `cooked`, a Habr `textHtml`) into link-preserving markdown or plain text — lxml-backed, entity-decoded."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "lxml>=5,<7",
]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/html_fragment"]
