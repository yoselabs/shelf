[project]
name = "json-match"
version = "0.1.0"
description = "Read and compare a JSON value the way a test step states it: a dotted path into it, a comparison against quoted text, and a subset match that names only the keys it cares about."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/json_match"]
