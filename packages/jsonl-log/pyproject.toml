[project]
name = "jsonl-log"
version = "0.2.0"
description = "An append-only JSON-lines log: one line per write (safe across processes), size and age retention, newest-first reads that skip a line that does not decode, and a byte-cursor reader whose torn last line waits."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonl_log"]
