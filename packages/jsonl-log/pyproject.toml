[project]
name = "jsonl-log"
version = "0.7.0"
description = "An append-only JSON-lines log: one line per write (safe across processes), size and age retention (an opt-in cross-process rotate lock, an atomic rewrite, held handles), newest-first reads that skip a line that does not decode, and a byte-cursor reader whose torn last line waits."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "atomic-io>=0.3,<1",
    "process-lock>=0.4,<1",
    "any-file>=0.3,<1",
]

[tool.uv.sources]
atomic-io = { workspace = true }

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7", "pytest-bdd>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonl_log"]
