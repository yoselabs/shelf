[project]
name = "verb-cli"
version = "0.1.0"
description = "A function signature becomes CLI flags: Annotated Field alias names the flag, description is the help, bool is a paired --flag/--no-flag, a non-scalar is one JSON flag; argparse in, keyword arguments out."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.11"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verb_cli"]
