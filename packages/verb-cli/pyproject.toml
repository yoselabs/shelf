[project]
name = "verb-cli"
version = "0.2.0"
description = "A function signature becomes CLI flags: Annotated Field alias names the flag, description is the help, bool is a paired --flag/--no-flag, a non-scalar is one JSON flag; argparse in, keyword arguments out."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7", "pydantic>=2.13,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verb_cli"]
