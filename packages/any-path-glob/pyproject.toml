[project]
name = "any-path-glob"
version = "0.1.0"
description = "One cached glob dialect for repo-relative paths."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_path_glob"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.extend-per-file-ignores]
# A fixed pseudo-random seed makes the dialect differential sweep reproducible.
"tests/test_glob.py" = ["S311"]
