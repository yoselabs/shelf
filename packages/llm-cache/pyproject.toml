[project]
name = "llm-cache"
version = "0.2.0"
description = "A sqlite-backed TTL cache for LLM completions, keyed on (key, model) and speaking anyllm.Completion."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "aiosqlite>=0.20,<1",
    "anyllm>=0.5,<1",
    "any-ttl-cache",
    "content-digest>=0.2,<1",
]

[tool.uv.sources]
any-ttl-cache = { workspace = true }
content-digest = { workspace = true }
[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cache"]

[tool.deptry.per_rule_ignores]
# aiosqlite is a genuine contract dependency — the connection type in LlmCache's
# public signature — but it is used ONLY in type-checking context (the cache never
# opens a connection itself, the caller injects one), so deptry's runtime-usage
# scan reports it as unused. It is not.
DEP002 = ["aiosqlite"]
