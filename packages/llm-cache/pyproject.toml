[project]
name = "llm-cache"
version = "0.1.2"
description = "A sqlite-backed TTL cache for LLM completions, keyed on (key, model) and speaking anyllm.Completion."
readme = "README.md"
authors = [{ name = "Denis Tomilin" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "aiosqlite>=0.20,<1",
    "anyllm>=0.5,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_cache"]

[tool.deptry.per_rule_ignores]
# aiosqlite is a genuine contract dependency — the connection type in LlmCache's
# public signature — but it is used ONLY in type-checking context (the cache never
# opens a connection itself, the caller injects one), so deptry's runtime-usage
# scan reports it as unused. It is not.
DEP002 = ["aiosqlite"]
