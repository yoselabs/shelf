[project]
name = "content-extract"
version = "0.3.0"
description = "Extract a web page's main content to Markdown plus structured metadata (title, byline, date), headings, and role-classified links."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "convert-md",
    "trafilatura>=1.12,<2",
    "selectolax>=0.3,<1",
]

[tool.uv.sources]
convert-md = { workspace = true }

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_extract"]
