[project]
name = "dom-schema"
version = "0.1.0"
description = "Declared CSS extraction that reports WHY it yielded nothing — separating an empty page from a schema that stopped matching, so a rotted site scraper fails loudly instead of answering 'nothing here' forever."
readme = "README.md"
authors = [{ name = "Denis Tomilin" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "selectolax>=0.3,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dom_schema"]
