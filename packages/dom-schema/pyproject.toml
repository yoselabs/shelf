[project]
name = "dom-schema"
version = "0.1.0"
description = "Declared CSS extraction that reports WHY it yielded nothing — separating an empty page from a schema that stopped matching, so a rotted site scraper fails loudly instead of answering 'nothing here' forever."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "selectolax>=0.3,<1",
]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dom_schema"]
