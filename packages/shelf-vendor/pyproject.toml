[project]
name = "shelf-vendor"
version = "0.1.0"
description = "Vendor shelf packages byte-for-byte into a plugin's skill directory from a recorded shelf tag, record each tree hash in a manifest, check for drift, and warn when a newer shelf tag exists. Standard library only. Sunset: remove when plugins can depend on the shelf directly."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shelf_vendor"]

[tool.ruff]
extend = "../../pyproject.toml"
