[project]
name = "static-page-check"
version = "0.2.0"
description = "Checks for a no-build static web page (plain ES modules, CSS, HTML, vendored files): imports resolve and export what is named, relative asset URLs, sha256 pins, colours only in the tokens file, a gzip budget. Each returns a list of problems."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["content-digest>=0.2,<1"]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/static_page_check"]
