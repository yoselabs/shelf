[project]
name = "static-page-check"
version = "0.1.0"
description = "Checks for a no-build static web page (plain ES modules, CSS, HTML, vendored files): imports resolve and export what is named, relative asset URLs, sha256 pins, colours only in the tokens file, a gzip budget. Each returns a list of problems."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/static_page_check"]
