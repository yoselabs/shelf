[project]
name = "blueprint"
version = "0.1.0"
description = "The check engine behind the shelf's blueprint skill: detects what a repository is, runs every applicable checkpoint in one process, and reports a verdict, evidence and remediation per checkpoint."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.11"
license = "Apache-2.0"

[project.scripts]
blueprint = "blueprint.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blueprint"]
