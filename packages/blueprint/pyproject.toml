[project]
name = "blueprint"
version = "0.1.0"
description = "The check engine behind the shelf's blueprint skill: detects what a repository is, runs every applicable checkpoint in one process, and reports a verdict, evidence and remediation per checkpoint."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[project.scripts]
blueprint = "blueprint.__main__:main"

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7", "codespell>=2.4,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blueprint"]
