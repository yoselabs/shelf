# Stack profile (see python-uv.toml for the format): a package.json that only runs build tools (Tailwind, a bundler step), with the code it
# serves written as plain browser JS and tested by another stack's runner (a Python suite that runs the modules under node).
# Detected, not declared: package.json has scripts, none runs a test or tsc, no TypeScript or test runner is a dependency, no tsconfig.json
# (profile.py `_builds_tooling_only`). Anything else with a package.json is `node`.
# Evidence: a2kay (2026-11-21): package.json compiles Tailwind; ~3k lines of ES modules tested from pytest under node.
# Decisions: strict `tsc` is not required of plain JS (no types to check; checkJs/JSDoc stays an owner choice, not a standard); vitest and its
# coverage are `na` because the other stack's runner and floor judge those tests; the rest stays as the node profile: unproven rows keep warning.
stack = "node-tooling"
extends = "node"  # every role of the node profile, but the three below
status = "provisional"
source = "a2kay onboarding 2026-11-21 (shelf-handoff item 2); the rows below are the node profile's, never run red and green on a consumer"

[[role]]
role = "types"
na = "plain JavaScript: there is no TypeScript to type-check; checkJs/JSDoc is the owner's choice, not a standard the shelf asks for"

[[role]]
role = "tests"
na = "the tests of this code run under another stack's runner; its tests row judges them"

[[role]]
role = "coverage"
na = "the other stack's coverage floor covers the tests that run this code; a JS-side floor would measure nothing"
