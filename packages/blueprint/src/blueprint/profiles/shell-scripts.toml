# Stack profile (see python-uv.toml for the format). A few shell scripts beside a repo's main language (fewer than five,
# in a python, dotnet, node, go or rust repo): helpers, not a stack of their own. The full answer is shell.toml; this keeps its
# linter and strict mode and drops the rest. Research: openspec/changes/blueprint-skill/research/shell-and-secrets.md.
# Raised by a2kay (2026-10-11): one 88-line macOS packaging script would otherwise bring shfmt, hooks and a conventions file.
stack = "shell-scripts"
status = "provisional"
source = "shell-and-secrets.md (2026-10-11), the shell profile's linter row; the tier split from a2kay's audit of shelf bddc07e"

[[role]]
role = "toolchain"
na = "a script has no language version; shellcheck is pinned in mise.toml (ADR 0024)"

[[role]]
role = "formatter"
na = "helper scripts beside the main language: shfmt and its .editorconfig cost more than a few files' layout is worth; five or more scripts make this the full shell stack, which formats"

[[role]]
role = "linter"
tool = "shellcheck 0.11.0 (koalaman/shellcheck; mise `shellcheck`) at its default severity on every tracked script; each disable inline with a reason"
install = "mise.toml: shellcheck = \"0.11.0\"; a `scripts` recipe, `git ls-files -z '*.sh' | xargs -0 -r shellcheck`, a dependency of `check`. Never `-S error`: on a planted script it missed SC2086 (unquoted expansion) and SC2115 (`rm -rf $DIR/*`)"
config = [{ any = [{ path = "justfile", contains = "shellcheck" }, { path = "Makefile", contains = "shellcheck" }, { path = ".pre-commit-config.yaml", contains = "shellcheck" }] }]
gate = "shellcheck"
[[role.alternative]]
label = "the shellcheck-precommit hook, run by the gate's `prek run`"
gate = '(?m)id:\s*shellcheck\b'

[[role]]
role = "types"
na = "strict mode is judged in its own row (stack.shell-scripts.strict-mode), as for the full shell stack"

[[role]]
role = "dependencies"
na = "a script's dependencies are the binaries it calls; the ones the repo installs are pinned in mise.toml (stack.tool-pins)"

[[role]]
role = "tests"
na = "a helper script is exercised by the job it serves (a packaging run, a deploy); a script that needs its own tests has outgrown this tier and belongs in the main language"

[[role]]
role = "coverage"
na = "no floor for helper scripts"

[[role]]
role = "spelling"
na = "the repo-wide spell check reads script comments"

[[role]]
role = "architecture"
na = "scripts are leaf entry points"

[[role]]
role = "hooks"
na = "the gate's shellcheck is enough for a few helpers; the full shell stack adds commit hooks"

[[role]]
role = "agent-guidance"
na = "the main language's conventions file covers its helpers; the full shell stack gets docs/agents/shell.md"
