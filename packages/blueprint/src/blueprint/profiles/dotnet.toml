# Stack profile (see python-uv.toml for the format). .NET 10 SDK, C# 14, late 2026.
# Research: openspec/changes/blueprint-skill/research/dotnet-godot-layering.md (tool, evidence URL + date, verdict per role).
# Every property below can sit in Directory.Build.props or Directory.Packages.props; the config entries accept either.
stack = "dotnet"
status = "provisional"
source = "dotnet-godot-layering.md (2026-10-10 roles; 2026-10-11 linter + architecture re-researched hands-on, scratch solution + Godot 4.7.2 csproj built clean with the adopted set); lifesim is the only consumer"

[[role]]
role = "toolchain"
tool = "global.json pins the SDK (rollForward latestPatch); NuGet lock files (RestorePackagesWithLockFile) committed, locked mode in CI"
install = """dotnet new globaljson --sdk-version <x.y.z> --roll-forward latestPatch; in Directory.Build.props set \
<RestorePackagesWithLockFile>true</RestorePackagesWithLockFile> and <RestoreLockedMode Condition="'$(CI)' != ''">true</RestoreLockedMode>; \
dotnet restore; commit every packages.lock.json"""
config = [
    { path = "global.json", contains = '"version"' },
    { path = "global.json", contains = '"rollForward"' },
    { path = "Directory.Build.props", contains = "RestorePackagesWithLockFile" },
]

[[role]]
role = "formatter"
tool = "CSharpier 1.3.0 as a local dotnet tool (layout only; no dotnet format, no Roslynator.Formatting)"
install = "dotnet new tool-manifest; dotnet tool install csharpier; add .csharpierignore (.godot/, obj/, bin/); make fmt-check runs `dotnet tool restore` then `dotnet csharpier check .`"
config = [{ path = ".config/dotnet-tools.json", contains = "csharpier" }]
gate = "csharpier check"

[[role]]
role = "linter"
tool = """SDK analyzers at AnalysisLevel latest-all + Meziantou.Analyzer + Roslynator.Analyzers + SonarAnalyzer.CSharp, every rule switched on (`dotnet_analyzer_diagnostic.severity = warning`, IDE style category off, four IDE defect rules back on) and warnings as errors; plus Microsoft.VisualStudio.Threading.Analyzers (sync-over-async, async void, unobserved tasks), IDisposableAnalyzers (leaks, returned-disposed), ErrorProne.NET.CoreAnalyzers 0.9.0-beta.4 (unobserved Task, struct equality, swallowed exceptions, `throw e`), SharpSource (ValueTask awaited twice), Nullable.Extended.Analyzer (`!` needs a justification), ReflectionAnalyzers (misspelled reflection targets); severities only in .editorconfig"""
install = """Directory.Build.props: <TreatWarningsAsErrors>true, <AnalysisLevel>latest-all, <EnforceCodeStyleInBuild>true, \
<Deterministic>true, <ContinuousIntegrationBuild Condition="'$(CI)' != ''">true; PackageReference (PrivateAssets=all) Meziantou.Analyzer, Roslynator.Analyzers, SonarAnalyzer.CSharp, \
Microsoft.VisualStudio.Threading.Analyzers, IDisposableAnalyzers, ErrorProne.NET.CoreAnalyzers (Version 0.9.0-beta.4: no stable line exists, pin the beta), SharpSource, Nullable.Extended.Analyzer, ReflectionAnalyzers; \
versions in Directory.Packages.props; make build runs `dotnet build -warnaserror`. \
.editorconfig [*.cs]: `dotnet_analyzer_diagnostic.severity = warning` (most Meziantou/Roslynator/Sonar rules are off by default; this turns them on), then \
`dotnet_analyzer_diagnostic.category-Style.severity = none` and `dotnet_diagnostic.IDE0005/IDE0010/IDE0072/IDE0161.severity = warning` (IDE0010 and IDE0072 catch an enum member missing from a switch even behind `_ =>`), \
and `none` with a reason for MA0038, MA0041 (deprecated duplicates of CA1822) and RCS1181 (fights `// why:` comments). In tests/: EPC29 none (xunit.v3 entry point). \
Never #pragma/SuppressMessage: a path-scoped line in .editorconfig with a reason. Do not add StyleCop, Roslynator.Formatting.Analyzers, Microsoft.CodeAnalysis.CSharp.CodeStyle (needs a newer compiler than the SDK), Philips/CSharpGuidelines/Menees (style packs that contradict the no-file-header rule or duplicate the three packs), \
AsyncFixer/Gu.Analyzers (covered by Threading + ErrorProne), Puma (analyzer crash), ExhaustiveMatching (IDE0010/IDE0072 cover enums). Library repos that publish a NuGet package add Microsoft.CodeAnalysis.PublicApiAnalyzers"""
config = [
    { path = "Directory.Build.props", contains = "<TreatWarningsAsErrors>true" },
    { path = "Directory.Build.props", contains = "<AnalysisLevel>latest-all" },
    { path = "Directory.Build.props", contains = "<EnforceCodeStyleInBuild>true" },
    { path = "Directory.Build.props", contains = "Meziantou.Analyzer" },
    { path = "Directory.Build.props", contains = "Roslynator.Analyzers" },
    { path = "Directory.Build.props", contains = "SonarAnalyzer.CSharp" },
    { path = "Directory.Build.props", contains = "Microsoft.VisualStudio.Threading.Analyzers" },
    { path = "Directory.Build.props", contains = "IDisposableAnalyzers" },
    { path = "Directory.Build.props", contains = "ErrorProne.NET.CoreAnalyzers" },
    { path = "Directory.Build.props", contains = "SharpSource" },
    { path = "Directory.Build.props", contains = "Nullable.Extended.Analyzer" },
    { path = "Directory.Build.props", contains = "ReflectionAnalyzers" },
    { path = ".editorconfig", contains = "dotnet_analyzer_diagnostic.severity = warning" },
    { path = ".editorconfig", contains = "category-Style.severity = none" },
    { path = ".editorconfig", contains = "IDE0010" },
]
gate = "dotnet build"

[[role]]
role = "types"
tool = "nullable reference types enabled, every nullable warning an error"
install = "Directory.Build.props: <Nullable>enable</Nullable> and <WarningsAsErrors>$(WarningsAsErrors);nullable</WarningsAsErrors> (with TreatWarningsAsErrors)"
config = [
    { path = "Directory.Build.props", contains = "<Nullable>enable" },
    { path = "Directory.Build.props", contains = "nullable" },
]
gate = "dotnet build"

[[role]]
role = "dependencies"
tool = "central package management with transitive pinning, NuGetAudit (all, low) with audit warnings as errors; vulnerable or unpinned packages fail the build"
install = """Directory.Packages.props holds every <PackageVersion>; set <ManagePackageVersionsCentrally>true, \
<CentralPackageTransitivePinningEnabled>true, <NuGetAudit>true, <NuGetAuditMode>all, <NuGetAuditLevel>low in Directory.Build.props \
(TreatWarningsAsErrors turns NU1901-NU1904 into errors; add <WarningsNotAsErrors>NU1900 so an offline machine does not fail)"""
config = [
    { path = "Directory.Packages.props" },
    { any = [{ path = "Directory.Packages.props", contains = "ManagePackageVersionsCentrally" }, { path = "Directory.Build.props", contains = "ManagePackageVersionsCentrally" }] },
    { any = [{ path = "Directory.Packages.props", contains = "CentralPackageTransitivePinningEnabled" }, { path = "Directory.Build.props", contains = "CentralPackageTransitivePinningEnabled" }] },
    { any = [{ path = "Directory.Packages.props", contains = "NuGetAuditMode" }, { path = "Directory.Build.props", contains = "NuGetAuditMode" }] },
]
gate = "dotnet build"

[[role]]
role = "tests"
tool = "xunit.v3 (4.0.2) on Microsoft.Testing.Platform; one tests/ project per layer; CsCheck for properties"
install = """global.json: "test": { "runner": "Microsoft.Testing.Platform" }; tests/*/ projects reference xunit.v3 (version in Directory.Packages.props); \
make test runs `dotnet test --solution <sln> --no-build` (no --nologo: MTP rejects it)"""
config = [{ path = "global.json", contains = "Microsoft.Testing.Platform" }]
gate = "dotnet test"

[[role]]
role = "coverage"
untested = "no .NET coverage floor proven: coverlet.MTP 10.1.0 lists --coverlet-threshold but its own page also says threshold validation is unsupported, and Microsoft.Testing.Extensions.CodeCoverage 18.12.0 documents none; never run red/green"

[[role]]
role = "spelling"
tool = "typos (crate-ci) with a committed config; splits identifiers, so it works on C#"
install = "brew install typos-cli (or cargo install typos-cli); typos.toml with [default.extend-words] for domain terms; make check runs `typos`"
config = [{ any = [{ path = "typos.toml" }, { path = "_typos.toml" }, { path = ".typos.toml" }] }]
gate = "typos"

[[role]]
role = "architecture"
tool = """four layers, one rule in one place: (1) an MSBuild target that fails when a project references a project outside its `AllowedRefs`; (2) NsDepCop 3.2.0 (build time, namespace allow/deny, default-deny whitelist, module-to-module rules) via a `config.nsdepcop` per layer project; (3) BannedApiAnalyzers (RS0030 an error) with BannedSymbols.*.txt for members and constructors (DateTime.Now, Random, Guid.NewGuid, platform maths); (4) ArchUnitNET tests (xUnit v3) for cycles, naming, attributes, PlantUML layer diagrams and type-level bans. One architecture-test library per repo (NetArchTest refused: duplicate)"""
install = """(1) Directory.Build.props: Target CheckProjectRefs BeforeTargets=ResolveProjectReferences, Condition `'$(AllowedRefs)' != ''`, builds @(_Ref) from @(ProjectReference->'%(Filename)'), @(_Bad) = @(_Ref) Exclude=$(AllowedRefs), Error when @(_Bad) is not empty; each layer csproj sets <AllowedRefs>. \
(2) Directory.Build.props: `<PackageReference Include="NsDepCop" PrivateAssets="all" />` inside an ItemGroup with Condition `Exists('$(MSBuildProjectDirectory)/config.nsdepcop')` (a project without the file would fail NSDEPCOP03; do not use one root config, it applies to tests too); \
src/<Layer>/config.nsdepcop: `<NsDepCopConfig IsEnabled="true" InheritanceDepth="0">` with `<Allowed From="Ns.*" To="Ns.*" />` lines (anything unlisted is illegal) and `<Disallowed From=".." To=".." />` for module rules. NsDepCop is GPL-2.0-only: fine as a build-time dev dependency, never shipped. \
(3) PackageReference Microsoft.CodeAnalysis.BannedApiAnalyzers (PrivateAssets=all); BannedSymbols.<Rule>.txt at the repo root, one line `T:Namespace.Type;why` (generic ids `Dictionary`2`), added as <AdditionalFiles> in Directory.Build.props, scoped by a property per project kind. It flags constructor calls, member access, typeof, base types and attributes, NOT a type that only appears in a field, property, parameter or foreach (use rule 4 for those). \
(4) tests/<Name>.Architecture references TngTech.ArchUnitNET + TngTech.ArchUnitNET.xUnitV3. Write bans as `.Should().NotDependOnAnyTypesThat()....`; the `NotDependOnAny(Types()...)` object form and `NotCallAny` pass vacuously against BCL types. Run `dotnet test --solution <sln> --no-build`"""
config = [
    { path = "Directory.Build.props", contains = "BannedApiAnalyzers" },
    { path = "Directory.Build.props", contains = "NsDepCop" },
    { path = "Directory.Build.props", contains = "AllowedRefs" },
    { path = "BannedSymbols*.txt" },
    { path = "src/*/config.nsdepcop" },
    { path = "Directory.Packages.props", contains = "TngTech.ArchUnitNET" },
]
gate = "dotnet build"

[[role]]
role = "hooks"
tool = "prek runs `dotnet csharpier check` and typos on staged files (pre-commit); make check on pre-push"
install = """.pre-commit-config.yaml, local hooks after the bd ones: \
- id: csharpier / entry: dotnet csharpier check / language: system / types: [c#]; \
- id: typos / entry: typos --force-exclude / language: system / pass_filenames: true; \
- id: gate / entry: make check / language: system / always_run: true / pass_filenames: false / stages: [pre-push]. \
Do not run dotnet build on pre-commit (seconds to tens of seconds)"""
config = [
    { path = ".pre-commit-config.yaml", contains = "dotnet csharpier check" },
    { path = ".pre-commit-config.yaml", contains = "typos" },
]

[[role]]
role = "agent-guidance"
tool = "docs/agents/dotnet.md (build and test commands, analyzer policy, layering, nullability, comment conventions), linked from AGENTS.md; a short AGENTS.md per top-level code folder"
install = """create docs/agents/dotnet.md (<= 150 lines): commands (make check/build/test/fmt); `Directory.Build.props` and `Directory.Packages.props` are the only places for \
settings and versions; analyzers: never #pragma, add a path-scoped .editorconfig line with a reason; nullability: no `!` outside tests; \
comments: `// why:` for non-obvious decisions (units, determinism, workarounds with a link), `<summary>` on public types of library projects stating the contract and invariants, no file headers, no comment that restates code; \
layering table; test naming. Link it from AGENTS.md with the line `.NET conventions: docs/agents/dotnet.md`"""
config = [
    { path = "docs/agents/dotnet.md" },
    { path = "AGENTS.md", contains = "docs/agents/dotnet.md" },
]
