# Stack profile: the per-stack answer to every concern that has one (CONTEXT.md: stack profile).
# Each [[role]] says which tool, how it is installed, the config that proves it is set up
# (every entry must hold; `{ any = [...] }` holds when one alternative does; `{ path, lacks = "x" }` holds when no file the path
# matches contains x), and the text `just check` must reach to prove it runs (a regex). A role with no config is set up only
# when the gate runs it. The gate's text includes the hook config when the gate runs it (`pre-commit run`, `prek run`).
# A role with `untested` has no proven answer yet; one with `na` does not apply to the stack.
#
# Choosing a tool (owner, 2026-10-10): age alone never disqualifies one. A tool untouched for years
# is fine when it is robust, widely used, and works with the current stack; it is refused only when
# it is abandoned: archived, broken on the current toolchain, or its users have moved to a successor.
# Ecosystems differ (C# and Java tools release rarely); judge by use and compatibility, not by date.
stack = "python-uv"
status = "evidenced"  # evidenced: the shelf and a2kay run it | provisional: written, not yet proven
source = "the shelf's own gate (pyproject.toml, justfile; ADR 0004, 0023)"

[[role]]
role = "toolchain"
tool = "uv, with a committed lockfile and a declared Python range"
install = "uv init; uv lock; commit uv.lock"
config = [
    { path = "uv.lock" },
    # A virtual workspace root has no [project]; .python-version pins it instead.
    { any = [{ path = "pyproject.toml", contains = "requires-python" }, { path = ".python-version" }] },
]
# `uv run` and `uv sync --frozen` never notice a stale lock; only this check does.
gate = "uv lock --check"

[[role]]
role = "formatter"
tool = "ruff format"
install = "uv add --dev ruff; copy [tool.ruff] from the shelf (just bootstrap)"
config = [{ path = "pyproject.toml", contains = "[tool.ruff" }]
gate = "ruff format --check"

[[role.alternative]]
label = "ruff-pre-commit's `ruff-format` hook, run by the gate's `pre-commit run`"
gate = '(?m)id:\s*ruff-format\b'

[[role]]
role = "linter"
tool = "ruff check, the shelf's rule set"
install = "copy [tool.ruff.lint] from the shelf (just bootstrap)"
config = [{ path = "pyproject.toml", contains = "[tool.ruff.lint]" }]
gate = "ruff check"

[[role.alternative]]
label = "ruff-pre-commit's `ruff` hook, run by the gate's `pre-commit run`"
gate = '(?m)id:\s*ruff\s*$'

[[role]]
role = "types"
tool = "pyrefly, strict preset"
install = "uv add --dev pyrefly; copy [tool.pyrefly] from the shelf (just bootstrap)"
# use-ignore-files = false: with ignore files on, a worktree under an ignored path (.claude/worktrees/) checks no file and passes.
config = [
    { path = "pyproject.toml", contains = "[tool.pyrefly]" },
    { path = "pyproject.toml", contains = 'preset = "strict"' },
    { path = "pyproject.toml", contains = "use-ignore-files = false" },
]
gate = "pyrefly check"

[[role]]
role = "spelling"
tool = "codespell"
install = "uv add --dev codespell; copy [tool.codespell] from the shelf"
config = [{ path = "pyproject.toml", contains = "[tool.codespell]" }]
gate = "codespell"

[[role]]
role = "dependencies"
tool = "deptry (unused, missing, transitive)"
install = "uv add --dev deptry"
gate = "deptry"

[[role]]
role = "tests"
tool = "pytest, strict markers"
install = "uv add --dev pytest pytest-xdist"
config = [{ path = "pyproject.toml", contains = "[tool.pytest.ini_options]" }]
gate = "pytest"

[[role]]
role = "coverage"
tool = "pytest-cov with a floor"
install = "uv add --dev pytest-cov; run pytest with --cov-fail-under=<just below current>"
# Coverage is set up when something measures it; a gate that measures without a floor is the failing case.
config = [{ any = [
    { path = "pyproject.toml", contains = "pytest-cov" },
    { path = "pyproject.toml", contains = "[tool.coverage" },
    { path = "justfile", contains = "coverage run" },
    { path = "Makefile", contains = "coverage run" },
    { path = "justfile", contains = "--cov" },
    { path = "Makefile", contains = "--cov" },
] }]
gate = "cov-fail-under"

# coverage.py's own floor is as good: a repo whose C extensions break under the pytest-cov plugin
# (a2kay, duckdb) measures with `coverage run` and enforces the floor with `coverage report`.
[[role.alternative]]
label = "coverage.py's `coverage report --fail-under=<N>`"
gate = '\bcoverage report\b[^\n]*--fail-under'

# The floor in pyproject only bites when the gate runs `coverage report`; `coverage run` alone never checks it.
[[role.alternative]]
label = "`fail_under` in [tool.coverage.report] with a `coverage report` step"
gate = '\bcoverage report\b'
path = "pyproject.toml"
contains = "fail_under"

[[role]]
role = "architecture"
tool = "import-linter (layers, forbidden, independence, acyclic_siblings, protected) for import edges; ruff TID251 banned-api for banned APIs; both read pyproject.toml, one declaration each"
install = "uv add --dev 'import-linter>=2.15,<3'; [tool.importlinter] root_package(s) + [[tool.importlinter.contracts]] in pyproject.toml: a layers contract with containers and exhaustive = true, acyclic_siblings, forbidden (not-installed apps/frameworks via include_external_packages = true); banned APIs in [tool.ruff.lint.flake8-tidy-imports.banned-api] with a msg each, scoped to the core; `arch: uv run lint-imports` in just check; plant a forbidden edge and see it fail"
config = [
    { any = [{ path = "pyproject.toml", contains = "[tool.importlinter" }, { path = ".importlinter" }] },
]
# The banned-api half rides the linter role's `ruff check` gate. Banned APIs are not required in config for
# every repo: a library collection with no core has no clock or random bans; architecture.md says when a list is needed.
gate = "lint-imports"

[[role]]
role = "hooks"
tool = "prek runs ruff check and ruff format --check on staged Python files"
install = "add ruff-check and ruff-format local hooks (types: [python]) to .pre-commit-config.yaml after bd's entries"
config = [{ path = ".pre-commit-config.yaml", contains = "ruff check" }, { path = ".pre-commit-config.yaml", contains = "ruff format" }]

[[role]]
role = "agent-guidance"
tool = "docs/agents/python.md: tools per role, placement, naming, comments, traps"
install = "PYTHONPATH=<shelf>/packages/blueprint/src python3 -m blueprint template --repo ."
config = [{ path = "docs/agents/python.md" }]
