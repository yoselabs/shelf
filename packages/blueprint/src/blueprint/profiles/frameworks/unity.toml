# Framework profile (see ../python-uv.toml for the format). Layers on dotnet.toml for a Unity 6 C# game: the dotnet.toml rules
# apply to the Unity-facing code through the generated solution (`dotnet build <name>.slnx`), and to the engine-free core
# through a hand-written test csproj. The rows here add what is Unity's.
# `{root}` is the folder holding ProjectSettings/ (the Unity project); repo-level files (.gitignore, .gitattributes, justfile,
# .github/workflows, Directory.Build.props, global.json, .editorconfig) stay at the repo root. Paths may be globs (no `**`).
# Detection (profile.py FRAMEWORK_MARKERS): ProjectSettings/ProjectVersion.txt; the root is the folder above ProjectSettings/.
# Research: openspec/changes/blueprint-skill/research/unity-profile.md. Every runtime claim was seen on 6000.7.0b4 (the beta),
# not on the 6000.3 LTS pin: re-run on 6000.3 before the status leaves provisional.
stack = "unity"
status = "provisional"
source = "unity-profile research (2026-10-11): Unity 6000.7.0b4 (6.7 beta, the only editor installed) run headless on a scratch project: EditMode and PlayMode -runTests, compile-error and failing-test exit codes, meta and GUID behaviour, Roslyn analyzer scoping, rsp forwarding, standalone build; .NET 10.0.401 builds of the generated slnx; docs.unity.com 6000.3/6000.6/6000.7 read. Every runtime claim is for 6000.7.0b4, not for the recommended 6000.3 LTS pin. No consumer yet"

[[role]]
role = "framework-version"
tool = "ProjectSettings/ProjectVersion.txt pins the editor (m_EditorVersion 6000.x.y with revision), the newest LTS stream; Packages/packages-lock.json committed; CI and the justfile read the pin from ProjectVersion.txt, never retype it"
install = """Pin = the newest Unity 6 LTS stream: 6000.3.x LTS on 2026-10-11 (support to Dec 2027); move to 6000.7 LTS when it ships (expected Q4 2026, the last Mono release). \
Not 6000.0 LTS (support ends Oct 2026), not the 6.4-6.6 update releases for a product repo (supported only until the next release). Open the project once in the pinned editor: \
Unity writes ProjectVersion.txt (`m_EditorVersion: 6000.3.x`, `m_EditorVersionWithRevision`) and Packages/packages-lock.json; commit both. \
justfile: `unity := env('UNITY', 'unity')`; each Unity recipe is a shebang recipe that reads the pin (`v=$(sed -n 's/^m_EditorVersion: //p' {root}/ProjectSettings/ProjectVersion.txt)`, no backticks in the justfile) \
and fails when `"{{unity}}" -version` differs from it: an editor older or newer than the pin must fail the gate"""
config = [
    { path = "{root}/ProjectSettings/ProjectVersion.txt", contains = "m_EditorVersion: 6000." },
    { path = "{root}/Packages/packages-lock.json", contains = "dependencies" },
]

[[role]]
role = "project-hygiene"
tool = "Library/Temp/Logs/UserSettings/Builds and the generated csproj/slnx ignored (anchored, so a hand-written tests csproj is not); Force Text serialization and Visible Meta Files set; every asset has a committed .meta and every .meta an asset; GUIDs unique (tools/unity_integrity.py, stdlib, in the gate and in prek); .gitattributes with LF"
install = """.gitignore (anchored to the Unity project folder; prefix {root}/ when the project is not the repo root): `/[Ll]ibrary/`, `/[Tt]emp/`, `/[Oo]bj/`, `/[Bb]uild/`, `/[Bb]uilds/`, `/[Ll]ogs/`, `/[Uu]ser[Ss]ettings/`, `/[Mm]emoryCaptures/`, `/*.csproj`, `/*.sln`, `/*.slnx`, `*.pdb`, `*.mdb`, `.vs/`, `.idea/`, `.vscode/`; \
NEVER ignore *.meta, ProjectSettings/, Packages/manifest.json or Packages/packages-lock.json. Never an unanchored `*.csproj` (it would ignore the hand-written tests csproj the dotnet rows need). \
Editor > Project Settings > Editor: Asset Serialization = Force Text, Version Control Mode = Visible Meta Files (both are the 6000.7 defaults; the file then holds `m_SerializationMode: 2` and `m_Mode: Visible Meta Files`). \
.gitattributes: `* text=auto eol=lf`, `*.unity text eol=lf`, `*.prefab text eol=lf`, `*.asset text eol=lf`, `*.meta text eol=lf`. \
`blueprint recipe unity-integrity > tools/unity_integrity.py` (stdlib; seen red on a missing .meta, an orphan .meta, a duplicate GUID, Force Text off, Hidden Meta Files), run as `python3 tools/unity_integrity.py {root}` from `just check`. \
Smart merge (UnityYAMLMerge) is NOT part of this row: the git driver hung opening Apple FileMerge in the trial; see research.md"""
config = [
    { any = [{ path = ".gitignore", contains = "[Ll]ibrary/" }, { path = ".gitignore", contains = "Library/" }] },
    { any = [{ path = ".gitignore", contains = "[Uu]ser[Ss]ettings/" }, { path = ".gitignore", contains = "UserSettings/" }] },
    { path = ".gitattributes", contains = "eol=lf" },
    { path = "{root}/ProjectSettings/EditorSettings.asset", contains = "m_SerializationMode: 2" },
    { path = "{root}/ProjectSettings/VersionControlSettings.asset", contains = "Visible Meta Files" },
    { path = "tools/unity_integrity.py" },
]
gate = "unity_integrity.py"

[[role]]
role = "binary-assets"
tool = "Git LFS for binary asset types via .gitattributes (textures, models, audio, video, fonts, plugins, .unitypackage never committed); every binary's .meta stays a plain text file in git, only the asset goes to LFS"
install = """.gitattributes lines `<pattern> filter=lfs diff=lfs merge=lfs -text` for: png, jpg, jpeg, tga, psd, tif, exr, hdr, fbx, obj, blend, glb, wav, mp3, ogg, mp4, mov, ttf, otf, a, dylib, dll, so, bank. Do NOT list *.meta, *.unity, *.prefab, *.asset, *.mat, *.anim, *.controller (text YAML: LFS would break merge and the integrity script). \
`git lfs install --skip-repo` (prek owns the hooks); CI checkout with `lfs: true`. Size budget: untested (no tool run); candidate `git lfs ls-files --size` against a budget in a just recipe. \
Open, same as Godot: the pre-push LFS upload under prek is unproven"""
config = [{ path = ".gitattributes", contains = "filter=lfs" }]

[[role]]
role = "embedded-script-lint"
untested = "Unity embeds shaders (ShaderLab/HLSL) and UI Toolkit USS/UXML, plus Burst-compiled C# subsets. No HLSL linter was proven. Tried: a shader with an undefined symbol imports with exit 0 and no log line under -batchmode -nographics, and ShaderUtil.ShaderHasError stays false, so the headless editor cannot see shader errors (tested on 6000.7.0b4). A real shader check needs a graphics-enabled editor run; not run here"

[[role]]
role = "build"
tool = "headless editor compile and import: `Unity -batchmode -nographics -quit -projectPath <root> -logFile -` inside just check (exit 1 on a C# compile error, seen), then the tree must stay clean (a new or changed .meta means something was not committed); player build through an -executeMethod script (BuildPipeline.BuildPlayer, exit code from the BuildResult)"
install = """Unity Hub installs the pinned editor (`unityhub -- --headless install --version <v> --changeset <rev>`; the Hub CLI was not run here); UNITY env var points at its binary. justfile: \
`unity-build` (shebang recipe) runs `"{{unity}}" -batchmode -nographics -quit -projectPath {root} -logFile unity-build.log` then `git diff --exit-code -- {root}/Assets {root}/Packages {root}/ProjectSettings && test -z "$(git status --porcelain -- {root}/Assets {root}/Packages {root}/ProjectSettings)"`; add unity-build to the `check` dependencies. \
Cold Library import of a near-empty project took 95 s, warm run about 30 s (6000.7.0b4); real projects take longer, so a team caches Library per ProjectVersion and per git ref in CI. \
Deleting a .meta and importing with a COLD Library gives the asset a NEW GUID (seen: every reference to it breaks); with a warm Library Unity restores the same GUID. So the clean-tree check is only reliable on a cold clone or after `rm -rf Library`. \
Player build: Assets/Editor/CiBuild.cs with `BuildPlayer(...)` and `EditorApplication.Exit(summary.result == Succeeded ? 0 : 1)`, run by `just unity-player` (not in check; macOS Mono standalone built in 2 min 21 s from a cold Library, 6000.7.0b4). Needs the platform module installed. \
License: the Personal license activated in the Hub works headless on a desktop (the log shows a licensing handshake error and still runs, Unity Personal); a CI runner needs GameCI activation (see ci)"""
config = [{ any = [{ path = "justfile", contains = "-batchmode" }, { path = "Makefile", contains = "-batchmode" }] }]
gate = "-batchmode"

[[role]]
role = "tests"
tool = "Unity Test Framework (com.unity.test-framework, builtin 1.9.0 in 6000.7) through `Unity -runTests -testPlatform EditMode|PlayMode -testResults <xml>` in just check; a missing results file is a failure (compile error exits 1 with no XML; failing test exits 2); engine-free logic in noEngineReferences assemblies is tested outside the editor with the dotnet profile's xunit.v3 project (linked sources, LangVersion 9)"
install = """Test assemblies: Assets/Tests/EditMode/<Name>.Tests.EditMode.asmdef (includePlatforms [Editor], references UnityEngine.TestRunner and UnityEditor.TestRunner, overrideReferences true with precompiledReferences nunit.framework.dll, defineConstraints [UNITY_INCLUDE_TESTS]); Assets/Tests/PlayMode/... the same without includePlatforms. \
justfile: `unity-test` (shebang recipe) runs `"{{unity}}" -batchmode -nographics -projectPath {root} -runTests -testPlatform EditMode -testResults "$PWD/results-editmode.xml" -logFile unity-editmode.log`, same for PlayMode (no -quit: -runTests exits itself; seen), then `test -s results-editmode.xml` and a check that result="Passed". Exit codes seen: 0 pass, 2 a test failed, 1 compile error and no XML written. -testResults needs an absolute path. PlayMode ran headless with -nographics (an `async Awaitable Start()` ran). \
Pure core: tests/<Name>.Core.Tests (xunit.v3, Microsoft.Testing.Platform, global.json runner MTP, `dotnet test --project`) with `<Compile Include="../../{root}/Assets/Scripts/Core/**/*.cs" />`, `<LangVersion>9.0</LangVersion>` (seen green; the link makes C# 10+ syntax fail there and in Unity alike). Coverage floor: the dotnet profile's coverage role applies to that project only; Unity-side coverage (com.unity.testtools.codecoverage) is untested"""
config = [
    { any = [{ path = "justfile", contains = "-runTests" }, { path = "Makefile", contains = "-runTests" }] },
    { any = [
        { path = "{root}/Assets/*/*.asmdef", contains = "UnityEngine.TestRunner" },
        { path = "{root}/Assets/*/*/*.asmdef", contains = "UnityEngine.TestRunner" },
        { path = "{root}/Assets/*/*/*/*.asmdef", contains = "UnityEngine.TestRunner" },
    ] },
]
gate = "-runTests"

[[role]]
role = "surface-integrity"
tool = "an editor script run by -executeMethod loads every scene and prefab and fails (exit 3, seen) on a MonoBehaviour with a missing script; with the .meta/GUID checks of project-hygiene this is the whole reference surface the headless editor can see"
install = """Assets/Editor/CiValidate.cs (Editor-only asmdef): for each `t:Scene t:Prefab` under Assets, open it (EditorSceneManager.OpenScene / PrefabUtility.LoadPrefabContents) and sum GameObjectUtility.GetMonoBehavioursWithMissingScriptCount over every Transform; Debug.LogError("MISSING-SCRIPT <path>") and `EditorApplication.Exit(bad == 0 ? 0 : 3)`. \
justfile: `unity-validate` runs `"{{unity}}" -batchmode -nographics -quit -projectPath {root} -executeMethod Game.EditorTools.CiValidate.Run -logFile unity-validate.log`; add to check. Seen red on a scene whose MonoBehaviour pointed at a GUID with no script. \
Not covered, by test: broken texture/material/prefab-variant references (no editor API tried), shader compile errors (headless editor does not compile shaders), Addressables group integrity (not installed). \
-quit with -executeMethod: the method's Exit code wins; without Exit() a throwing method gives exit 1 and a quiet one 0"""
config = [{ any = [{ path = "justfile", contains = "CiValidate" }, { path = "Makefile", contains = "CiValidate" }] }]
gate = "CiValidate"

[[role]]
role = "architecture"
tool = "assembly definitions are the layer map: one .asmdef per layer with explicit `references`, autoReferenced false, and `noEngineReferences: true` on the engine-free core (a UnityEngine use there is a compile error, seen); analyzers run through `dotnet build` of the generated solution with project-scoped PackageReferences and ONE Unity.globalconfig for both the editor compile (-analyzerconfig in each per-asmdef csc.rsp) and dotnet; BannedApiAnalyzers and NsDepCop run on the dotnet side only"
install = """Layers: Game.Core (noEngineReferences true, references []), Game.Runtime (references Game.Core; MonoBehaviours), Game.Editor (includePlatforms [Editor]), tests per layer. A wrong edge is CS0246 at compile; a cycle is an error. This replaces dotnet.toml's AllowedRefs MSBuild guard, which would duplicate the asmdef graph; ArchUnitNET (cycles, naming) stays untested in-editor and runs on the Core test project like any .NET repo. \
Directory.Build.props: every Unity analyzer item is conditioned on the generated project names (`Condition="$(MSBuildProjectName.StartsWith('Game.'))"`), so package projects (UnityEngine.TestRunner, Unity.Rider.Editor) never inherit them; `<GlobalAnalyzerConfigFiles Include="$(MSBuildThisFileDirectory){root}/Assets/Unity.globalconfig" />`. \
{root}/Assets/Unity.globalconfig (`is_global = true`) holds ONLY the Unity exemptions below as `dotnet_diagnostic.<ID>.severity = none`; repo-wide strictness stays in .editorconfig (seen: an ID line in the globalconfig beats the bulk `dotnet_analyzer_diagnostic.severity = warning` in .editorconfig; CA1051 still fired, CA1822 did not). \
Editor compile strictness (measured in lifesim, 6000.7.0b4): a csc.rsp NEXT TO EACH project .asmdef (an .asmref folder gets its target's rsp) applies to that assembly only; Bee's Library/Bee/artifacts/*.dag/<Assembly>.rsp held -nullable:enable and -warnaserror+ for the project assembly and neither for UnityEngine.UI. Content: `-nullable:enable`, `-warnaserror+`, optionally `-analyzerconfig:Assets/Unity.globalconfig`. The row checks every asmdef under {root}/Assets (not Packages/ or Library/) and names each one missing its rsp. \
NEVER {root}/Assets/csc.rsp: it applies to packages compiled from source too; with those two flags com.unity.ugui and com.unity.pipeline produced 1,026 errors and the project's own assemblies never compiled. The row flags it. (A file named <Assembly>.rsp, as the old lab used, is not read: it must be csc.rsp.) .editorconfig is ignored by the Unity compiler (seen). \
Full analyzers keep the generated csproj and `dotnet build` approach. That needs an IDE package (com.unity.ide.visualstudio) in the project for Unity to generate the csproj; generation without one is untested. A name condition in Directory.Build.props (`Condition="$(MSBuildProjectName.StartsWith('Lifesim.'))"`, the project's own prefix) scopes the analyzers to the project's assemblies. \
Future path: Unity 6.7 "Enable MSBuild Compilation (Experimental)" (EditorSettings m_EnableMSBuildCompilationPipeline, `-enable-msbuild`; Unity.Sdk 1.0.76 reads Directory.Build.* only when ProjectSettings/enableDirectoryBuild.config exists, and never for package projects). The docs say it is not for production, and an .asmref broke it in 6.7 alpha 3 (discussions.unity.com/t/1732143). It is the modern path once stable; adopt it then. \
Exemptions (each `none`, each seen firing on Unity code in a dotnet build, unless marked): CA1822 S2325 MA0038 (message methods Awake/Update/OnTriggerEnter look static), RCS1213 (unused private message and field), CS0649 CA1823 RCS1169 (seen) and IDE0044 (unseen) (SerializeField fields; CS0649 and the generated NoWarn: Unity's compile has /nowarn:0649, the generated csproj does not), CA1051 (public fields are Unity's serialized API; prefer [SerializeField] private), RCS1146 IDE0031 IDE0270 (null-conditional on a UnityEngine.Object skips its fake null; IDE ones unseen), CA1508 (flags `go == null` after Destroy as always false, seen), CA2007 MA0004 VSTHRD111 (ConfigureAwait(false) leaves the UnitySynchronizationContext; seen), CA1016 (generated csproj has no assembly version), NSDEPCOP03, IDE0161 and every rule needing C# 10+ (LangVersion is 9.0 through 6000.7). Kept ON: VSTHRD100 EPC27 SS001 S3168 (async void), MA0040 (names destroyCancellationToken), MA0084. \
Tests projects in Unity: CA1707 (underscored test names), CA2211 MA0069 (static probe fields), MA0048 (file name must match type) get a path-scoped `none` in the tests section of .editorconfig. \
Untested: Microsoft.Unity.Analyzers 1.28.0 (2026-09-29; UNT rules plus suppressors for the same message-method warnings), because running it needs a NuGet download; add it as a PackageReference on the Game.* condition and delete every exemption its DiagnosticSuppressors already cover"""
config = [
    { any = [
        { path = "{root}/Assets/*/*.asmdef", contains = '"noEngineReferences": true' },
        { path = "{root}/Assets/*/*/*.asmdef", contains = '"noEngineReferences": true' },
        { path = "{root}/Assets/*/*/*/*.asmdef", contains = '"noEngineReferences": true' },
    ] },
    { path = "Directory.Build.props", contains = "GlobalAnalyzerConfigFiles" },
    { path = "{root}/Assets/Unity.globalconfig", contains = "is_global = true" },
    { path = "{root}/Assets/Unity.globalconfig", contains = "CA1822" },
    { path = "{root}/Assets/Unity.globalconfig", contains = "CA2007" },
]
# Judged in concerns/framework.py (a profile cannot say "for each asmdef"): every project .asmdef under {root}/Assets needs a csc.rsp
# beside it holding -nullable:enable and -warnaserror+, and {root}/Assets/csc.rsp must not exist.
gate = "dotnet build"

[[role]]
role = "ci"
# License activation could not be exercised here. GameCI is live; TBD until the owner decides whether Unity projects get CI.
tool = "TBD; when CI comes: game-ci/unity-test-runner@v4 and game-ci/unity-builder (v4.8.2 / v5.0.1), both read the editor version from ProjectSettings/ProjectVersion.txt; Library cached by hash of Assets, Packages, ProjectSettings; then the dotnet build and dotnet test steps"
untested = "TBD by the owner: license activation is the blocker. GameCI documents a Personal .ulf file in secret UNITY_LICENSE (with UNITY_EMAIL and UNITY_PASSWORD), a Pro serial UNITY_SERIAL, or a license server input (read 2026-10-11, game.ci/docs/github/activation); none was run. Until then agents run `just check` where the pinned editor is installed"

[[role]]
role = "hooks"
tool = "prek local hooks: unity-integrity (python3 tools/unity_integrity.py <root>, stdlib, fast, pre-commit, always_run) and the dotnet profile's csharpier check on staged .cs; just check on pre-push"
install = """.pre-commit-config.yaml local hooks: id: unity-integrity / entry: python3 tools/unity_integrity.py {root} / language: system / always_run: true / pass_filenames: false (it walks Assets and Packages in well under a second on a small project; time it on a big one). \
csharpier is the dotnet.toml hook; `.csharpierignore` gets Library/, Temp/, Logs/, UserSettings/, Builds/, obj/ (seen: `dotnet csharpier check Assets` red on an unformatted file, green on formatted, csharpier 1.3.0). Never a hook that starts the editor"""
config = [{ path = ".pre-commit-config.yaml", contains = "unity-integrity" }]

[[role]]
role = "agent-guidance"
tool = "docs/agents/unity.md (editor pin, headless commands, meta/GUID rules, serialization and fake-null traps, asmdef layer map, analyzer exemptions, what never to edit), linked from AGENTS.md"
install = """create docs/agents/unity.md (<= 140 lines) from the shelf template (`blueprint template`): the just recipes; never hand-edit .meta, Library/, Temp/, generated csproj/slnx; new file means commit its .meta in the same commit; \
`obj == null` on a UnityEngine.Object is the fake-null check, `is null` and `?.` skip it; serialization rules; message-method traps; asmdef layer table; async/Awaitable. \
Link from AGENTS.md: `Unity conventions: docs/agents/unity.md`"""
config = [
    { path = "docs/agents/unity.md" },
    { path = "AGENTS.md", contains = "docs/agents/unity.md" },
]
