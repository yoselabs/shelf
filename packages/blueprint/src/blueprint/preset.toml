# The shelf's linter preset, derived from its own files by `blueprint preset --refresh`. Never hand-edit.

ruff-select = ["A", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "DTZ", "E", "EM", "ERA", "F", "FA", "FBT", "FLY", "FURB", "G", "I", "ICN", "INP", "ISC", "LOG", "N", "PERF", "PIE", "PLC", "PLE", "PLR", "PLW", "PLW1514", "PTH", "PYI", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T10", "T20", "TC", "TID", "TRY", "UP", "W"]
ruff-ignore = ["ANN401", "ISC001", "PLR0913", "PLR2004", "S603", "S607", "TRY003"]
pyrefly-errors = ["deprecated", "missing-super-call", "no-any-return-explicit", "no-any-return-implicit", "unannotated-return", "unnecessary-comparison", "unnecessary-type-conversion", "untyped-import", "unused-ignore", "unused-type-ignore"]

[linters]
pyrefly = "1.3.2"
ruff = "0.17.0"

[shelf-size]
code-file = 400
function = 80
test-file = 800
