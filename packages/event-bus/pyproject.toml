[project]
name = "event-bus"
version = "0.1.0"
description = "In-process synchronous publish/subscribe over one typed event: subscribers held strongly, an idempotent unsubscribe handle, a scoped subscription, delivery over a snapshot."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.11"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_bus"]
