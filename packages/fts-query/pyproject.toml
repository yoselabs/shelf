[project]
name = "fts-query"
version = "0.1.0"
description = "What a search query asks of a SQLite FTS5 index: stemmed words, grep -w exact terms, identifier-only routing, and the index tokenizer's own terms, with an injected letter fold on both sides."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fts_query"]
