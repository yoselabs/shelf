[project]
name = "anyllm"
version = "0.8.1"
description = "Stop caring which LLM provider is underneath — one async completion contract with token/cost accounting and five backends (claude-code-cli/-sdk, codex-cli, anthropic-api, openai-compatible)."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
# Base imports need no provider libraries; every backend dependency is opt-in.
dependencies = []

[project.optional-dependencies]
agent = ["any-agent>=0.1.4,<1"]
anthropic = ["anthropic>=0.40,<1"]
openai = ["openai>=1.50"]
claude-code-sdk = ["claude-agent-sdk>=0.1.80,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyllm"]
