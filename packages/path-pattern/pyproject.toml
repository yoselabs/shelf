[project]
name = "path-pattern"
version = "0.1.0"
description = "Brace path templates both ways: resolve {name} and zero-padded {n:04} placeholders into a path, and read them back out of a path, with a {*_path} placeholder spanning folders."
readme = "README.md"
authors = [{ name = "Denis Tomilin" }]
requires-python = ">=3.11"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/path_pattern"]
