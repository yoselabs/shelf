[project]
name = "test-reach"
version = "0.1.0"
description = "Stop guessing which code a test proves: run named pytest tests in one in-process session and report the functions each one executed, measured per test call only so collection-time imports never count."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["coverage>=7.6,<8", "pytest>=8,<10", "py-symbols>=0.1,<1"]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_reach"]

[tool.ruff]
extend = "../../pyproject.toml"
