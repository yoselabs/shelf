[project]
name = "mcp-result-wire"
version = "0.2.0"
description = "FastMCP result middleware — re-derive a tool's content channel from an encoding plan (token-lean TSV/page-tsv) and project/paginate list results, driven by per-tool registries not framework metadata."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "page-tsv",
    # >=3.4: `ToolResult(is_error=True)` raises TypeError on 3.3.x (see README, sharp edges).
    "fastmcp>=3.4,<4",
    "mcp>=1.28,<2",
]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7", "fastmcp-slim>=3.4,<4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_result_wire"]
