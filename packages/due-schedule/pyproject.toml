[project]
name = "due-schedule"
version = "0.1.0"
description = "Is a recurring job due now? One check over an interval (30s, 15m, 6h, 1d) or a 5-field cron expression and the job's last run: never-run intervals fire at once, never-run crons wait for their next fire, and an invalid spec is never due."
readme = "README.md"
authors = [{ name = "Denis Tomilin" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "croniter>=2,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/due_schedule"]
