[project]
name = "any-frontmatter"
version = "0.1.0"
description = "Stop caring how a markdown file's YAML frontmatter is read, written and versioned: the author's comments kept, one error for every malformation, an atomic write, a content-hash version stable across layout, a write that refuses a stale version, and reads of untyped values that never raise."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["ruamel.yaml>=0.18,<1"]

[project.optional-dependencies]
# Document.with_frontmatter's comment-keeping merge. An extra, not a dependency: a
# consumer that already pins yaml-merge would otherwise get a second source for it.
merge = ["yaml-merge>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_frontmatter"]
