[project]
name = "process-lock"
version = "0.3.0"
description = "One process owns a path: an exclusive flock the kernel drops when its holder dies, with blocking acquire (timeout, waiting callback), a JSON holder record readable without the lock, stale-holder break, optional non-reentrant mode, never inherited by a child."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "stream-proc>=0.10.0,<1",
]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7", "pytest-bdd>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_lock"]
