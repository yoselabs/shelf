[project]
name = "process-lock"
version = "0.2.0"
description = "One process owns a path: an exclusive flock the kernel drops when its holder dies, with blocking acquire (timeout, waiting callback), a JSON holder record readable without the lock, stale-holder break, optional non-reentrant mode, never inherited by a child."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_lock"]
