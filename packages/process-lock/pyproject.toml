[project]
name = "process-lock"
version = "0.1.0"
description = "One process owns a path: an exclusive, non-blocking flock that the kernel drops when its holder dies, re-entrant within a process, never inherited by a child, naming the holder's pid when refused."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.11"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/process_lock"]
