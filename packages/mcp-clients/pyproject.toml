[project]
name = "mcp-clients"
version = "0.1.0"
description = "Which MCP clients are on this machine and which of them name your server: Claude Code, Claude Desktop and OpenCode, each found by program or app and read from its own config, never written."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_clients"]
