[project]
name = "anyembed"
version = "0.5.0"
description = "Stop caring which embedding backend is underneath — a neutral Embedder interface with local transformers (BGE) and llama.cpp (GGUF) backends."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
# The torch backend (`LocalEmbedder`). Not in the base: a host on the GGUF backend alone keeps
# torch out of its install.
transformers = ["torch>=2.4,<3", "transformers>=4.40,<6"]
# The GGUF backend (`LlamaCppEmbedder`). llama-cpp-python builds llama.cpp from source on
# install (Metal on by default on macOS); `huggingface-hub` finds a repo-named file in the
# local cache.
llamacpp = ["llama-cpp-python>=0.3.36,<0.4", "huggingface-hub>=0.24,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyembed"]
