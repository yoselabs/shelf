[project]
name = "anyembed"
version = "0.3.0"
description = "Stop caring which embedding backend is underneath — a neutral Embedder interface with a local transformers (BGE) backend."
readme = "README.md"
authors = [{ name = "Denis Tomilin" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "torch>=2.4,<3",
    "transformers>=4.40,<6",
    "numpy>=1.24,<3",
]

[project.optional-dependencies]
# The GGUF backend (`LlamaCppEmbedder`). llama-cpp-python builds llama.cpp from source on
# install (Metal on by default on macOS); `huggingface-hub` finds a repo-named file in the
# local cache.
llamacpp = ["llama-cpp-python>=0.3.36,<0.4", "huggingface-hub>=0.24,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anyembed"]
