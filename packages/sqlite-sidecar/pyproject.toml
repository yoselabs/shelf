[project]
name = "sqlite-sidecar"
version = "0.2.0"
description = "SQLite sidecar plumbing — open (WAL, autocommit, extensions), transact, code a timestamp, tell corruption from busy, set a damaged file aside; a derived store marked, set aside and rebuilt, and emptied on a schema change."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_sidecar"]
