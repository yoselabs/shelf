[project]
name = "sqlite-sidecar"
version = "0.1.0"
description = "SQLite sidecar plumbing — open (WAL, autocommit, extensions), transact, code a timestamp, tell corruption from busy, set a damaged file aside."
readme = "README.md"
authors = [{ name = "Denis Tomilin" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_sidecar"]
