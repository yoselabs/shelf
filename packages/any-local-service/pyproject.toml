[project]
name = "any-local-service"
version = "0.1.0"
description = "One local ASGI service: browser and header access, public readiness, bounded shutdown and endpoint discovery."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["asgi-token-gate>=0.1,<1", "async-scope[asgi]>=0.4.1,<1", "atomic-io>=0.2,<1", "starlette>=1.3,<2", "uvicorn>=0.30,<1", "anyio>=4,<5"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_local_service"]
