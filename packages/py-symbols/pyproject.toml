[project]
name = "py-symbols"
version = "0.2.0"
description = "Stop walking ast by hand to name Python code: a symbol's source span by dotted name (Class.member), the functions of a module qualified, the function enclosing a line, and a stable hash of one symbol's source."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["content-digest>=0.2,<1"]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_symbols"]

[tool.ruff]
extend = "../../pyproject.toml"
