[project]
name = "any-markdown"
version = "0.1.0"
description = "Read the links out of a markdown document without re-deriving where its code is — [[wikilinks]], code blocks and code spans excluded, read and rewrite."
readme = "README.md"
authors = [{ name = "Denis Tomilin" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["markdown-it-py>=3,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_markdown"]
