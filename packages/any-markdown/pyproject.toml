[project]
name = "any-markdown"
version = "0.4.0"
description = "Read a markdown document without re-deriving its structure — [[wikilinks]] with code excluded, read and rewrite; sections by heading slug and line range; a body fitted into a size budget as its opening plus an outline."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["markdown-it-py>=3,<5"]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_markdown"]
