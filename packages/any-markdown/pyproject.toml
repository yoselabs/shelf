[project]
name = "any-markdown"
version = "0.3.0"
description = "Read a markdown document without re-deriving its structure — [[wikilinks]] with code excluded, read and rewrite; sections by heading slug and line range; a body fitted into a size budget as its opening plus an outline."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["markdown-it-py>=3,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_markdown"]
