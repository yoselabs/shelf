[project]
name = "any-proc"
version = "0.3.0"
description = "Child processes you start and keep: run one to a single JSON result under OS limits and a timeout, or keep one alive with a probe, a start timeout, a graceful stop and a bounded restart budget. Also the CPUs this process may really use (host affinity capped by a container quota)."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_proc"]
