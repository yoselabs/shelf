[project]
name = "any-arch"
version = "0.1.0"
description = "The scaffold of a repo-wide architecture test as one owner: a Rule (a finder over a parsed file plus reasoned allowlist rows), one shared parse per run, exact-count rows, the stale-row check, a planted-violation harness, one failure message, and a debt report. Stdlib only."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_arch"]

[tool.ruff]
extend = "../../pyproject.toml"
