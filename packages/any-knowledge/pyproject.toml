[project]
name = "any-knowledge"
version = "0.1.0"
description = "Decision records (format, generated index, check), the glossary check and the agent-docs templates: knowledge a repo keeps, apart from the blueprint gate. Temporary home: the owner decides the name and where it lives."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_knowledge"]
