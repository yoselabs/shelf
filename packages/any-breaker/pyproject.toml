[project]
name = "any-breaker"
version = "0.1.0"
description = "A pure, fold-based circuit breaker with a replayable ledger and a guard."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_breaker"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.extend-per-file-ignores]
# The guard records any call's failure, whatever it raised, then re-raises it unchanged.
"src/any_breaker/guard.py" = ["BLE001"]
