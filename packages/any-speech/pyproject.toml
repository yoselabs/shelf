[project]
name = "any-speech"
version = "0.6.0"
description = "Stop caring which engine turns speech into words, turns and voices — one Transcript (word times, speakers, provenance) from swappable engines behind small ports, with one model per machine (a flock, a draining queue), a failure record that never stalls a batch, a peak-memory guard and a voice embedding for matching a host across files."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "process-lock>=0.2,<1",
    "any-lease>=0.1,<1",
    "atomic-io>=0.2,<1",
    "content-digest>=0.2,<1",
    "app-dirs>=0.1,<1",
    "verb-cli>=0.2,<1",
    "any-pipeline>=0.1,<1",
    "any-versioned>=0.1,<1",
    "stream-proc>=0.10,<1",
    "child-env>=0.2,<1",
    "any-clock>=0.4,<1",
]

[project.optional-dependencies]
parakeet = ["parakeet-mlx>=0.3", "mlx>=0.22"]
embed = ["sherpa-onnx>=1.10"]

[project.scripts]
any-speech = "any_speech.cli:run"

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_speech"]
