[project]
name = "any-plugin-cache"
version = "0.1.0"
description = "Installed Claude Code plugin versions, pins and rollback, and a format-preserving version bump for plugin.json."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_plugin_cache"]

[tool.ruff]
extend = "../../pyproject.toml"
