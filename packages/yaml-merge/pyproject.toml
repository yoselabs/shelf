[project]
name = "yaml-merge"
version = "0.2.0"
description = "Stop caring that writing a config back destroys the file its author wrote — carry a payload's values into the existing YAML document, and merge two edits of one by structure, keeping every comment, blank line and key the human put there."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["ruamel.yaml>=0.18,<1"]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yaml_merge"]
