[project]
name = "content-digest"
version = "0.2.0"
description = "One canonical hash for a JSON value, a text, bytes or a file — sorted keys, UTF-8, sha256 cut to 12 hex characters — that refuses what JSON cannot say instead of stringifying it."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_digest"]
