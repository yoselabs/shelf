[project]
name = "any-recorded-fixture"
version = "0.1.0"
description = "Record model-call cases and compare replayed text with goldens."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_recorded_fixture"]

[tool.ruff]
extend = "../../pyproject.toml"
