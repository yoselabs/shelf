[project]
name = "any-agent"
version = "0.1.3"
description = "Headless agent CLIs (claude, codex, opencode) behind one Harness protocol: launch spec, each stream line parsed once into typed events, a supervisor that spawns in a session of its own, watches silence, answer grace, stall, the CLI's own log and the network, stops the whole tree, and one outcome ladder from vendor words to a reason."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "stream-proc>=0.4.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/any_agent"]

[tool.ruff]
extend = "../../pyproject.toml"

# The Harness protocol mirrors each vendor CLI's positional shape (summary(rc, out, err, stop, timed_out)) and a harness that has no
# log, export or timeout simply leaves a protocol argument unused: those are the contract, not drift.
[tool.ruff.lint.per-file-ignores]
"src/**" = ["FBT001", "FBT002", "FBT003", "ARG002", "PLR0917"]
"tests/**" = ["ANN", "ARG", "S101", "S104", "S105", "S106", "PLR2004", "PLR0915", "PYI034", "TRY300", "TRY301", "FBT", "SLF", "INP", "T201"]
