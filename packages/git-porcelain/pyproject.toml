[project]
name = "git-porcelain"
version = "0.28.0"
description = "A pure, fail-loud git surface over the git binary — preserving the user's credential/config fidelity."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "stream-proc>=0.10.0,<1",
    "child-env>=0.2.0,<1",
]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7", "pytest-bdd>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_porcelain"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.extend-per-file-ignores]
# These public failure names follow git's conditions and the consumer's existing taxonomy.
"src/git_porcelain/errors.py" = ["N818"]
