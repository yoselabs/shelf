[project]
name = "dir-trust"
version = "0.2.0"
description = "Trust a folder's files on this machine, direnv-style: a content hash over the folder's matching files, a grant store kept outside the folder, and any edit or new file revoking the grant by itself."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["ruamel.yaml>=0.18,<1", "atomic-io>=0.2,<1"]

[dependency-groups]
# The test libraries this package's suite imports, plus what the root conftest and pytest settings load (tests/test_package_tests_declare_their_dependencies.py).
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "hypothesis>=6.100,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dir_trust"]
