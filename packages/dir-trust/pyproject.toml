[project]
name = "dir-trust"
version = "0.1.0"
description = "Trust a folder's files on this machine, direnv-style: a content hash over the folder's matching files, a grant store kept outside the folder, and any edit or new file revoking the grant by itself."
readme = "README.md"
authors = [{ name = "yoselabs" }]
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["ruamel.yaml>=0.18,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dir_trust"]
